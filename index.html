  if(!entry) return;
  entry.beats=Math.max(1,Math.min(16,(entry.beats || 4)+delta));
  state.progressionDeleteConfirm=false;
  renderProgressionView();
  persistProgressionClipboard();
}


function refreshInternalProgressionClipboard(){
  internalProgressionClipboard=state.progression.map(entry=>({
    ...entry,
    tones:[...(entry.tones || [])],
    locked:[...(entry.locked || [])],
    tuning:[...(entry.tuning || STANDARD_TUNING)],
    beats:Math.max(1,Number(entry.beats || 4))
  }));
}


async function persistProgressionClipboard(){
  refreshInternalProgressionClipboard();
  try{
    await navigator.clipboard.writeText(progressionClipboardPayload());
  }catch(_){}
}

function progressionClipboardPayload(){
  const simple=progressionButtonDisplay();
  const payload={
    format:"ChordFretboardProgression",
    version:1,
    progression:state.progression
  };
  return `${simple}\nCFP1 ${JSON.stringify(payload)}`;
}


function parseProgressionPayload(text){
  const marker=text.split(/\r?\n/).find(line=>line.startsWith("CFP1 "));
  if(!marker) return null;
  try{
    const payload=JSON.parse(marker.slice(5));
    if(payload?.format!=="ChordFretboardProgression" || !Array.isArray(payload.progression)) return null;
    return payload.progression;
  }catch(_){
    return null;
  }
}

async function pasteProgression(){
  let incoming=null;

  // Fast, silent path within the current session.
  if(internalProgressionClipboard.length){
    incoming=internalProgressionClipboard.map(entry=>({
      ...entry,
      tones:[...(entry.tones || [])],
      locked:[...(entry.locked || [])],
      tuning:[...(entry.tuning || STANDARD_TUNING)],
      beats:Math.max(1,Number(entry.beats || 4))
    }));
  }else{
    // Cross-session fallback: recover the last copied progression from
    // the persistent system clipboard.
    try{
      const raw=await navigator.clipboard.readText();
      const parsed=parseProgressionPayload(raw);
      if(parsed?.length){
        incoming=parsed.map(entry=>({
          ...entry,
          tones:[...(entry.tones || [])],
          locked:[...(entry.locked || [])],
          tuning:[...(entry.tuning || STANDARD_TUNING)],
          beats:Math.max(1,Number(entry.beats || 4))
        }));

        // Repopulate the fast in-memory clipboard for subsequent pastes.
        internalProgressionClipboard=incoming.map(entry=>({
          ...entry,
          tones:[...(entry.tones || [])],
          locked:[...(entry.locked || [])],
          tuning:[...(entry.tuning || STANDARD_TUNING)]
        }));
      }
    }catch(_){}
  }

  if(!incoming?.length) return;

  const prepared=incoming.map(entry=>({
    ...entry,
    tones:[...(entry.tones || [])],
    locked:[...(entry.locked || [])],
    tuning:[...(entry.tuning || STANDARD_TUNING)],
    voicing:entry.voicing ? {
      ...entry.voicing,
      frets:[...(entry.voicing.frets || [])]
    } : null,
    beats:Math.max(1,Number(entry.beats || 4))
  }));

  const selectedIsValid=
    state.progressionSelected>=0 &&
    state.progressionSelected<state.progression.length;
  const anchorIsValid=
    state.progressionInsertionAnchor>=0 &&
    state.progressionInsertionAnchor<state.progression.length;

  const insertionBase=selectedIsValid
    ? state.progressionSelected
    : anchorIsValid
      ? state.progressionInsertionAnchor
      : -1;

  const index=insertionBase>=0
    ? Math.min(state.progression.length,insertionBase+1)
    : state.progression.length;

  state.progression.splice(index,0,...prepared);
  state.progressionSelected=index+prepared.length-1;
  state.progressionInsertionAnchor=-1;

  refreshInternalProgressionClipboard();
  persistProgressionClipboard();
  renderProgressionButton();
  renderProgressionView();
}
function progressionTone(midinote,start,duration,gain=.04,type="sine"){
  if(!progressionAudioCtx) return;
  const osc=progressionAudioCtx.createOscillator();
  const amp=progressionAudioCtx.createGain();
  osc.type=type;
  osc.frequency.value=440*Math.pow(2,(midinote-69)/12);
  amp.gain.setValueAtTime(0.0001,start);
  amp.gain.exponentialRampToValueAtTime(gain,start+0.012);
  amp.gain.exponentialRampToValueAtTime(0.0001,start+duration);
  osc.connect(amp).connect(progressionAudioCtx.destination);
  osc.start(start);
  osc.stop(start+duration+.03);
}

function progressionMidis(entry){
  const rootPc=ROOT_PC[entry.root];

  // 1.77 — If this progression entry has a committed guitar voicing,
  // derive playback pitches from the actual six-string shape.
  if(entry?.voicing?.frets?.length===6){
    const tuning=Array.isArray(entry.tuning)&&entry.tuning.length===6
      ? entry.tuning
      : STANDARD_TUNING;

    const standardMidi=[40,45,50,55,59,64];
    const voiced=[];

    entry.voicing.frets.forEach((value,stringIndex)=>{
      if(value===null || value===undefined || value==="x") return;

      const fret=Number(value);
      if(!Number.isFinite(fret)) return;

      let tuningOffset=tuning[stringIndex]-STANDARD_TUNING[stringIndex];
      while(tuningOffset>6) tuningOffset-=12;
      while(tuningOffset<-6) tuningOffset+=12;

      voiced.push(standardMidi[stringIndex]+tuningOffset+fret);
    });

    voiced.sort((a,b)=>a-b);

    if(voiced.length){
      return {
        bass:voiced[0],
        chord:voiced.slice(1),
        voiced:true
      };
    }
  }

  // Legacy fallback for unvoiced progression entries.
  let rootMidi=48+rootPc;
  while(rootMidi>55) rootMidi-=12;

  const pcs=[...new Set((entry.tones || []).map(t=>mod12(rootPc+TONE_PC[t])))];
  const chord=pcs.map(pc=>{
    let m=60+pc;
    while(m<rootMidi+7) m+=12;
    while(m>76) m-=12;
    return m;
  }).sort((a,b)=>a-b);

  return {
    bass:rootMidi-12,
    chord,
    voiced:false
  };
}

/* 1.77: saved voicings play actual guitar pitches; unvoiced entries use the legacy fallback. */
function scheduleProgressionEntry(entry,start){
  const beatSec=.6; // 100 bpm, matching Comp-Map
  const {bass,chord}=progressionMidis(entry);
  const beats=Math.max(1,entry.beats || 4);

  for(let beat=0;beat<beats;beat++){
    const t=start+beat*beatSec;
    const dur=beatSec*.80;
    const phase=beat%4;

    if(phase===0){
      progressionTone(bass,t,dur,.075,"triangle");
    }else if(phase===1){
      chord.forEach(m=>progressionTone(m,t,dur,.032,"sine"));
    }else if(phase===2){
      progressionTone(bass,t,dur,.06,"triangle");
      chord.forEach(m=>progressionTone(m,t,dur,.030,"sine"));
    }else{
      chord.forEach(m=>progressionTone(m,t,dur,.030,"sine"));
    }
  }

  return beats*beatSec;
}

function clearProgressionPlayingHighlight(){
  document.querySelectorAll(".progression-entry.playing").forEach(el=>el.classList.remove("playing"));
}

function stopProgressionPlayback(){
  state.progressionPlaying=false;
  state.progressionPlaybackMode="play";
  if(progressionTimer) clearTimeout(progressionTimer);
  progressionTimer=null;
  progressionPlayIndex=0;
  clearProgressionPlayingHighlight();
  renderProgressionPopup();
  if(state.progressionView) renderProgressionView();
}

async function playNextProgressionChord(){
  if(!state.progressionPlaying || !state.progression.length) return;

  if(progressionPlayIndex>=state.progression.length) progressionPlayIndex=0;
  const index=progressionPlayIndex;
  const entry=state.progression[index];

  state.progressionSelected=index;
  restoreProgressionChord(entry,{preservePanel:true});

  clearProgressionPlayingHighlight();
  const node=document.querySelector(`[data-progression-index="${index}"]`);
  if(node) node.classList.add("playing");
  renderProgressionView();
  requestAnimationFrame(()=>scrollSelectedProgressionIntoView({playback:true}));

  const start=progressionAudioCtx.currentTime+.02;
  const duration=scheduleProgressionEntry(entry,start);

  if(state.progressionPlaybackMode==="hold"){
    // Hold repeats the currently selected progression chord continuously.
    progressionPlayIndex=index;
  }else{
    progressionPlayIndex++;
  }
  progressionTimer=setTimeout(playNextProgressionChord,duration*1000);
}

async function toggleProgressionPlayback(){
  if(state.progressionPlaying){
    stopProgressionPlayback();
    return;
  }
  if(!state.progression.length) return;

  if(!progressionAudioCtx){
    progressionAudioCtx=new (window.AudioContext || window.webkitAudioContext)();
  }
  if(progressionAudioCtx.state==="suspended"){
    await progressionAudioCtx.resume();
  }

  state.progressionView=true;
  closeProgressionPopup();

  state.progressionPlaying=true;
  progressionPlayIndex=0;
  render();
  playNextProgressionChord();
}

async function toggleProgressionViewPlayback(){
  if(progressionDrag.active) finishProgressionHandleDrag({commit:true});

  // Three-state transport:
  // Play -> Hold (repeat current chord) -> Stop.
  if(state.progressionPlaying){
    if(state.progressionPlaybackMode==="play"){
      state.progressionPlaybackMode="hold";
      // playNextProgressionChord will keep the currently sounding/selected
      // chord as the repeat target on the next scheduling pass.
      renderProgressionView();
      return;
    }
    stopProgressionPlayback();
    return;
  }

  if(!state.progression.length || !state.progressionView) return;

  if(!progressionAudioCtx){
    progressionAudioCtx=new (window.AudioContext || window.webkitAudioContext)();
  }
  if(progressionAudioCtx.state==="suspended"){
    await progressionAudioCtx.resume();
  }

  const selected=(state.progressionSelected>=0 && state.progressionSelected<state.progression.length)
    ? state.progressionSelected
    : 0;

  state.progressionPlaying=true;
  state.progressionPlaybackMode="play";
  progressionPlayIndex=selected;
  renderProgressionView();
  playNextProgressionChord();
}


function clearProgressionAutoScroll(){
  if(progressionDrag.autoScrollTimer){
    clearInterval(progressionDrag.autoScrollTimer);
    progressionDrag.autoScrollTimer=null;
  }
}

function progressionRowsForDrop(){
  return [...document.querySelectorAll(".progression-view-entry")]
    .filter(row=>row!==progressionDrag.rowEl && !row.classList.contains("progression-drag-overlay"));
}

function updateProgressionPlaceholder(clientY){
  const list=document.getElementById("progressionViewList");
  const ph=progressionDrag.placeholderEl;
  if(!list || !ph) return;

  const rows=progressionRowsForDrop();
  let placed=false;

  for(const row of rows){
    const rect=row.getBoundingClientRect();
    if(clientY < rect.top + rect.height/2){
      list.insertBefore(ph,row);
      placed=true;
      break;
    }
  }
  if(!placed) list.appendChild(ph);
}

function progressionDropIndex(){
  const list=document.getElementById("progressionViewList");
  const ph=progressionDrag.placeholderEl;
  if(!list || !ph) return progressionDrag.fromIndex;

  // Count only real, non-dragged chord rows before the placeholder.
  const children=[...list.children];
  let count=0;
  for(const child of children){
    if(child===ph) break;
    if(child.classList?.contains("progression-view-entry") &&
       child!==progressionDrag.rowEl){
      count++;
    }
  }
  return Math.max(0,Math.min(state.progression.length-1,count));
}

function startProgressionHandleDrag(row,handle,e,index){
  if(state.progressionPlaying) return;

  const list=document.getElementById("progressionViewList");
  if(!list) return;

  const rect=row.getBoundingClientRect();

  // A deliberately larger opening makes the destination unmistakable.
  const placeholder=document.createElement("div");
  placeholder.className="progression-drop-placeholder";
  placeholder.style.height=`${Math.max(58,Math.round(rect.height*1.5))}px`;
  row.after(placeholder);

  // Render exactly one moving copy outside the scrolling list.
  const overlay=row.cloneNode(true);
  overlay.classList.remove("active");
  overlay.classList.add("progression-drag-overlay");
  overlay.removeAttribute("data-progression-view-index");
  overlay.style.left=`${rect.left}px`;
  overlay.style.top=`${rect.top}px`;
  overlay.style.width=`${rect.width}px`;
  overlay.style.height=`${rect.height}px`;
  document.body.appendChild(overlay);

  // Remove the source from painting entirely. The placeholder owns its space.
  row.classList.add("drag-origin-hidden");

  progressionDrag.active=true;
  progressionDrag.pointerId=e.pointerId;
  progressionDrag.fromIndex=index;
  progressionDrag.rowEl=row;
  progressionDrag.placeholderEl=placeholder;
  progressionDrag.overlayEl=overlay;
  progressionDrag.startClientY=e.clientY;
  progressionDrag.lastY=e.clientY;

  list.classList.add("dragging");

  try{handle.setPointerCapture(e.pointerId)}catch(_){}
}

function positionProgressionOverlay(clientY){
  const overlay=progressionDrag.overlayEl;
  if(!overlay) return;
  const dy=clientY-progressionDrag.startClientY;
  overlay.style.transform=`translate3d(0,${dy}px,0)`;
}

function updateProgressionDragAutoScroll(clientY){
  const list=document.getElementById("progressionViewList");
  if(!list) return;

  const rect=list.getBoundingClientRect();
  const edge=36;
  let direction=0;

  if(clientY<rect.top+edge) direction=-1;
  else if(clientY>rect.bottom-edge) direction=1;

  if(direction===0){
    clearProgressionAutoScroll();
    return;
  }

  clearProgressionAutoScroll();
  progressionDrag.autoScrollTimer=setInterval(()=>{
    if(!progressionDrag.active){
      clearProgressionAutoScroll();
      return;
    }

    const before=list.scrollTop;
    list.scrollTop+=direction*7;

    if(list.scrollTop===before){
      clearProgressionAutoScroll();
      return;
    }

    updateProgressionViewFades();
    updateProgressionPlaceholder(progressionDrag.lastY);
  },32);
}

function updateProgressionHandleDrag(e){
  if(!progressionDrag.active || e.pointerId!==progressionDrag.pointerId) return;

  progressionDrag.lastY=e.clientY;
  positionProgressionOverlay(e.clientY);
  updateProgressionPlaceholder(e.clientY);
  updateProgressionDragAutoScroll(e.clientY);
}

async function finishProgressionHandleDrag({commit=true}={}){
  if(!progressionDrag.active) return;

  clearProgressionAutoScroll();

  const list=document.getElementById("progressionViewList");
  const row=progressionDrag.rowEl;
  const placeholder=progressionDrag.placeholderEl;
  const overlay=progressionDrag.overlayEl;
  const from=progressionDrag.fromIndex;
  const to=progressionDropIndex();

  if(commit && from>=0 && to>=0 && from!==to){
    const [moved]=state.progression.splice(from,1);
    state.progression.splice(to,0,moved);
    state.progressionSelected=to;
    refreshInternalProgressionClipboard();

    persistProgressionClipboard();
  }else if(commit){
    state.progressionSelected=from;
  }

  // Remove drag graphics before repainting the list.
  overlay?.remove();
  placeholder?.remove();
  if(row) row.classList.remove("drag-origin-hidden");
  list?.classList.remove("dragging");

  progressionDrag={
    active:false,
    pointerId:null,
    fromIndex:-1,
    rowEl:null,
    placeholderEl:null,
    overlayEl:null,
    startClientY:0,
    lastY:0,
    autoScrollTimer:null
  };

  renderProgressionButton();
  renderProgressionView();
  requestAnimationFrame(()=>scrollSelectedProgressionIntoView({playback:false}));
}

/* ================================================================
   7. PROGRESSION VIEW & REORDERING
   ================================================================ */
function renderProgressionView(){
  ensureProgressionKeyContexts();
  const panel=document.getElementById("progressionViewPanel");
  const list=document.getElementById("progressionViewList");
  const controls=document.querySelector(".controls");
  if(!panel || !list || !controls) return;

  // Rebuilding the chord rows must not reset the user's/view playback scroll.
  const preservedScrollTop=list.scrollTop;

  controls.classList.toggle("progression-view-active",state.progressionView);

  const viewPlay=document.getElementById("progressionViewPlay");
  if(viewPlay){
    const transportLabel=!state.progressionPlaying
      ? "Play"
      : state.progressionPlaybackMode==="play"
        ? "Hold"
        : "Stop";
    viewPlay.textContent=transportLabel;
    viewPlay.classList.toggle("active",state.progressionPlaying);
    viewPlay.classList.toggle("holding",state.progressionPlaying && state.progressionPlaybackMode==="hold");
    viewPlay.setAttribute(
      "aria-label",
      transportLabel==="Play"
        ? "Play progression from selected chord"
        : transportLabel==="Hold"
          ? "Hold and repeat the current chord"
          : "Stop progression playback"
    );
  }

  renderProgressionViewTools();

  if(!state.progressionView) return;

  if(!state.progression.length){
    list.innerHTML=`<div class="progression-view-empty">No chords yet</div>`;
    return;
  }

  list.innerHTML=state.progression.map((entry,index)=>`
    <div class="progression-view-entry ${index===state.progressionSelected?"active":""} ${index===state.progressionInsertionAnchor?"insertion-anchor":""}"
         data-progression-view-index="${index}"
         role="button"
         tabindex="0">
      <span class="progression-view-entry-label">
        <span class="progression-view-entry-main">${progressionEscapeHtml(progressionEntryDisplay(entry))}</span>
        ${progressionVoicingDisplay(entry)
          ? `<span class="progression-view-entry-voicing">${progressionEscapeHtml(progressionVoicingDisplay(entry))}</span>`
          : ""}
      </span>
      <button type="button"
              class="progression-drag-handle"
              data-progression-drag-index="${index}"
              aria-label="Reorder chord">≡</button>
    </div>
  `).join("");

  list.scrollTop=preservedScrollTop;

  list.querySelectorAll("[data-progression-view-index]").forEach(row=>{
    let pressTimer=null;
    let longPressFired=false;
    let startX=0;
    let startY=0;

    const cancelPress=()=>{
      if(pressTimer){
        clearTimeout(pressTimer);
        pressTimer=null;
      }
    };

    row.onpointerdown=e=>{
      if(e.target.closest(".progression-drag-handle")) return;
      if(state.progressionPlaying || e.isPrimary===false) return;

      longPressFired=false;
      startX=e.clientX;
      startY=e.clientY;
      cancelPress();

      pressTimer=setTimeout(()=>{
        pressTimer=null;
        longPressFired=true;
        const index=Number(row.dataset.progressionViewIndex);
        if(index!==state.progressionSelected) state.progressionViewShowAllTones=false;
        state.progressionSelected=index;
        renderProgressionView();
        try{row.setPointerCapture(e.pointerId)}catch(_){}

        // 1.80: long press goes directly to Voicing.
        progressionActionIndex=index;
        progressionActionSource="view";
        openVoicingSelectorForProgression(index);
      },500);
    };

    row.onpointermove=e=>{
      if(e.target.closest(".progression-drag-handle")) return;
      if(Math.hypot(e.clientX-startX,e.clientY-startY)>10){
        cancelPress();
      }
    };

    row.onpointerup=e=>{
      if(e.target.closest(".progression-drag-handle")) return;
      const wasLong=longPressFired;
      cancelPress();

      if(wasLong){
        e.preventDefault();
        e.stopImmediatePropagation();
        longPressFired=false;
        return;
      }

      if(state.progressionPlaying) return;
      const index=Number(row.dataset.progressionViewIndex);
      const sameSelection=index===state.progressionSelected;
      const entry=state.progression[index];
      const hasAssignedVoicing=Array.isArray(entry?.voicing?.frets) && entry.voicing.frets.length===6;

      // View tap behavior:
      // - selecting a different chord shows its assigned voicing (when present)
      // - tapping the already-selected voiced chord toggles between that exact
      //   fingering and every occurrence of the chord tones on the fretboard
      // - unvoiced chords always use the normal all-tones display
      temporaryVoicingPreviewFrets=null;

      if(sameSelection && hasAssignedVoicing){
        // The chord is already loaded. A repeat tap only changes how the
        // permanent fretboard represents it: assigned voicing <-> all tones.
        state.progressionViewShowAllTones=!state.progressionViewShowAllTones;
        renderFretboard();
      }else{
        state.progressionViewShowAllTones=false;
        state.progressionSelected=index;
        restoreProgressionChord(entry,{preservePanel:true});
      }

      requestAnimationFrame(()=>scrollSelectedProgressionIntoView({playback:false}));
    };

    row.onpointercancel=()=>{
      cancelPress();
      longPressFired=false;
    };

    row.oncontextmenu=e=>e.preventDefault();
  });

  list.querySelectorAll(".progression-drag-handle").forEach(handle=>{
    handle.onpointerdown=e=>{
      if(state.progressionPlaying || e.isPrimary===false) return;
      e.preventDefault();
      e.stopPropagation();

      const index=Number(handle.dataset.progressionDragIndex);
      const row=handle.closest(".progression-view-entry");
      if(!row) return;
      startProgressionHandleDrag(row,handle,e,index);
    };

    handle.onpointermove=e=>{
      if(!progressionDrag.active) return;
      e.preventDefault();
      e.stopPropagation();
      updateProgressionHandleDrag(e);
    };

    handle.onpointerup=e=>{
      if(!progressionDrag.active) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      finishProgressionHandleDrag({commit:true});
    };

    handle.onpointercancel=e=>{
      if(!progressionDrag.active) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      finishProgressionHandleDrag({commit:true});
    };

    handle.onclick=e=>{
      e.preventDefault();
      e.stopPropagation();
    };
    handle.oncontextmenu=e=>e.preventDefault();
  });

  list.onscroll=updateProgressionViewFades;

  renderProgressionViewTools();

  requestAnimationFrame(()=>{
    updateProgressionViewFades();
  });
}


function renderProgressionViewTools(){
  const minus=document.getElementById("progressionViewBeatMinus");
  const plus=document.getElementById("progressionViewBeatPlus");
  const value=document.getElementById("progressionViewBeatValue");
  const paste=document.getElementById("progressionViewPaste");
  const del=document.getElementById("progressionViewDelete");
  if(!minus || !plus || !value || !paste || !del) return;

  const entry=selectedProgressionEntry();
  const selected=!!entry;

  minus.disabled=!selected || (entry?.beats || 4)<=1;
  plus.disabled=!selected || (entry?.beats || 4)>=16;
  value.textContent=selected ? String(entry.beats || 4) : "—";

  // Paste can append even without a selection, but normally inserts at selection.
  paste.disabled=false;

  del.disabled=!selected;
  del.textContent=state.progressionDeleteConfirm ? "Confirm?" : "Delete";
  del.classList.toggle("progression-delete-confirm",state.progressionDeleteConfirm);
}

function updateProgressionViewFades(){
  const panel=document.getElementById("progressionViewPanel");
  const list=document.getElementById("progressionViewList");
  if(!panel || !list || !state.progressionView) return;

  const tolerance=2;
  const moreAbove=list.scrollTop>tolerance;
  const moreBelow=(list.scrollHeight-list.clientHeight-list.scrollTop)>tolerance;

  panel.classList.toggle("has-more-above",moreAbove);
  panel.classList.toggle("has-more-below",moreBelow);
}

function scrollSelectedProgressionIntoView({playback=false}={}){
  const list=document.getElementById("progressionViewList");
  const selected=document.querySelector(".progression-view-entry.active");
  if(!list || !selected) return;

  const rowTop=selected.offsetTop;
  const rowHeight=selected.offsetHeight;
  const rowBottom=rowTop+rowHeight;

  if(playback){
    const itemCenter=rowTop+(rowHeight/2);
    const fixedMiddle=list.clientHeight/2;

    // Leave the beginning stationary. Once the playing chord reaches the
    // middle of the window, follow the progression from there onward.
    if(itemCenter >= fixedMiddle || list.scrollTop>0){
      const target=Math.max(
        0,
        Math.min(
          list.scrollHeight-list.clientHeight,
          itemCenter-fixedMiddle
        )
      );

      // Direct assignment is more reliable than stacking smooth scroll
      // animations in embedded iOS/Dropbox webviews.
      list.scrollTop=target;
    }
  }else{
    // Manual browsing never recenters an already-visible chord.
    const viewTop=list.scrollTop;
    const viewBottom=viewTop+list.clientHeight;

    if(rowTop<viewTop){
      list.scrollTop=rowTop;
    }else if(rowBottom>viewBottom){
      list.scrollTop=Math.max(0,rowBottom-list.clientHeight);
    }
  }

  updateProgressionViewFades();
}

function enterProgressionView(index=state.progressionSelected){
  state.progressionView=true;
  state.progressionViewShowAllTones=false;

  if(!state.progression.length){
    state.progressionSelected=-1;
    closeProgressionPopup();
    render();
    renderProgressionView();
    return;
  }

  if(index<0 || index>=state.progression.length) index=0;
  state.progressionSelected=index;

  closeProgressionPopup();
  restoreProgressionChord(state.progression[index],{preservePanel:true});
  requestAnimationFrame(()=>scrollSelectedProgressionIntoView({playback:false}));
}

function exitProgressionView(){
  if(progressionDrag.active) finishProgressionHandleDrag({commit:true});
  if(state.progressionPlaying) stopProgressionPlayback();
  state.progressionEditIndex=-1;
  state.progressionEditOriginal=null;
  state.progressionView=false;
  state.progressionViewShowAllTones=false;
  state.progressionInsertionAnchor=-1;

  const panel=document.getElementById("progressionViewPanel");
  if(panel){
    panel.style.height="";
    panel.classList.remove("has-more-above","has-more-below");
  }

  // Leaving progression activity always returns to the top-level builder
  // orientation: ROOT in Guided Manual, TRIAD in Fully Diatonic.
  state.panel="root";
  render();
}

function viewSelectedProgressionChord(){
  if(!state.progression.length) return;
  const index=(state.progressionSelected>=0 && state.progressionSelected<state.progression.length)
    ? state.progressionSelected
    : 0;
  enterProgressionView(index);
}

function alignProgressionDock(){
  const dock=document.getElementById("progressionDock");
  const viewPlayDock=document.getElementById("progressionViewPlayDock");
  const controls=document.querySelector(".controls");
  const bottomTools=document.getElementById("bottomTools");
  if(!dock || !controls || !bottomTools) return;

  const controlsRect=controls.getBoundingClientRect();
  const toolsRect=bottomTools.getBoundingClientRect();

  // Stable location: Progression sits directly above Reset + Info.
  const gap=10;
  const top=toolsRect.top-controlsRect.top-dock.offsetHeight-gap;
  dock.style.top=`${Math.max(0,top)}px`;

  // In View mode, Play occupies one control-height immediately above Progression.
  if(viewPlayDock){
    const playGap=7;
    const playTop=top-viewPlayDock.offsetHeight-playGap;
    viewPlayDock.style.top=`${Math.max(0,playTop)}px`;
  }
}

function sizeProgressionViewPanel(){
  const panel=document.getElementById("progressionViewPanel");
  const stack=document.querySelector(".panel-stack");
  const viewPlayDock=document.getElementById("progressionViewPlayDock");
  if(!panel || !stack || !viewPlayDock || !state.progressionView) return;

  const stackRect=stack.getBoundingClientRect();
  const playRect=viewPlayDock.getBoundingClientRect();

  // Stop the dedicated view panel above View Play. This removes roughly
  // one chord-row of visible list height and leaves both lower controls clear.
  const gap=10;
  const available=Math.max(120,playRect.top-stackRect.top-gap);
  panel.style.height=`${available}px`;

  requestAnimationFrame(updateProgressionViewFades);
}

function showInfoPopup(help){
  if(!help) return;
  const overlay=document.getElementById("infoOverlay");
  const popup=document.getElementById("infoPopup");

  popup.innerHTML=`
    <div class="info-popup-title">${help.title}</div>
    ${infoRowsHtml(help.rows || [])}`;

  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden","false");
}

function hideInfoPopup(){
  const overlay=document.getElementById("infoOverlay");
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
}

function renderInfoButton(){
  const btn=document.getElementById("infoButton");
  if(!btn) return;
  btn.classList.toggle("active",!!state.infoMode);
  btn.setAttribute("aria-pressed",state.infoMode?"true":"false");
}

function toggleInfoMode(){
  state.infoMode=!state.infoMode;

  if(state.infoMode){
    hideGuidance();

    closeKeyPopup();
    closeTuningPopup();

function suppressViewEditGesture(e){
  if(!suppressPostViewEditPointer) return;

  if(
    suppressPostViewEditPointerId!==null &&
    e.pointerId!==undefined &&
    e.pointerId!==suppressPostViewEditPointerId
  ){
    return;
  }

  e.preventDefault();
  e.stopImmediatePropagation();

  if(e.type==="pointerup" || e.type==="pointercancel"){
    suppressPostViewEditPointerId=null;

    setTimeout(()=>{
      if(suppressPostViewEditPointerId===null){
        suppressPostViewEditPointer=false;
      }
    },80);
  }

  if(e.type==="click"){
    suppressPostViewEditPointer=false;
    suppressPostViewEditPointerId=null;
  }
}

  if(e.target.closest("#infoPopup") || e.target.closest("#infoOverlay")){
    e.preventDefault();
    e.stopImmediatePropagation();

  if(help) showInfoPopup(help);
}

function bindChordControl(){
  const el=document.getElementById("chordControl");
  if(!el) return;

  let timer=null;
  let fired=false;
  let tracking=false;
  let startX=0;
  let startY=0;
  let pointerId=null;
  let touchFallbackActive=false;

  const clearTimer=()=>{
    if(timer){
      clearTimeout(timer);
      timer=null;
    }
  };

  const beginLongPress=(x,y)=>{
    clearTimer();

    tracking=true;
    fired=false;
    startX=x;
    startY=y;

    timer=setTimeout(()=>{
      timer=null;
      if(!tracking) return;
      fired=true;
      if(state.progressionPlaying) return;
      showLeadingChordPopup();
    },500);
  };

  const moveLongPress=(x,y)=>{
    if(!tracking) return;
    if(Math.hypot(x-startX,y-startY)>18){
      tracking=false;
      clearTimer();
    }
  };

  const endLongPress=()=>{
    clearTimer();
    tracking=false;
    pointerId=null;
    touchFallbackActive=false;
  };

  // Primary path for browsers/webviews with reliable Pointer Events.
  el.onpointerdown=e=>{
    if(e.isPrimary===false) return;

    pointerId=e.pointerId;
    beginLongPress(e.clientX,e.clientY);

    try{el.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  };

  el.onpointermove=e=>{
    if(pointerId!==null && e.pointerId!==pointerId) return;
    moveLongPress(e.clientX,e.clientY);
  };

  el.onpointerup=e=>{
    if(pointerId!==null && e.pointerId!==pointerId) return;
    const wasLong=fired;
    e.preventDefault();
    e.stopPropagation();
    endLongPress();

    // A normal tap on the large chord display closes the rich chord popup.
    if(!wasLong){
      const overlay=document.getElementById("leadingOverlay");
      if(overlay?.classList.contains("show")) hideLeadingChordPopup();
    }
  };

  el.onpointercancel=e=>{
    if(pointerId!==null && e.pointerId!==pointerId) return;
    endLongPress();
  };

  // Dropbox Preview on iOS can occasionally lose a pointer sequence after
  // layout changes. Touch Events provide a fallback for that host.
  el.ontouchstart=e=>{
    if(pointerId!==null) return; // Pointer Events already own this gesture.
    const t=e.touches?.[0];
    if(!t) return;

    touchFallbackActive=true;
    beginLongPress(t.clientX,t.clientY);
    e.preventDefault();
  };

  el.ontouchmove=e=>{
    if(!touchFallbackActive) return;
    const t=e.touches?.[0];
    if(!t) return;
    moveLongPress(t.clientX,t.clientY);
    e.preventDefault();
  };

  el.ontouchend=e=>{
    if(!touchFallbackActive) return;
    const wasLong=fired;
    e.preventDefault();
    e.stopPropagation();
    endLongPress();

    if(!wasLong){
      const overlay=document.getElementById("leadingOverlay");
      if(overlay?.classList.contains("show")) hideLeadingChordPopup();
    }
  };

  el.ontouchcancel=()=>{
    if(touchFallbackActive) endLongPress();
  };

  el.onclick=e=>{
    e.preventDefault();
    e.stopPropagation();
  };

  el.oncontextmenu=e=>e.preventDefault();
  wireLeadingPopupTapToClose();
}

/* ================================================================
   1.33 STEP 2 — PROGRESSION → EDIT / VOICING → SAVED FINGERING
   Uses Comp-Map's reusable Voicing Engine. A selected fingering is stored on
   the individual progression entry, so repeated chords may later have different voicings.
   ================================================================ */
let progressionActionIndex=-1;
let progressionActionSource="popup";
let temporaryVoicingSelection="";
let temporaryVoicingArmedId="";
let temporaryVoicingPreviewFrets=null;
let currentVoicingCandidates=new Map();
let voicingInversionIndex=0; // 0 = implicit root position; 1..4 = inversion
let voicingControlPage=""; // "" = both control rows collapsed
let voicingContextNearby=false;       // spatial ranking when prior voiced chord exists
let voicingContextVoiceLeading=false; // 1.76 display-only quality badges; no ranking effect
let voicingSpreadPreference=100;       // 0=Compact, 100=Stretch/current behavior

function entryRootPc(entry){
  if(!entry || !entry.root) return null;
  const pc=ROOT_PC[entry.root];
  return Number.isFinite(pc) ? pc : null;
}

function entryEngineChordSpec(entry){
  const rootPc=entryRootPc(entry);
  if(rootPc===null || !window.VoicingEngine) return null;
  const tones=orderedUnique([...(entry.tones || [])]).filter(t=>Number.isFinite(TONE_PC[t]));
  if(!tones.length) return null;
  const allowed=[...new Set(tones.map(t=>TONE_PC[t]))];
  if(!allowed.includes(0)) allowed.unshift(0);

  // 1.53 — Match Comp-Map's compact/jazz omission logic more closely.
  //
  // Required:
  //   • identity-defining tones (3/♭3, sus2/sus4, altered 5ths, etc.)
  //   • explicitly active color/alteration tones (6, 9s, 11s, 13s)
  //   • a 7th when it is the highest defining color of the chord
  //
  // Usually optional:
  //   • the perfect 5th
  //   • the root in seventh/extended chords (permits rootless voicings)
  //   • an implicit 7th when a higher extension is present
  const identityLocked=new Set(entry.locked || []);
  const higherColorLabels=new Set(["♭9","9","#9","11","#11","♭13","13"]);
  const activeHigherColor=tones.some(t=>higherColorLabels.has(t));
  const hasSeventh=tones.some(t=>t==="♭7" || t==="7" || t==="𝄫7");
  const extendedHarmony=hasSeventh || activeHigherColor || tones.includes("6");

  const required=[...new Set(allowed.filter(interval=>{
    const labels=tones.filter(t=>TONE_PC[t]===interval);

    // Root: keep it for simpler chords; allow omission in seventh/extended harmony.
    if(interval===0) return !extendedHarmony;

    // Perfect fifth is a conventional omission unless it is altered.
    if(interval===7 && labels.includes("5")) return false;

    // Locked identity tones remain defining. (This includes ♭5/#5 where relevant.)
    if(labels.some(t=>identityLocked.has(t))) return true;

    // Higher extensions and altered color tones explicitly present in the
    // Chord Compass chord remain required.
    if(labels.some(t=>higherColorLabels.has(t))) return true;

    // 6 is defining when explicitly selected.
    if(labels.includes("6")) return true;

    // A seventh may be omitted when a higher extension is present; otherwise
    // it remains required for a seventh chord.
    if(labels.some(t=>t==="♭7" || t==="7" || t==="𝄫7")){
      return !activeHigherColor;
    }

    // Altered fifths are defining even though the natural fifth is optional.
    if(labels.some(t=>t==="♭5" || t==="#5")) return true;

    return false;
  }))];
  const optional=allowed.filter(i=>!required.includes(i));
  const forbidden=Array.from({length:12},(_,i)=>i).filter(i=>!allowed.includes(i));
  const templateName=`CC:${entry.name || entry.root}:${allowed.join("-")}`;
  VoicingEngine.CHORDS[templateName]={required,optional,forbidden};
  const labels={};
  tones.forEach(t=>{ labels[TONE_PC[t]]=t; });
  if(typeof VoicingEngine.setDegreeLabelOverrides==="function"){
    VoicingEngine.setDegreeLabelOverrides(templateName,labels);
  }
  return {templateName,rootPc,tones,allowed};
}

function voicingDistinctToneIntervals(entry){
  const tones=orderedUnique([...(entry?.tones || [])]).filter(t=>Number.isFinite(TONE_PC[t]));
  const result=[];
  tones.forEach(t=>{
    const interval=TONE_PC[t];
    if(!result.includes(interval)) result.push(interval);
  });
  if(!result.includes(0)) result.unshift(0);
  else if(result[0]!==0){
    result.splice(result.indexOf(0),1);
    result.unshift(0);
  }
  return result;
}

function voicingLowestInterval(item,entry){
  const shape=item?._ccShape || [];
  const rootPc=entryRootPc(entry);
  if(rootPc===null || shape.length!==6) return null;
  const tuning=Array.isArray(entry?.tuning)&&entry.tuning.length===6 ? entry.tuning : STANDARD_TUNING;
  let lowest=null;
  shape.forEach((value,stringIndex)=>{
    if(value==="x") return;
    const fret=Number(value);
    if(!Number.isFinite(fret)) return;
    const pitch=tuning[stringIndex]+fret;
    if(lowest===null || pitch<lowest.pitch){
      lowest={pitch,pc:mod12(tuning[stringIndex]+fret)};
    }
  });
  return lowest ? mod12(lowest.pc-rootPc) : null;
}

function voicingMatchesCurrentInversion(item,entry){
  const intervals=voicingDistinctToneIntervals(entry);
  const target=intervals[voicingInversionIndex] ?? 0;
  return voicingLowestInterval(item,entry)===target;
}

  host.querySelectorAll("[data-voicing-inversion]").forEach(btn=>{

      const inversion=Number(btn.dataset.voicingInversion)||0;

    };
  });
}

function generateVoicingsForEntry(entry){
  const spec=entryEngineChordSpec(entry);
  if(!spec) return [];
  try{
    const inversionIntervals=voicingDistinctToneIntervals(entry);
    const bassDegree=inversionIntervals[voicingInversionIndex] ?? 0;

    // Use Comp-Map's native bass-degree constraint during generation.
    // The engine walks strings low-to-high and requires the first sounding
    // string to match bassDegree, so inversion is defined at the source.
    const response=VoicingEngine.generateVoicings({
      chordName:spec.templateName,
      rootPc:spec.rootPc,
      tuning:Array.isArray(entry.tuning)&&entry.tuning.length===6 ? entry.tuning : STANDARD_TUNING,
      neckRange:[0,15],
      maxSpan:5,
      bassDegree,
      maxResults:160,
      voicingType:"all",
      openStringsMode:"optional"
    });
    const raw=Array.isArray(response) ? response : (response?.analyzed || response?.results || response?.voicings || []);
    const seen=new Set();
    return raw.filter(item=>{
      const shape=(item.shape || item.frets || []).map(v=>v===null||v===undefined?"x":String(v));
      if(shape.length!==6) return false;
      const key=shape.join(",");
      if(seen.has(key)) return false;
      seen.add(key);
      item._ccShape=shape;
      item._ccFamily=typeof VoicingEngine.physicalFamilyForVoicing==="function" ? VoicingEngine.physicalFamilyForVoicing(item) : "other";

      // Record the chord degrees actually sounding in this particular voicing.
      // This uses the progression entry's own tone spelling, so an extension
      // such as ♭9 or #11 keeps its Chord Compass label rather than being
      // respelled from pitch class alone.
      const tuning=Array.isArray(entry.tuning)&&entry.tuning.length===6 ? entry.tuning : STANDARD_TUNING;
      const soundingIntervals=new Set();
      shape.forEach((value,stringIndex)=>{
        if(value==="x") return;
        const fret=Number(value);
        if(!Number.isFinite(fret)) return;
        const pitchPc=mod12(tuning[stringIndex]+fret);
        soundingIntervals.add(mod12(pitchPc-spec.rootPc));
      });
      item._ccToneStatus=spec.tones.map(tone=>{
        const interval=TONE_PC[tone];
        const tonePc=mod12(spec.rootPc+interval);
        return {
          label:tone,
          present:soundingIntervals.has(interval),
          inKey:isInReferenceKey(tonePc)
        };
      });
      return true;
    });
  }catch(error){
    console.warn("Chord Compass voicing generation failed",error);
    return [];
  }
}

/* 1.46: first-position mini diagrams show frets 1–4; higher-position fret labels moved left. */

function voiceLeadingBadgeHtml(item){
  if(!voicingContextVoiceLeading) return "";
  const score=item?._ccVoiceLeadingScore;
  if(!Number.isFinite(score)) return "";

  // Two absolute quality tiers. Lower raw score is better.
  // <= 8  : especially strong connection -> stacked VL / VL
  // <= 16 : good connection             -> single VL
  // > 16  : no visual annotation
  if(score<=8){
    return `<div class="voicing-vl-badge double"><span>VL</span><span>VL</span></div>`;
  }
  if(score<=16){
    return `<div class="voicing-vl-badge single"><span>VL</span></div>`;
  }
  return "";
}

function miniDiagramHtml(item,index){
  const shape=item._ccShape || (item.shape || item.frets || []).map(v=>v==null?"x":String(v));
  const fretted=shape.map(v=>Number(v)).filter(v=>Number.isFinite(v) && v>0);
  const minFret=fretted.length ? Math.min(...fretted) : 1;
  const maxPlayedFret=fretted.length ? Math.max(...fretted) : 1;

  // Standard chord-diagram windowing:
  // • first-position shapes always show frets 1–4 with no fret number
  // • higher-position shapes that span fewer than three frets show one blank
  //   fret above the shape; the second visible fret carries its fret number
  // • wider shapes begin at the lowest played fret
  const firstPosition=maxPlayedFret<=4;
  const playedSpan=fretted.length ? (maxPlayedFret-minFret+1) : 1;
  const compactHigherPosition=!firstPosition && playedSpan<3;
  const base=firstPosition ? 1 : (compactHigherPosition ? Math.max(1,minFret-1) : minFret);
  const numberedFret=firstPosition ? null : (compactHigherPosition ? base+1 : base);

  const strings=Array.from({length:6},(_,i)=>`<span class="vline" style="left:${7+i*10.08}px"></span>`).join("");
  const frets=Array.from({length:5},(_,i)=>`<span class="hline" style="top:${9.8+i*10.85}px"></span>`).join("");
  const entry=state.progression[progressionActionIndex] || null;
  const rootPc=entry ? entryRootPc(entry) : null;
  const tuning=entry && Array.isArray(entry.tuning) && entry.tuning.length===6
    ? entry.tuning
    : STANDARD_TUNING;

  // Only the lowest sounding root gets the special open-string filled marker.
  // Higher root occurrences keep the normal root treatment.
  const soundingNotes=shape.map((v,i)=>{
    if(v==="x") return null;
    const fret=Number(v);
    if(!Number.isFinite(fret)) return null;
    return {
      stringIndex:i,
      fret,
      pc:mod12(tuning[i]+fret),
      pitch:tuning[i]+fret
    };
  }).filter(Boolean);

  const rootNotes=soundingNotes.filter(n=>rootPc!==null && n.pc===rootPc);
  const lowestRoot=rootNotes.length
    ? rootNotes.reduce((a,b)=>a.pitch<=b.pitch ? a : b)
    : null;

  const marks=shape.map((v,i)=>{
    const x=7+i*10.08;
    if(v==="x") return `<span class="vopen" style="left:${x}px">×</span>`;
    const fret=Number(v);
    if(!Number.isFinite(fret)) return "";
    const pc=mod12(tuning[i]+fret);
    const isLowestRoot=!!lowestRoot && lowestRoot.stringIndex===i && lowestRoot.fret===fret;

    // Only the lowest sounding root gets a special root marker.
    // Higher root occurrences use the ordinary note marker.
    const rootClass=isLowestRoot ? " root-note" : "";

    if(fret===0){
      if(isLowestRoot) return `<span class="vopen open-root-filled" style="left:${x}px"></span>`;
      return `<span class="vopen" style="left:${x}px">○</span>`;
    }

    const row=Math.max(0,Math.min(3,fret-base));
    const y=14.7+row*10.85;
    return `<span class="vdot${rootClass}" style="left:${x}px;top:${y}px"></span>`;
  }).join("");
  const label=shape.join(" ").replaceAll("x","×");
  const fretLabel=firstPosition ? "" : `<span class="vfret">${numberedFret}</span>`;
  const toneStatus=Array.isArray(item._ccToneStatus) ? item._ccToneStatus : [];
  const intervalLine=toneStatus.length
    ? toneStatus.map(tone=>{
        const classes=[
          "voicing-tone",
          tone.present ? "present" : "omitted",
          tone.inKey ? "in-key" : "out-key"
        ];
        return `<span class="${classes.join(" ")}">${progressionEscapeHtml(tone.label)}</span>`;
      }).join("")
    : `<span class="voicing-tone omitted">—</span>`;
  const vlBadge=voiceLeadingBadgeHtml(item);
  return `${vlBadge}<div class="mini-diagram">${strings}${frets}${marks}${fretLabel}</div><div class="voicing-interval-line">${intervalLine}</div>`;
}

function normalizeVoicingFamily(item){
  const raw=String(item._ccFamily || "other").toLowerCase();
  if(raw.includes("open")) return "open";
  if(raw.includes("6th")||raw.includes("string-6")||raw.includes("low-e")) return "string-6";
  if(raw.includes("5th")||raw.includes("string-5")||raw.includes("a-string")) return "string-5";
  if(raw.includes("4th")||raw.includes("string-4")||raw.includes("d-string")) return "string-4";
  if(raw.includes("rootless")) return "rootless";
  return "other";
}

function voicingGroupHtml(label,items,key,open=false){
  const cards=items.map((item,index)=>{
    const id=(item._ccShape||[]).join(",");
    return `<button type="button" class="voicing-card ${temporaryVoicingSelection===id?"selected":""}" data-voicing-id="${progressionEscapeHtml(id)}" data-voicing-group="${key}" data-voicing-index="${index}">${miniDiagramHtml(item,index)}</button>`;
  }).join("");
  return `<section class="voicing-group ${open?"open":""}" data-voicing-family="${key}"><button type="button" class="voicing-group-toggle"><span>${label}</span><span>${items.length} <span class="voicing-family-arrow">${open?"▼":"▶"}</span></span></button><div class="voicing-group-content">${cards}</div></section>`;
}


/* ================================================================
   1.73 — Nearby context ranking
   Nearby is intentionally spatial rather than voice-leading based.
   It favors voicings occupying the same hand/fret region as the
   immediately preceding progression chord's saved voicing.
   ================================================================ */
function nearbyContextEntry(index){
  if(index<=0 || index>=state.progression.length) return null;
  const previous=state.progression[index-1];
  if(!previous?.voicing?.frets || previous.voicing.frets.length!==6) return null;
  return previous;
}

function nearbyFretRegion(frets){
  const normalized=(frets || []).map(v=>{
    if(v===null || v===undefined || v==="x") return null;
    const n=Number(v);
    return Number.isFinite(n) ? n : null;
  });

  // Hand position is defined mainly by fretted notes. Open strings may sound
  // but do not by themselves move the fretting hand to another neck region.
  const fingered=normalized.filter(v=>v!==null && v>0);
  if(!fingered.length){
    return {center:0,low:0,high:0,width:0,hasFingered:false};
  }

  const low=Math.min(...fingered);
  const high=Math.max(...fingered);
  const center=fingered.reduce((sum,v)=>sum+v,0)/fingered.length;
  return {
    center,
    low,
    high,
    width:high-low,
    hasFingered:true
  };
}

function nearbySpatialScore(sourceFrets,candidateShape){
  const source=nearbyFretRegion(sourceFrets);
  const candidate=nearbyFretRegion(candidateShape);

  // Open-position-to-open-position remains naturally nearby.
  if(!source.hasFingered && !candidate.hasFingered) return 0;

  // A fully open shape versus a fretted shape gets a hand-position penalty.
  if(!source.hasFingered || !candidate.hasFingered){
    const other=source.hasFingered ? source : candidate;
    return 70 + other.center*12 + other.high*3;
  }

  const centerDistance=Math.abs(candidate.center-source.center);
  const lowDistance=Math.abs(candidate.low-source.low);
  const highDistance=Math.abs(candidate.high-source.high);
  const widthDistance=Math.abs(candidate.width-source.width);

  // Overlap is measured only as neck-region overlap, not as retained notes.
  const overlap=Math.max(
    0,
    Math.min(source.high,candidate.high)-Math.max(source.low,candidate.low)+1
  );

  return (
    centerDistance*20 +
    lowDistance*5 +
    highDistance*5 +
    widthDistance*2 -
    overlap*4
  );
}

function applyNearbyRanking(items,index){
  if(!voicingContextNearby) return items;

  const previous=nearbyContextEntry(index);
  if(!previous) return items;

  const sourceFrets=previous.voicing.frets;
  return items
    .map((item,originalIndex)=>{
      const shape=item._ccShape || item.shape || item.frets || [];
      item._ccNearbyScore=nearbySpatialScore(sourceFrets,shape);
      return {item,originalIndex};
    })
    .sort((a,b)=>{
      const delta=(a.item._ccNearbyScore ?? 0)-(b.item._ccNearbyScore ?? 0);
      if(Math.abs(delta)>1e-9) return delta;
      // Preserve the engine's original ranking as the tie-breaker.
      return a.originalIndex-b.originalIndex;
    })
    .map(row=>row.item);
}


/* ================================================================
   1.74 — Compact / Stretch ranking preference

   Never filters candidates. It adds an adjustable ranking penalty only
   to large fretted spreads. Open strings do not increase hand spread.

   Stretch (100): no added penalty; current ranking is preserved.
   Compact (0): 4-fret spread gets a strong penalty; 5-fret spread gets
   a substantially larger penalty.
   ================================================================ */
function voicingFingerSpread(item){
  const shape=item?._ccShape || item?.shape || item?.frets || [];
  const fingered=shape
    .map(v=>Number(v))
    .filter(v=>Number.isFinite(v) && v>0);
  if(fingered.length<2) return 0;
  return Math.max(...fingered)-Math.min(...fingered);
}

function voicingSpreadPenalty(item){
  const spread=voicingFingerSpread(item);
  const compactStrength=(100-voicingSpreadPreference)/100;
  if(compactStrength<=0) return 0;
  if(spread>=5) return 180*compactStrength;
  if(spread===4) return 70*compactStrength;
  return 0;
}

function applySpreadPreferenceRanking(items){
  if(voicingSpreadPreference>=100) return items;

  return items
    .map((item,originalIndex)=>({
      item,
      originalIndex,
      penalty:voicingSpreadPenalty(item)
    }))
    .sort((a,b)=>{
      const delta=a.penalty-b.penalty;
      if(Math.abs(delta)>1e-9) return delta;
      return a.originalIndex-b.originalIndex;
    })
    .map(row=>row.item);
}


/* ================================================================
   1.75 — Voice Leading diagnostic scoring
   Score is calculated but DOES NOT affect ranking yet.
   ================================================================ */
function vlNotesFromShape(shape,entry){
  if(!entry) return [];
  const tuning=Array.isArray(entry.tuning)&&entry.tuning.length===6
    ? entry.tuning
    : STANDARD_TUNING;
  const standardMidi=[40,45,50,55,59,64];

  return (shape || []).map((value,stringIndex)=>{
    if(value===null || value===undefined || value==="x") return null;
    const fret=Number(value);
    if(!Number.isFinite(fret)) return null;

    let tuningOffset=tuning[stringIndex]-STANDARD_TUNING[stringIndex];
    while(tuningOffset>6) tuningOffset-=12;
    while(tuningOffset<-6) tuningOffset+=12;

    return {
      stringIndex,
      fret,
      midi:standardMidi[stringIndex]+tuningOffset+fret,
      pc:mod12(tuning[stringIndex]+fret)
    };
  }).filter(Boolean).sort((a,b)=>a.midi-b.midi || a.stringIndex-b.stringIndex);
}

function vlUpperMovementPenalty(semitones){
  const d=Math.abs(semitones);
  if(d===0) return 0;
  if(d===1) return 1;
  if(d===2) return 2;
  if(d===3) return 4;
  if(d===4) return 6;
  if(d===5) return 9;
  if(d===6) return 12;
  if(d===7) return 16;
  if(d===8) return 20;
  if(d===9) return 25;
  if(d===10) return 30;
  if(d===11) return 36;
  if(d===12) return 42;
  return 42 + (d-12)*7;
}

function vlBassMovementPenalty(semitones){
  const d=Math.abs(semitones);
  if(d===0) return 0;
  if(d<=2) return d*0.6;
  if(d<=4) return 1.5 + (d-2)*0.9;
  if(d<=7) return 3.3 + (d-4)*1.0;
  if(d<=12) return 6.3 + (d-7)*1.4;
  return 13.3 + (d-12)*2.5;
}

function vlPairCost(prevNote,nextNote,isBassPair){
  const movement=nextNote.midi-prevNote.midi;
  let cost=isBassPair
    ? vlBassMovementPenalty(movement)
    : vlUpperMovementPenalty(movement);

  if(
    movement===0 &&
    prevNote.stringIndex===nextNote.stringIndex &&
    prevNote.fret===nextNote.fret
  ){
    cost-=2;
  }
  return cost;
}

function vlOrderPreservingScore(prevNotes,nextNotes){
  const n=prevNotes.length;
  const m=nextNotes.length;
  const unmatchedPenalty=8;
  const dp=Array.from({length:n+1},()=>Array(m+1).fill(Infinity));
  dp[0][0]=0;

  for(let i=0;i<=n;i++){
    for(let j=0;j<=m;j++){
      const base=dp[i][j];
      if(!Number.isFinite(base)) continue;

      if(i<n) dp[i+1][j]=Math.min(dp[i+1][j],base+unmatchedPenalty);
      if(j<m) dp[i][j+1]=Math.min(dp[i][j+1],base+unmatchedPenalty);

      if(i<n && j<m){
        const isBassPair=(i===0 && j===0);
        const pair=vlPairCost(prevNotes[i],nextNotes[j],isBassPair);
        dp[i+1][j+1]=Math.min(dp[i+1][j+1],base+pair);
      }
    }
  }
  return dp[n][m];
}

function previousVoicedEntryForVoiceLeading(index){
  if(index<=0 || index>=state.progression.length) return null;
  const previous=state.progression[index-1];
  return previous?.voicing?.frets?.length===6 ? previous : null;
}

function voiceLeadingScoreForCandidate(item,index){
  const previous=previousVoicedEntryForVoiceLeading(index);
  const current=state.progression[index];
  if(!previous || !current) return null;

  const prevNotes=vlNotesFromShape(previous.voicing.frets,previous);
  const shape=item?._ccShape || item?.shape || item?.frets || [];
  const nextNotes=vlNotesFromShape(shape,current);

  if(!prevNotes.length || !nextNotes.length) return null;
  return vlOrderPreservingScore(prevNotes,nextNotes);
}

function attachVoiceLeadingScores(items,index){
  for(const item of items){
    item._ccVoiceLeadingScore=voiceLeadingScoreForCandidate(item,index);
  }
  return items;
}

function renderVoicingSelector(entry){
  temporaryVoicingPreviewFrets=null;
  const scroll=document.getElementById("voicingSelectorScroll");
  const title=document.getElementById("voicingSelectorTitle");
  if(!scroll || !title) return;
  title.textContent=`${entry?.name || "Chord"} Voicing`;
  renderVoicingInversionControl(entry);
  let items=generateVoicingsForEntry(entry).filter(item=>{
    // Defensive verification only; generation itself is already constrained.
    return voicingMatchesCurrentInversion(item,entry);
  });

  // Nearby changes ranking only. It never removes candidates and has no
  // effect when the immediately preceding progression chord is unvoiced.
  items=applyNearbyRanking(items,progressionActionIndex);

  // Compact / Stretch also changes ranking only. Because this happens before
  // Top and family groups are split, the preference applies everywhere.
  items=applySpreadPreferenceRanking(items);

  // Diagnostic only in 1.75: calculate Voice Leading scores but DO NOT reorder.
  items=attachVoiceLeadingScores(items,progressionActionIndex);

  currentVoicingCandidates=new Map(items.map(item=>[(item._ccShape||[]).join(","),item]));
  if(entry?.voicing?.frets?.length===6){
    temporaryVoicingSelection=entry.voicing.frets.map(v=>v==null?"x":String(v)).join(",");
  }
  if(!items.length){
    scroll.innerHTML=`<div class="voicing-empty">No voicings meet the current inversion, chord, and tuning criteria.</div>`;
    return;
  }
  const top=items.slice(0,8);
  const topKeys=new Set(top.map(i=>(i._ccShape||[]).join(",")));
  const rest=items.filter(i=>!topKeys.has((i._ccShape||[]).join(",")));
  const families=[
    ["open","Open strings"],["string-6","Root on 6th string"],["string-5","Root on 5th string"],
    ["string-4","Root on 4th string"],["rootless","Rootless"],["other","Other"]
  ];
  let html=voicingGroupHtml("Top",top,"top",true);
  families.forEach(([key,label])=>{
    const group=rest.filter(i=>normalizeVoicingFamily(i)===key);
    if(group.length) html+=voicingGroupHtml(label,group,key,false);
  });
  html+=`<div class="voicing-step-note">Tap once to highlight and preview. Tap the highlighted voicing again to assign it.</div>`;
  scroll.innerHTML=html;

  scroll.querySelectorAll(".voicing-group-toggle").forEach(toggle=>{
    toggle.onclick=()=>{
      const group=toggle.closest(".voicing-group");
      const wasOpen=group.classList.contains("open");
      scroll.querySelectorAll(".voicing-group").forEach(g=>g.classList.remove("open"));
      if(!wasOpen) group.classList.add("open");
      scroll.querySelectorAll(".voicing-group").forEach(g=>{
        const arrow=g.querySelector(".voicing-family-arrow");
        if(arrow) arrow.textContent=g.classList.contains("open")?"▼":"▶";
      });
    };
  });
  scroll.querySelectorAll(".voicing-card").forEach(card=>{
    card.onclick=(event)=>{
      event.preventDefault();
      event.stopPropagation();

      // Any voicing tap returns the top-left control area to its compact state.
      // The Inversion / Context headings and superscript status remain visible,
      // but their button rows collapse.
      if(voicingControlPage!==""){
        voicingControlPage="";
        const entryForControls=state.progression[progressionActionIndex] || null;
        if(entryForControls) renderVoicingInversionControl(entryForControls);
      }

      const id=card.dataset.voicingId || "";
      if(!id) return;

      // Commit only after two fresh taps on the same candidate in this open
      // Voicing session. This is independent of visual highlighting, because a
      // previously saved voicing may already be highlighted when the panel opens.
      if(temporaryVoicingArmedId===id){
        temporaryVoicingArmedId="";
        assignVoicingToProgression(progressionActionIndex,id);
        return;
      }

      // First tap (or a tap on a different candidate): arm + preview only.
      temporaryVoicingArmedId=id;
      temporaryVoicingSelection=id;
      scroll.querySelectorAll(".voicing-card").forEach(c=>
        c.classList.toggle("selected",(c.dataset.voicingId || "")===id)
      );

      const previewItem=currentVoicingCandidates.get(id);
      if(previewItem){
        temporaryVoicingPreviewFrets=(previewItem._ccShape || []).map(
          value=>value==="x" ? null : Number(value)
        );
        // Preview is purely a fretboard display operation. Do not reload the
        // progression chord here; doing so couples Voicing taps to View state.
        renderFretboard();
      }
    };
  });
}

function assignVoicingToProgression(index,voicingId){
  if(index<0 || index>=state.progression.length) return;
  const item=currentVoicingCandidates.get(voicingId);
  if(!item) return;
  const frets=(item._ccShape || []).map(value=>value==="x" ? null : Number(value));
  if(frets.length!==6) return;

  state.progression[index].voicing={
    frets,
    family:normalizeVoicingFamily(item),
    source:"comp-map-engine"
  };
  state.progressionSelected=index;
  refreshInternalProgressionClipboard();
  persistProgressionClipboard();
  closeVoicingSelector({restoreSource:false});

  if(progressionActionSource==="view"){
    state.progressionView=true;
    // Full render is required here because committing a voicing turns off the
    // temporary Voicing workspace. Without it, the saved voicing is applied
    // but the left panel remains visually stuck in Voicing.
    render();
    renderProgressionView();
    renderFretboard();
    renderProgressionButton();
    requestAnimationFrame(()=>scrollSelectedProgressionIntoView({playback:false}));
  }else{
    state.progressionView=false;
    render();
    openProgressionPopup();
    renderProgressionPopup();
  }
}


function openProgressionChordActions(index,{source="popup"}={}){
  if(index<0 || index>=state.progression.length) return;
  progressionActionIndex=index;
  progressionActionSource=source;
  const entry=state.progression[index];
  document.getElementById("progressionActionTitle").textContent=entry.name || "Chord";
  const overlay=document.getElementById("progressionActionOverlay");
  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden","false");
}

function closeProgressionChordActions(){
  const overlay=document.getElementById("progressionActionOverlay");
  overlay?.classList.remove("show");
  overlay?.setAttribute("aria-hidden","true");
}

function openVoicingSelectorForProgression(index){
  if(index<0 || index>=state.progression.length) return;
  const entry=state.progression[index];

  // Voicing is a temporary left-panel workspace. If it was launched from
  // the Progression popup, remove that overlay first so the permanent
  // fretboard is completely unobstructed for preview.
  if(progressionActionSource==="popup"){
    closeProgressionPopup();
  }

  state.voicingWorkspace=true;
  voicingControlPage="";
  voicingInversionIndex=0;
  temporaryVoicingArmedId="";
  temporaryVoicingSelection=entry?.voicing?.frets?.length===6
    ? entry.voicing.frets.map(v=>v==null?"x":String(v)).join(",")
    : "";

  // Restore the chord context while preserving the temporary workspace.
  restoreProgressionChord(entry,{preservePanel:true});
  renderVoicingSelector(entry);

  const scroll=document.getElementById("voicingSelectorScroll");
  if(scroll) scroll.scrollTop=0;
}

function closeVoicingSelector({restoreSource=true}={}){
  temporaryVoicingPreviewFrets=null;
  temporaryVoicingArmedId="";
  state.voicingWorkspace=false;

  if(!restoreSource){
    renderFretboard();
    return;
  }

  if(progressionActionSource==="view"){
    state.progressionView=true;
    render();
    renderProgressionView();
    renderFretboard();
    requestAnimationFrame(()=>scrollSelectedProgressionIntoView({playback:false}));
  }else{
    state.progressionView=false;
    render();
    openProgressionPopup();
    renderProgressionPopup();
  }
}

function wireVoicingStepOne(){
  document.getElementById("progressionActionEdit").onclick=()=>{
    const index=progressionActionIndex;
    const source=progressionActionSource;

    closeProgressionChordActions();
    if(index<0 || index>=state.progression.length) return;

    if(source==="popup"){
      // Existing Progression-popup behavior remains immediate.
      closeProgressionPopup();
      beginProgressionChordEdit(index);
      return;
    }

    // When Edit originates from Progression View, finish the long-press/action
    // pointer cycle before replacing View with the chord builder. This keeps
    // the View row from competing with the edit-state render on touch devices.
    temporaryVoicingPreviewFrets=null;
    state.progressionViewShowAllTones=false;
    state.progressionSelected=index;

    requestAnimationFrame(()=>{
      beginProgressionChordEdit(index);
    });
  };
  document.getElementById("progressionActionVoicing").onclick=()=>{
    const index=progressionActionIndex;
    closeProgressionChordActions();
    openVoicingSelectorForProgression(index);
  };
  document.getElementById("progressionActionOverlay").onclick=e=>{
    if(e.target.id==="progressionActionOverlay") closeProgressionChordActions();
  };
  document.getElementById("voicingSelectorClose").onclick=()=>closeVoicingSelector();
}

wireProgressionControls();
wireVoicingStepOne();
render();
</script>

   bottom of the permanent fretboard. Excess voicings scroll inside it. */

  max-height:var(--cc-voicing-workspace-height, none) !important;

}

  min-height:0 !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  -webkit-overflow-scrolling:touch !important;
  overscroll-behavior:contain !important;
}

  /* 1.66 — While Voicing is active, Inversion temporarily occupies the
     exact top-left Key / Mode / Pent real estate. Root position is implicit

<script id="cc-142-voicing-height-script">
(function(){
  function syncVoicingWorkspaceHeight(){
    const controls=document.querySelector(".controls");
    const panel=document.getElementById("voicingWorkspacePanel");
    const board=document.getElementById("fretboard");
    if(!controls || !panel || !board) return;
    if(!controls.classList.contains("voicing-workspace-active")) return;

    // getBoundingClientRect() includes the board's actual scale and the
    // fretboard-scaler translation, so this is its true visible bottom.
    const boardRect=board.getBoundingClientRect();
    const panelRect=panel.getBoundingClientRect();
    const available=Math.max(100, Math.floor(boardRect.bottom-panelRect.top-29));

    document.documentElement.style.setProperty(
      "--cc-voicing-workspace-height",
      available+"px"
    );
  }

  window.syncVoicingWorkspaceHeight=syncVoicingWorkspaceHeight;

  function schedule(){
    requestAnimationFrame(function(){
      syncVoicingWorkspaceHeight();
      requestAnimationFrame(syncVoicingWorkspaceHeight);
    });
  }

  window.addEventListener("resize",schedule,{passive:true});
  window.addEventListener("orientationchange",schedule,{passive:true});

  const controls=document.querySelector(".controls");
  if(controls){
    new MutationObserver(schedule).observe(controls,{
      attributes:true,
      attributeFilter:["class"]
    });
  }

  // The fretboard is fitted after render, so resync after the interactions
  // that can enter Voicing or alter layout.
  document.addEventListener("click",function(){
    if(document.querySelector(".controls.voicing-workspace-active")) schedule();
  },true);

  schedule();
})();
</script>
