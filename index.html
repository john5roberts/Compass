    {intervals:[4,7,11], label:"rootless major-7 structure"},
    {intervals:[4,7,10], label:"rootless dominant-7 structure"},
    {intervals:[3,7,10], label:"rootless minor-7 structure"},
    {intervals:[3,7,11], label:"rootless minor-major-7 structure"},
    {intervals:[3,6,10], label:"rootless half-diminished-7 structure"},
    {intervals:[3,6,9], label:"rootless diminished-7 structure"}
  ];

  const FOUR_NOTE_UPPER_STRUCTURES = [
    {intervals:[0,4,7,11], label:"major-7 chord"},
    {intervals:[0,4,7,10], label:"dominant-7 chord"},
    {intervals:[0,3,7,10], label:"minor-7 chord"},
    {intervals:[0,3,7,11], label:"minor-major-7 chord"},
    {intervals:[0,3,6,10], label:"half-diminished-7 chord"},
    {intervals:[0,3,6,9], label:"diminished-7 chord"},
    {intervals:[0,4,8,11], label:"augmented-major-7 chord"}
  ];

  const VOICING_TYPE_LABELS = {
    "shell":"Shell",
    "guide-tones":"Guide tones",
    "guide-tone-extension":"Guide-tone extension",
    "triad":"Triad",
    "rootless-jazz":"Rootless jazz",
    "upper-structure-over-bass":"Upper structure over bass",
    "full-six-string":"Full six-string",
    "closed":"Closed position",
    "drop-2":"Drop-2",
    "drop-3":"Drop-3",
    "spread":"Spread"
  };

  const CONSTRUCTION_PRIORITY = [
    "upper-structure-over-bass",
    "shell",
    "guide-tones",
    "guide-tone-extension",
    "rootless-jazz",
    "triad",
    "full-six-string",
    "spread",
    "closed",
    "drop-2",
    "drop-3"
  ];

  const ROOT_NOTE_NAMES = [
    "C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"
  ];

  const CHORD_TEMPLATE_SUFFIX = {
    "D":"",
    "Dm":"m",
    "Ddim":"dim",
    "Daug":"aug",
    "Dsus2":"sus2",
    "Dsus4":"sus4",
    "D6":"6",
    "Dm6":"m6",
    "D7":"7",
    "Dmaj7":"maj7",
    "Dm7":"m7",
    "Dm7♭5":"m7♭5",
    "Ddim7":"dim7",
    "D9":"9",
    "Dm9":"m9",
    "Dmaj9":"maj9",
    "D7♭9":"7♭9",
    "D7♯9":"7♯9",
    "D11":"11",
    "D13":"13"
  };

  const PHYSICAL_FAMILY_ORDER = [
    "open",
    "string-6",
    "string-5",
    "string-4",
    "rootless",
    "other"
  ];

  const PHYSICAL_FAMILY_LABELS = {
    "open":"Open-string voicings",
    "string-6":"6th-string shapes",
    "string-5":"5th-string shapes",
    "string-4":"4th-string shapes",
    "rootless":"Rootless shapes",
    "other":"Other shapes"
  };

  const CONSTRUCTION_SORT_PRIORITY = [
    "upper-structure-over-bass",
    "shell",
    "guide-tones",
    "guide-tone-extension",
    "rootless-jazz",
    "triad",
    "full-six-string",
    "spread",
    "closed",
    "drop-2",
    "drop-3"
  ];

  function mod12(n){
    return ((n % 12) + 12) % 12;
  }

  function degreeLabelForChord(chordName, degree){
    const overrides = CHORD_DEGREE_LABEL_OVERRIDES[chordName] || {};
    return overrides[degree] || DEGREE_BY_SEMITONE[degree];
  }

  // 1.4.11: public bridge for Comp-Map's canonical interval spellings.
  // Dynamic engine chord definitions can now label sus2/sus4/6/dim7 as
  // 2/4/6/𝄫7 instead of falling back to generic 9/11/13 labels.
  function setDegreeLabelOverrides(chordName, labels){
    if(!chordName) return;
    CHORD_DEGREE_LABEL_OVERRIDES[chordName] = {...(labels || {})};
  }

  function chordThirdDegree(spec){
    const degrees = [...(spec.required || []), ...(spec.optional || [])];
    if(degrees.includes(3)) return 3;
    if(degrees.includes(4)) return 4;
    return null;
  }

  function chordSeventhDegree(spec){
    const degrees = [...(spec.required || []), ...(spec.optional || [])];
    if(degrees.includes(10)) return 10;
    if(degrees.includes(11)) return 11;
    return null;
  }

  function voicingGenerationSpec(chordName, voicingType){
    const base = CHORDS[chordName];
    const third = chordThirdDegree(base);
    const seventh = chordSeventhDegree(base);
    const allChordDegrees = [...new Set([
      ...(base.required || []),
      ...(base.optional || [])
    ])];

    if(voicingType === "shell"){
      if(third === null || seventh === null) return null;
      return {
        required:[0, third, seventh],
        optional:[],
        forbidden:[],
        minSounding:3,
        maxSounding:3
      };
    }

    if(voicingType === "guide-tones"){
      if(third === null || seventh === null) return null;
      return {
        required:[third, seventh],
        optional:[],
        forbidden:[],
        minSounding:2,
        maxSounding:2
      };
    }

    if(voicingType === "guide-tone-extension"){
      if(third === null || seventh === null) return null;

      const extensions = allChordDegrees.filter(degree =>
        ![0,3,4,7,10,11].includes(degree)
      );

      if(!extensions.length) return null;

      return {
        required:[third, seventh],
        optional:extensions,
        forbidden:[0,7],
        minSounding:3,
        maxSounding:Math.min(6, 2 + extensions.length),
        requireAtLeastOneOptional:true
      };
    }

    if(voicingType === "triad"){
      const candidateTriads = [
        [0,4,7],
        [0,3,7],
        [0,3,6],
        [0,4,8],
        [0,2,7],
        [0,5,7]
      ];

      const matching = candidateTriads.find(set =>
        set.every(degree => allChordDegrees.includes(degree))
      );

      if(!matching) return null;

      return {
        required:[...matching],
        optional:[],
        forbidden:[],
        minSounding:3,
        maxSounding:6
      };
    }

    if(voicingType === "rootless-jazz"){
      if(third === null || seventh === null) return null;

      const colorTones = allChordDegrees.filter(degree =>
        ![0,3,4,7,10,11].includes(degree)
      );

      if(!colorTones.length) return null;

      return {
        required:[third, seventh],
        optional:colorTones,
        forbidden:[0],
        minSounding:3,
        maxSounding:4,
        requireAtLeastOneOptional:true
      };
    }

    if(voicingType === "upper-structure-over-bass"){
      // One bass note plus an adjacent-string upper structure of
      // three or four notes. The complete selected chord must still
      // contain all of its required tones.
      return {
        required:[...(base.required || [])],
        optional:[...(base.optional || [])],
        forbidden:[...(base.forbidden || [])],
        minSounding:4,
        maxSounding:5
      };
    }

    if(voicingType === "spread"){
      // These are spacing/construction families. Do not force every
      // required tone of the full chord; generate from all chord tones
      // and let the family classifier decide.
      return {
        required:[],
        optional:allChordDegrees,
        forbidden:[...(base.forbidden || [])],
        minSounding:3,
        maxSounding:6,
        requireAtLeastThreeDistinct:true
      };
    }

    if(voicingType === "full-six-string"){
      return {
        required:[...(base.required || [])],
        optional:[...(base.optional || [])],
        forbidden:[...(base.forbidden || [])],
        minSounding:6,
        maxSounding:6
      };
    }

    return {
      required:[...(base.required || [])],
      optional:[...(base.optional || [])],
      forbidden:[...(base.forbidden || [])],
      minSounding:3,
      maxSounding:6
    };
  }

  function notePc(stringIndex, fret){
    return mod12(openPitchClass(stringIndex) + fret);
  }

  function degreeForPc(pc){
    return DEGREE_BY_SEMITONE[mod12(pc - getRootPitchClass())];
  }

  function unique(arr){
    return [...new Set(arr)];
  }

  function isValidForChord(shape, spec){
    const sounding = shape
      .map((fret, stringIndex) => fret === null ? null : notePc(stringIndex, fret))
      .filter(pc => pc !== null);

    const degreeSet = new Set(sounding.map(pc => mod12(pc - getRootPitchClass())));

    for(const degree of spec.required){
      if(!degreeSet.has(degree)) return false;
    }

    for(const forbidden of spec.forbidden || []){
      if(degreeSet.has(forbidden)) return false;
    }

    const allowed = new Set([...(spec.required || []), ...(spec.optional || [])]);
    for(const degree of degreeSet){
      if(!allowed.has(degree)) return false;
    }

    return true;
  }

  function candidateFretsForString(
    stringIndex,
    minFret,
    maxFret,
    allowedDegrees,
    openStringsMode
  ){
    const frets = [null];

    if(openStringsMode !== "none"){
      const openDegree = mod12(notePc(stringIndex, 0) - getRootPitchClass());
      if(allowedDegrees.has(openDegree)){
        frets.push(0);
      }
    }

    for(let fret = minFret; fret <= maxFret; fret++){
      const degree = mod12(notePc(stringIndex, fret) - getRootPitchClass());
      if(allowedDegrees.has(degree)){
        frets.push(fret);
      }
    }
    return frets;
  }

  function shapeStats(shape){
    const sounding = [];
    shape.forEach((fret, stringIndex) => {
      if(fret !== null){
        const pc = notePc(stringIndex, fret);
        sounding.push({
          stringIndex,
          fret,
          pc,
          degree: degreeForPc(pc)
        });
      }
    });

    const frettedNotes = sounding.filter(n => n.fret > 0);
    const frets = frettedNotes.map(n => n.fret);
    const minFret = frets.length ? Math.min(...frets) : 0;
    const maxFret = frets.length ? Math.max(...frets) : 0;
    const span = frets.length ? maxFret - minFret : 0;
    const openCount = sounding.filter(n => n.fret === 0).length;
    const bass = sounding[0];
    const degreeSet = unique(sounding.map(n => n.degree));
    const noteSet = unique(sounding.map(n => NOTE_NAMES[n.pc]));

    return {
      sounding,
      soundingCount:sounding.length,
      minFret,
      maxFret,
      span,
      openCount,
      bass,
      degreeSet,
      noteSet
    };
  }

  function canBarAcross(fret, startString, endString, fretByString){
    for(let s = startString + 1; s < endString; s++){
      const interveningFret = fretByString[s];

      // Muted strings and strings stopped farther toward the body may
      // lie under a barre. A sounding lower-fret note may not.
      if(interveningFret !== null && interveningFret < fret){
        return false;
      }
    }
    return true;
  }

  function partitionsForFret(fret, strings, fretByString){
    const results = [];

    function recurse(index, current){
      if(index >= strings.length){
        results.push(current.map(action => ({...action, strings:[...action.strings]})));
        return;
      }

      // First possibility: play this note with its own finger.
      const singleString = strings[index];
      recurse(index + 1, [
        ...current,
        {
          fret,
          strings:[singleString],
          minString:singleString,
          maxString:singleString,
          isBarre:false
        }
      ]);

      // Additional possibilities: make a barre from this note through
      // one or more later notes at the same fret.
      for(let endIndex = index + 1; endIndex < strings.length; endIndex++){
        const startString = strings[index];
        const endString = strings[endIndex];

        if(!canBarAcross(fret, startString, endString, fretByString)){
          break;
        }

        const groupedStrings = strings.slice(index, endIndex + 1);
        recurse(endIndex + 1, [
          ...current,
          {
            fret,
            strings:groupedStrings,
            minString:startString,
            maxString:endString,
            isBarre:true
          }
        ]);
      }
    }

    recurse(0, []);
    return results;
  }

  function buildActionPlans(stats){
    const fretByString = new Array(6).fill(null);
    const byFret = new Map();

    stats.sounding.forEach(note => {
      fretByString[note.stringIndex] = note.fret;
      if(!byFret.has(note.fret)) byFret.set(note.fret, []);
      byFret.get(note.fret).push(note.stringIndex);
    });

    const fretGroups = [...byFret.entries()]
      .map(([fret, strings]) => ({
        fret,
        strings:[...strings].sort((a,b) => a-b)
      }))
      .sort((a,b) => a.fret - b.fret);

    let plans = [[]];

    fretGroups.forEach(group => {
      const groupPartitions = partitionsForFret(
        group.fret,
        group.strings,
        fretByString
      );

      const combined = [];
      plans.forEach(plan => {
        groupPartitions.forEach(partition => {
          combined.push([...plan, ...partition]);
        });
      });
      plans = combined;
    });

    return plans.map(plan =>
      plan.sort((a,b) => a.fret - b.fret || a.minString - b.minString)
    );
  }

  function isAssignmentCredible(actions, assigned){
    for(let i = 0; i < actions.length; i++){
      const action = actions[i];
      const finger = assigned[i];
      const barreSpan = action.maxString - action.minString + 1;

      // Thumb is limited to the two bass strings.
      if(finger === 4 && action.maxString > 1){
        return false;
      }

      if(action.isBarre){
        // A long barre behind lower treble-side notes is credible only
        // with the index finger.
        const lowerTrebleNoteExists = actions.some((other, j) =>
          j !== i &&
          other.fret < action.fret &&
          other.maxString > action.maxString
        );

        if(barreSpan >= 3 && lowerTrebleNoteExists && finger !== 0){
          return false;
        }

        // Barres spanning four or more strings use the index finger.
        if(barreSpan >= 4 && finger !== 0){
          return false;
        }
      }
    }

    return true;
  }

  function assignmentCost(actions, assigned){
    // Fewer independent actions are useful, but a barre is chosen only
    // when its ergonomic benefit outweighs its own cost.
    let cost = actions.length * 8;

    for(let i = 0; i < actions.length; i++){
      const action = actions[i];
      const finger = assigned[i];

      if(finger === 4){ // Thumb
        if(action.minString === 0) cost += 0;
        else if(action.minString === 1) cost += 2;
        else cost += 20;
      }

      if(action.isBarre){
        const span = action.maxString - action.minString + 1;
        const skippedStrings = span - action.strings.length;

        // Adjacent two-string mini-barres are inexpensive. Selective or
        // longer barres must save enough fingers to justify themselves.
        cost += 2;
        cost += Math.max(0, span - 2) * 2;
        cost += skippedStrings * 10;
      }
    }

    // Penalize reversals in normal finger order.
    for(let i = 0; i < actions.length; i++){
      for(let j = i + 1; j < actions.length; j++){
        const a = actions[i];
        const b = actions[j];
        const fa = assigned[i];
        const fb = assigned[j];

        if(fa === 4 || fb === 4) continue;

        if(a.fret < b.fret && fa > fb){
          cost += 5 + (fa - fb) * 2;
        }
      }
    }

    return cost;
  }

  function findBestAssignmentForPlan(actions){
    if(actions.length > 5) return null;

    let best = null;
    const used = new Set();
    const current = new Array(actions.length);

    function search(index){
      if(index === actions.length){
        if(!isAssignmentCredible(actions, current)) return;

        const cost = assignmentCost(actions, current);
        if(!best || cost < best.cost){
          best = {cost, assigned:[...current]};
        }
        return;
      }

      for(let finger = 0; finger < FINGER_NAMES.length; finger++){
        if(used.has(finger)) continue;
        used.add(finger);
        current[index] = finger;
        search(index + 1);
        used.delete(finger);
      }
    }

    search(0);
    return best;
  }

  function findBestFingerAssignment(stats){
    // Fast deterministic solver. Begin with one action per sounding note.
    // Introduce only the minimum number of natural same-fret barres needed
    // to fit within four fingers plus thumb.
    let actions = stats.sounding
      .filter(note => note.fret > 0)
      .map(note => ({
      fret:note.fret,
      strings:[note.stringIndex],
      minString:note.stringIndex,
      maxString:note.stringIndex,
      isBarre:false
    }));

    const fretByString = new Array(6).fill(null);
    stats.sounding
      .filter(note => note.fret > 0)
      .forEach(note => {
        fretByString[note.stringIndex] = note.fret;
      });

    function barreCandidates(){
      const candidates = [];

      for(let i = 0; i < actions.length; i++){
        for(let j = i + 1; j < actions.length; j++){
          const a = actions[i];
          const b = actions[j];

          if(a.fret !== b.fret) continue;

          const startString = Math.min(a.minString, b.minString);
          const endString = Math.max(a.maxString, b.maxString);

          if(!canBarAcross(a.fret, startString, endString, fretByString)){
            continue;
          }

          const span = endString - startString + 1;
          const combinedStrings = [...new Set([...a.strings, ...b.strings])]
            .sort((x,y) => x-y);
          const skipped = span - combinedStrings.length;

          candidates.push({
            i,
            j,
            fret:a.fret,
            strings:combinedStrings,
            minString:startString,
            maxString:endString,
            isBarre:true,
            cost:skipped * 20 + Math.max(0, span - 2) * 4
          });
        }
      }

      return candidates.sort((a,b) => a.cost - b.cost);
    }

    while(actions.length > 5){
      const candidates = barreCandidates();
      if(!candidates.length){
        return {
          credible:false,
          actions,
          assigned:[],
          stringFingers:new Array(6).fill("x"),
          techniques:[],
          description:"More than five independent fretting actions"
        };
      }

      const best = candidates[0];
      const next = [];

      actions.forEach((action, index) => {
        if(index !== best.i && index !== best.j){
          next.push(action);
        }
      });

      next.push({
        fret:best.fret,
        strings:best.strings,
        minString:best.minString,
        maxString:best.maxString,
        isBarre:true
      });

      actions = next;
    }

    actions.sort((a,b) =>
      a.fret - b.fret ||
      a.minString - b.minString
    );

    const assigned = new Array(actions.length).fill(null);
    const availableNormal = [0,1,2,3];

    // Use thumb only when five resources are required, and only for a
    // bass-side action on the low E or A string.
    if(actions.length === 5){
      let thumbIndex = actions.findIndex(action =>
        action.maxString <= 1 &&
        action.strings.length === 1
      );

      if(thumbIndex < 0){
        return {
          credible:false,
          actions,
          assigned:[],
          stringFingers:new Array(6).fill("x"),
          techniques:[],
          description:"Five actions without a credible thumb assignment"
        };
      }

      assigned[thumbIndex] = 4;
    }

    const normalActionIndexes = actions
      .map((_, index) => index)
      .filter(index => assigned[index] === null)
      .sort((i,j) =>
        actions[i].fret - actions[j].fret ||
        actions[i].minString - actions[j].minString
      );

    if(normalActionIndexes.length > 4){
      return {
        credible:false,
        actions,
        assigned:[],
        stringFingers:new Array(6).fill("x"),
        techniques:[],
        description:"Too many non-thumb actions"
      };
    }

    normalActionIndexes.forEach((actionIndex, position) => {
      assigned[actionIndex] = availableNormal[position];
    });

    if(!isAssignmentCredible(actions, assigned)){
      return {
        credible:false,
        actions,
        assigned,
        stringFingers:new Array(6).fill("x"),
        techniques:[],
        description:"Fast assignment failed anatomical credibility"
      };
    }

    const stringFingers = new Array(6).fill("x");
    const techniques = [];

    actions.forEach((action, index) => {
      const fingerName = FINGER_NAMES[assigned[index]];

      action.strings.forEach(stringIndex => {
        stringFingers[stringIndex] = fingerName;
      });

      if(action.isBarre){
        const low = STRING_LABELS[action.minString];
        const high = STRING_LABELS[action.maxString];
        techniques.push(`${fingerName} barre ${low}–${high} at fret ${action.fret}`);
      }

      if(fingerName === "T"){
        techniques.push(`thumb at fret ${action.fret}`);
      }
    });

    return {
      credible:true,
      actions,
      assigned,
      cost:assignmentCost(actions, assigned),
      stringFingers,
      techniques
    };
  }

  function fretDistanceMm(fretA, fretB){
    // Approximate physical distance along a 25.5-inch scale guitar.
    const scale = 647.7;
    const position = fret => scale - (scale / Math.pow(2, fret / 12));
    return Math.abs(position(fretA) - position(fretB));
  }

  function analyzeHandPosture(stats, fingering){
    const issues = [];
    const warnings = [];
    const byFinger = new Map();

    fingering.actions.forEach((action, index) => {
      const finger = fingering.assigned[index];
      byFinger.set(finger, action);
    });

    const indexAction = byFinger.get(0);
    const middleAction = byFinger.get(1);
    const ringAction = byFinger.get(2);
    const littleAction = byFinger.get(3);
    const thumbAction = byFinger.get(4);

    const fingerActions = [indexAction, middleAction, ringAction, littleAction]
      .filter(Boolean);

    // 1. Overall hand opening in physical millimeters.
    if(fingerActions.length){
      const frets = fingerActions.map(a => a.fret);
      const low = Math.min(...frets);
      const high = Math.max(...frets);
      const spreadMm = fretDistanceMm(low, high);

      if(spreadMm > 105){
        issues.push(`Finger spread approximately ${Math.round(spreadMm)} mm`);
      } else if(spreadMm > 82){
        warnings.push(`Wide finger spread approximately ${Math.round(spreadMm)} mm`);
      }
    }

    // 2. Thumb-to-index relationship. Thumb-over and index barre together
    // create a particularly narrow posture envelope.
    if(thumbAction && indexAction){
      const thumbIndexMm = fretDistanceMm(thumbAction.fret, indexAction.fret);
      const indexIsBarre = !!indexAction.isBarre;
      const indexSpan = indexAction.maxString - indexAction.minString + 1;

      if(indexIsBarre && indexSpan >= 2 && thumbIndexMm > 48){
        issues.push(`Thumb and index barre separated by approximately ${Math.round(thumbIndexMm)} mm`);
      } else if(thumbIndexMm > 68){
        issues.push(`Thumb and index separated by approximately ${Math.round(thumbIndexMm)} mm`);
      } else if(thumbIndexMm > 48){
        warnings.push(`Wide thumb-to-index separation`);
      }

      if(thumbAction.fret > indexAction.fret + 2 && indexIsBarre){
        issues.push(`Thumb lies more than two frets beyond an index barre`);
      }
    }

    // 3. Index barre fixes the hand orientation and limits forward reach.
    if(indexAction && indexAction.isBarre){
      const forwardActions = [middleAction, ringAction, littleAction].filter(Boolean);
      const maxForward = forwardActions.length
        ? Math.max(...forwardActions.map(a => a.fret - indexAction.fret))
        : 0;

      if(maxForward >= 4){
        issues.push(`Index barre with a ${maxForward}-fret forward reach`);
      } else if(maxForward === 3){
        warnings.push(`Index barre with a three-fret forward reach`);
      }
    }

    // 4. Finger-order reversals. One mild reversal may be acceptable;
    // multiple or severe reversals indicate a knotted hand position.
    const ordered = [
      {finger:0, action:indexAction},
      {finger:1, action:middleAction},
      {finger:2, action:ringAction},
      {finger:3, action:littleAction}
    ].filter(x => x.action);

    let reversals = 0;
    let severeReversals = 0;

    for(let i = 0; i < ordered.length; i++){
      for(let j = i + 1; j < ordered.length; j++){
        const a = ordered[i];
        const b = ordered[j];
        if(a.action.fret > b.action.fret){
          reversals++;
          if(a.action.fret - b.action.fret >= 2) severeReversals++;
        }
      }
    }

    if(severeReversals >= 2 || reversals >= 3){
      issues.push(`Multiple finger-order reversals`);
    } else if(reversals >= 1){
      warnings.push(`Finger-order reversal`);
    }

    // 5. Adjacent-string stretch check in physical terms.
    const soundingByString = stats.sounding
      .filter(note => note.fret > 0)
      .sort((a,b) => a.stringIndex - b.stringIndex);
    for(let i = 0; i < soundingByString.length - 1; i++){
      const a = soundingByString[i];
      const b = soundingByString[i + 1];

      if(b.stringIndex - a.stringIndex !== 1) continue;

      const distanceMm = fretDistanceMm(a.fret, b.fret);
      if(distanceMm > 78){
        issues.push(`Severe adjacent-string stretch between ${STRING_LABELS[a.stringIndex]} and ${STRING_LABELS[b.stringIndex]}`);
      } else if(distanceMm > 58){
        warnings.push(`Wide adjacent-string stretch between ${STRING_LABELS[a.stringIndex]} and ${STRING_LABELS[b.stringIndex]}`);
      }
    }

    // 6. Combined strain: several marginal features together become implausible.
    if(warnings.length >= 4){
      issues.push(`Too many simultaneous strain factors`);
    }

    let tier = "Credible";
    if(issues.length) tier = "Reject";
    else if(warnings.length >= 2) tier = "Marginal";

    return {
      tier,
      issues,
      warnings,
      penalty: issues.length * 1000 + warnings.length * 35
    };
  }

  function pitchIntervalsInOrder(stats){
    const pitches = stats.sounding
      .map(note => ({
        midi: openMidi(note.stringIndex) + note.fret,
        degree: mod12(note.pc - getRootPitchClass())
      }))
      .sort((a,b) => a.midi - b.midi);

    const intervals = [];
    for(let i = 0; i < pitches.length - 1; i++){
      intervals.push(pitches[i + 1].midi - pitches[i].midi);
    }
    return {pitches, intervals};
  }

  function chordToneOrder(spec){
    return [...new Set([
      ...(spec.required || []),
      ...(spec.optional || [])
    ])].sort((a,b) => a - b);
  }

  function normalizePitchClassSequence(sequence){
    if(!sequence.length) return [];
    const normalized = [sequence[0]];
    for(let i = 1; i < sequence.length; i++){
      let value = sequence[i];
      while(value <= normalized[i - 1]) value += 12;
      normalized.push(value);
    }
    return normalized;
  }

  function rotations(array){
    return array.map((_, index) =>
      [...array.slice(index), ...array.slice(0, index)]
    );
  }

  function classifyDropFamily(stats, spec){
    const uniqueDegrees = [...new Set(
      stats.sounding.map(note => mod12(note.pc - getRootPitchClass()))
    )];

    if(uniqueDegrees.length !== 4 || stats.sounding.length !== 4){
      return [];
    }

    const chordOrder = chordToneOrder(spec);
    if(chordOrder.length < 4) return [];

    const selected = uniqueDegrees
      .map(degree => chordOrder.indexOf(degree))
      .filter(index => index >= 0)
      .sort((a,b) => a - b);

    if(selected.length !== 4) return [];

    const actualDegrees = stats.sounding
      .map(note => ({
        pitch: openMidi(note.stringIndex) + note.fret,
        degree: mod12(note.pc - getRootPitchClass())
      }))
      .sort((a,b) => a.pitch - b.pitch)
      .map(note => note.degree);

    const tags = [];

    for(const rotation of rotations(selected)){
      const closedDegrees = rotation.map(index => chordOrder[index]);
      const closed = normalizePitchClassSequence(closedDegrees);

      const closedPitchClasses = closed.map(value => mod12(value));
      if(actualDegrees.every((degree, i) => degree === closedPitchClasses[i])){
        tags.push("closed");
      }

      const drop2 = [...closed];
      drop2[2] -= 12;
      drop2.sort((a,b) => a-b);
      const drop2Pcs = drop2.map(value => mod12(value));
      if(actualDegrees.every((degree, i) => degree === drop2Pcs[i])){
        tags.push("drop-2");
      }

      const drop3 = [...closed];
      drop3[1] -= 12;
      drop3.sort((a,b) => a-b);
      const drop3Pcs = drop3.map(value => mod12(value));
      if(actualDegrees.every((degree, i) => degree === drop3Pcs[i])){
        tags.push("drop-3");
      }
    }

    return [...new Set(tags)];
  }

  function sameNumberArray(a, b){
    return (
      a.length === b.length &&
      a.every((value, index) => value === b[index])
    );
  }

  function structureMatchesFromRoot(pcs, candidateRoot, intervals){
    const actual = pcs
      .map(pc => mod12(pc - candidateRoot))
      .sort((a,b) => a-b);

    return sameNumberArray(actual, intervals);
  }

  function upperStringsAreAdjacent(upperNotes){
    const strings = upperNotes
      .map(note => note.stringIndex)
      .sort((a,b) => a-b);

    for(let i = 1; i < strings.length; i++){
      if(strings[i] !== strings[i - 1] + 1) return false;
    }
    return true;
  }

  function analyzeUpperStructureOverBass(stats){
    if(stats.sounding.length !== 4 && stats.sounding.length !== 5){
      return null;
    }

    const ordered = stats.sounding
      .map(note => ({
        ...note,
        pitch:openMidi(note.stringIndex) + note.fret
      }))
      .sort((a,b) => a.pitch - b.pitch);

    const bass = ordered[0];
    const upper = ordered.slice(1);

    if(upper.length !== 3 && upper.length !== 4) return null;
    if(!upperStringsAreAdjacent(upper)) return null;

    // The bass must also be on a lower-numbered guitar string than the
    // entire adjacent upper structure.
    if(!upper.every(note => note.stringIndex > bass.stringIndex)){
      return null;
    }

    const upperPcs = [...new Set(upper.map(note => note.pc))];
    if(upperPcs.length !== upper.length) return null;

    const labels = [];

    if(upper.length === 3){
      for(const candidateRoot of upperPcs){
        for(const definition of THREE_NOTE_UPPER_STRUCTURES){
          if(
            structureMatchesFromRoot(
              upperPcs,
              candidateRoot,
              definition.intervals
            )
          ){
            labels.push(
              `${NOTE_NAMES[candidateRoot]} ${definition.label} over ${NOTE_NAMES[bass.pc]}`
            );
          }
        }
      }

      // Also identify the three-note shape as the rootless portion of a
      // seventh chord when applicable. The implied root may be absent
      // from the upper structure and may coincide with the bass.
      for(let candidateRoot = 0; candidateRoot < 12; candidateRoot++){
        for(const definition of ROOTLESS_SEVENTH_STRUCTURES){
          if(
            structureMatchesFromRoot(
              upperPcs,
              candidateRoot,
              definition.intervals
            )
          ){
            labels.push(
              `${NOTE_NAMES[candidateRoot]} ${definition.label} over ${NOTE_NAMES[bass.pc]}`
            );
          }
        }
      }
    }

    if(upper.length === 4){
      for(const candidateRoot of upperPcs){
        for(const definition of FOUR_NOTE_UPPER_STRUCTURES){
          if(
            structureMatchesFromRoot(
              upperPcs,
              candidateRoot,
              definition.intervals
            )
          ){
            labels.push(
              `${NOTE_NAMES[candidateRoot]} ${definition.label} over ${NOTE_NAMES[bass.pc]}`
            );
          }
        }
      }
    }

    const uniqueLabels = [...new Set(labels)];
    if(!uniqueLabels.length) return null;

    return {
      bassPc:bass.pc,
      upperStringIndexes:upper.map(note => note.stringIndex),
      labels:uniqueLabels
    };
  }

  function classifyVoicing(chordName, stats){
    const spec = CHORDS[chordName];
    const degreeSet = new Set(
      stats.sounding.map(note => mod12(note.pc - getRootPitchClass()))
    );
    const {intervals} = pitchIntervalsInOrder(stats);
    const tags = [];

    const hasRoot = degreeSet.has(0);
    const hasMajorThird = degreeSet.has(4);
    const hasMinorThird = degreeSet.has(3);
    const hasMajorSeventh = degreeSet.has(11);
    const hasMinorSeventh = degreeSet.has(10);
    const hasThird = hasMajorThird || hasMinorThird;
    const hasSeventh = hasMajorSeventh || hasMinorSeventh;
    const uniqueCount = degreeSet.size;

    const thirdDegreesPresent = [3,4].filter(degree => degreeSet.has(degree));
    const seventhDegreesPresent = [10,11].filter(degree => degreeSet.has(degree));

    const exactlyOneThird = thirdDegreesPresent.length === 1;
    const exactlyOneSeventh = seventhDegreesPresent.length === 1;

    // Guide tones: exactly the third and seventh, with their qualities
    // determined by the chord. No root, fifth, or extensions.
    if(
      !hasRoot &&
      !degreeSet.has(7) &&
      exactlyOneThird &&
      exactlyOneSeventh &&
      uniqueCount === 2
    ){
      tags.push("guide-tones");
    }

    // Shell: exactly root, third, and seventh. No fifth and no extensions.
    if(
      hasRoot &&
      !degreeSet.has(7) &&
      exactlyOneThird &&
      exactlyOneSeventh &&
      uniqueCount === 3
    ){
      tags.push("shell");
    }

    // Guide-tone extension: third and seventh plus one or more extensions,
    // with no root and no fifth.
    const extensionDegrees = [...degreeSet].filter(degree =>
      ![0,3,4,7,10,11].includes(degree)
    );

    if(
      !hasRoot &&
      !degreeSet.has(7) &&
      exactlyOneThird &&
      exactlyOneSeventh &&
      extensionDegrees.length >= 1 &&
      uniqueCount === 2 + extensionDegrees.length
    ){
      tags.push("guide-tone-extension");
    }

    if(intervals.some(interval => interval <= 3)){
      tags.push("cluster");
    }

    if(intervals.some(interval => interval >= 7)){
      tags.push("spread");
    }

    const sortedDegrees = [...degreeSet].sort((a,b) => a-b);
    const triadSets = [
      [0,4,7], [0,3,7], [0,3,6], [0,4,8],
      [0,2,7], [0,5,7]
    ];
    if(
      uniqueCount === 3 &&
      triadSets.some(set =>
        set.every((degree, index) => degree === sortedDegrees[index])
      )
    ){
      tags.push("triad");
    }

    const colorToneCount = [...degreeSet].filter(degree =>
      ![0,3,4,7,10,11].includes(degree)
    ).length;

    if(
      !hasRoot &&
      exactlyOneThird &&
      exactlyOneSeventh &&
      uniqueCount >= 3 &&
      uniqueCount <= 4 &&
      colorToneCount >= 1
    ){
      tags.push("rootless-jazz");
    }

    const upperStructure = analyzeUpperStructureOverBass(stats);
    if(upperStructure){
      tags.push("upper-structure-over-bass");
    }

    if(stats.sounding.length === 6){
      tags.push("full-six-string");
    }

    tags.push(...classifyDropFamily(stats, spec));
    return [...new Set(tags)];
  }

  function upperClusterAnalysis(shape, stats){
    if(stats.soundingCount < 4){
      return {
        applies:false,
        contiguous:false,
        internalMutedStrings:0
      };
    }

    const orderedByPitch = stats.sounding
      .map(note => ({
        ...note,
        pitch:openMidi(note.stringIndex) + note.fret
      }))
      .sort((a,b) => a.pitch - b.pitch);

    const bass = orderedByPitch[0];
    const upperStrings = orderedByPitch
      .slice(1)
      .map(note => note.stringIndex)
      .sort((a,b) => a-b);

    if(upperStrings.length < 3){
      return {
        applies:false,
        contiguous:false,
        internalMutedStrings:0
      };
    }

    let internalMutedStrings = 0;

    for(let i = 1; i < upperStrings.length; i++){
      internalMutedStrings += Math.max(
        0,
        upperStrings[i] - upperStrings[i - 1] - 1
      );
    }

    return {
      applies:true,
      contiguous:internalMutedStrings === 0,
      internalMutedStrings,
      bassString:bass.stringIndex,
      upperStrings
    };
  }

  function upperClusterScoreAdjustment(shape, stats){
    const analysis = upperClusterAnalysis(shape, stats);

    if(!analysis.applies){
      return 0;
    }

    // The distance between the bass and the upper voices is irrelevant.
    // What matters is whether the upper voices themselves occupy one
    // uninterrupted run of adjacent strings.
    if(analysis.contiguous){
      return -1000;
    }

    // Make every muted-string break inside the upper voicing a dominant
    // ranking penalty so a contiguous upper cluster reliably appears first.
    return analysis.internalMutedStrings * 1000;
  }

  function lowOpenPositionAdjustment(stats){
    let adjustment = 0;

    // Open strings are musically useful and physically economical.
    // Reward them enough that familiar open-position shapes are not buried
    // beneath equivalent closed voicings higher on the neck.
    adjustment -= stats.openCount * 28;

    // Give first-position / low-position shapes a meaningful preference.
    // This is deliberately stronger than the old tiny minFret penalty,
    // while still allowing compact higher voicings to remain available.
    if(stats.minFret <= 3) adjustment -= 90;

    return adjustment;
  }

  function preliminaryScore(stats, shape){
    let score = 0;
    score += stats.span * 100;
    score += stats.minFret * 6;
    score += lowOpenPositionAdjustment(stats);
    score += upperClusterScoreAdjustment(shape, stats);
    if(stats.bass && stats.bass.degree !== "1") score += 14;
    return score;
  }

  function generationScore(stats, shape, fingering, anatomy){
    let score = 0;
    score += stats.span * 100;
    score += stats.minFret * 6;
    score += lowOpenPositionAdjustment(stats);
    score += upperClusterScoreAdjustment(shape, stats);
    score += fingering.actions.length * 8;
    score += Math.max(0, fingering.cost || 0);
    score += anatomy.penalty;
    if(stats.bass && stats.bass.degree !== "1") score += 14;
    return score;
  }

  function lowestFrettedNote(shape){
    const fretted = shape.filter(fret => fret !== null && fret > 0);
    return fretted.length ? Math.min(...fretted) : null;
  }

  function shapeMatchesNeckRegion(shape){
    const [rangeMin, rangeMax] = engineState.neckRange;
    const lowest = lowestFrettedNote(shape);
    if(lowest === null) return rangeMin === 1;
    return lowest >= rangeMin && lowest <= rangeMax;
  }

  function generateShapes(
    chordName,
    minFret,
    maxFret,
    maxSpan,
    bassDegree,
    maxResults,
    voicingType,
    openStringsMode
  ){
    const baseSpec = CHORDS[chordName];
    const spec = voicingGenerationSpec(chordName, voicingType);

    if(!spec){
      return {
        analyzed:[],
        totalMusicallyValid:0,
        analyzedCount:0
      };
    }

    const required = [...(spec.required || [])];
    const optional = [...(spec.optional || [])];
    const allowedDegrees = new Set([
      ...required,
      ...optional
    ]);

    // Store degree information with each fret so it is not recalculated
    // repeatedly during the search.
    const choices = Array.from({length:6}, (_, stringIndex) => {
      return candidateFretsForString(
        stringIndex,
        minFret,
        maxFret,
        allowedDegrees,
        openStringsMode
      ).map(fret => ({
        fret,
        degree: fret === null
          ? null
          : mod12(notePc(stringIndex, fret) - getRootPitchClass())
      }));
    });

    // Which required degrees could still be supplied by each remaining
    // suffix of strings? This permits early rejection of dead branches.
    const suffixPossible = new Array(7);
    suffixPossible[6] = new Set();

    for(let stringIndex = 5; stringIndex >= 0; stringIndex--){
      const possible = new Set(suffixPossible[stringIndex + 1]);
      choices[stringIndex].forEach(option => {
        if(option.degree !== null) possible.add(option.degree);
      });
      suffixPossible[stringIndex] = possible;
    }

    const shape = new Array(6).fill(null);
    const degreeCounts = new Array(12).fill(0);

    // Keep only the strongest inexpensive candidates instead of retaining
    // and sorting every valid fingering in memory.
    const poolLimit = Math.max(240, maxResults * 5);
    const preliminaryPool = [];
    const preliminaryShapeKeys = new Set();
    let totalMusicallyValid = 0;

    function shapePoolKey(shape){
      return shape.map(fret => fret===null ? "x" : String(fret)).join(",");
    }

    function insertIntoPool(item){
      const key=shapePoolKey(item.shape);

      // The generator can reach the same physical shape through multiple
      // internal degree/fingering paths. Do not let duplicate shapes consume
      // the bounded candidate pool and crowd out other useful voicings.
      if(preliminaryShapeKeys.has(key)) return;

      let low = 0;
      let high = preliminaryPool.length;

      while(low < high){
        const middle = (low + high) >> 1;
        if(preliminaryPool[middle].preliminaryScore <= item.preliminaryScore){
          low = middle + 1;
        } else {
          high = middle;
        }
      }

      preliminaryPool.splice(low, 0, item);
      preliminaryShapeKeys.add(key);

      if(preliminaryPool.length > poolLimit){
        const removed=preliminaryPool.pop();
        if(removed) preliminaryShapeKeys.delete(shapePoolKey(removed.shape));
      }
    }

    function missingRequiredCanStillBeFound(nextStringIndex){
      const remaining = suffixPossible[nextStringIndex];

      for(const degree of required){
        if(degreeCounts[degree] === 0 && !remaining.has(degree)){
          return false;
        }
      }
      return true;
    }

    function allRequiredPresent(){
      for(const degree of required){
        if(degreeCounts[degree] === 0) return false;
      }
      return true;
    }

    function recurse(
      stringIndex,
      soundingCount,
      currentMin,
      currentMax,
      bassHasBeenChosen
    ){
      const remainingStringCount = 6 - stringIndex;

      if(soundingCount + remainingStringCount < spec.minSounding) return;
      if(soundingCount > spec.maxSounding) return;
      if(!missingRequiredCanStillBeFound(stringIndex)) return;

      if(stringIndex === 6){
        if(
          soundingCount < spec.minSounding ||
          soundingCount > spec.maxSounding ||
          !allRequiredPresent()
        ) return;

        if(
          openStringsMode === "required" &&
          !shape.some(fret => fret === 0)
        ) return;

        if(spec.requireAtLeastOneOptional){
          const hasOptional = optional.some(degree => degreeCounts[degree] > 0);
          if(!hasOptional) return;
        }

        if(spec.requireTwoOptional){
          const optionalPresentCount = optional.reduce(
            (count, degree) => count + (degreeCounts[degree] > 0 ? 1 : 0),
            0
          );
          if(optionalPresentCount < 2) return;
        }

        if(spec.requireAtLeastThreeDistinct){
          const distinctCount = degreeCounts.reduce(
            (count, occurrences) => count + (occurrences > 0 ? 1 : 0),
            0
          );
          if(distinctCount < 3) return;
        }

        // Apply repeat-note rules according to chord size.
        //
        // Triads: repeated chord tones are allowed.
        //
        // Four-note chords:
        //   4 sounding strings -> no repeats
        //   5 sounding strings -> one repeated note
        //   6 sounding strings -> two repeated notes
        //
        // Chords containing five or more defined tones continue to
        // exclude repeated degrees so the result groups stay concise.
        const definedChordDegrees = [...new Set([
          ...(spec.required || []),
          ...(spec.optional || [])
        ])];

        const uniquePresentDegreeCount = degreeCounts.reduce(
          (count, occurrences) => count + (occurrences > 0 ? 1 : 0),
          0
        );

        const repeatedNoteCount = soundingCount - uniquePresentDegreeCount;
        const definedChordToneCount = definedChordDegrees.length;

        let maximumAllowedRepeats = 0;

        if(
          ["spread","upper-structure-over-bass"].includes(voicingType)
        ){
          maximumAllowedRepeats = Math.max(0, soundingCount - 3);
        } else if(definedChordToneCount === 3){
          maximumAllowedRepeats = Math.max(0, soundingCount - 3);
        } else if(definedChordToneCount === 4){
          maximumAllowedRepeats = Math.max(0, soundingCount - 4);
        }

        if(repeatedNoteCount > maximumAllowedRepeats) return;

        totalMusicallyValid++;

        const stats = shapeStats(shape);

        const presentDegrees = new Set(
          stats.sounding.map(note => mod12(note.pc - getRootPitchClass()))
        );
        const missingRequired = required.filter(
          degree => !presentDegrees.has(degree)
        );
        if(missingRequired.length) return;

        if(!shapeMatchesNeckRegion(shape)){
          return;
        }

        const voicingTags = classifyVoicing(chordName, stats);

        // Family and neck-region filters are applied before the bounded candidate pool.
        // This prevents compact voicings from crowding out Drop, Spread,
        // Quartal, Shell, or other selected families.
        if(
          voicingType !== "all" &&
          !voicingTags.includes(voicingType)
        ){
          return;
        }

        insertIntoPool({
          shape:[...shape],
          stats,
          voicingTags,
          preliminaryScore:preliminaryScore(stats, shape)
        });
        return;
      }

      for(const option of choices[stringIndex]){
        const fret = option.fret;
        const degree = option.degree;

        // The first sounding string is the bass. Reject the branch
        // immediately when it is not the selected bass degree.
        if(!bassHasBeenChosen && degree !== null && degree !== bassDegree){
          continue;
        }

        const nextCount = soundingCount + (fret === null ? 0 : 1);
        let nextMin = currentMin;
        let nextMax = currentMax;

        if(fret !== null && fret > 0){
          nextMin = currentMin === null ? fret : Math.min(currentMin, fret);
          nextMax = currentMax === null ? fret : Math.max(currentMax, fret);

          if(nextMax - nextMin > maxSpan) continue;
        }

        shape[stringIndex] = fret;

        if(degree !== null) degreeCounts[degree]++;

        recurse(
          stringIndex + 1,
          nextCount,
          nextMin,
          nextMax,
          bassHasBeenChosen || degree !== null
        );

        if(degree !== null) degreeCounts[degree]--;
      }

      shape[stringIndex] = null;
    }

    recurse(0, 0, null, null, false);

    // The costly fingering and anatomical analysis is restricted to the
    // bounded preliminary pool.
    const analyzed = [];

    for(const item of preliminaryPool){
      const fingering = findBestFingerAssignment(item.stats);
      if(!fingering.credible) continue;

      const anatomy = analyzeHandPosture(item.stats, fingering);
      if(anatomy.tier === "Reject") continue;

      const voicingTags = item.voicingTags || classifyVoicing(chordName, item.stats);

      const upperStructure = analyzeUpperStructureOverBass(item.stats);

      analyzed.push({
        shape:item.shape,
        stats:item.stats,
        fingering,
        anatomy,
        voicingTags,
        upperStructure,
        upperCluster:upperClusterAnalysis(item.shape, item.stats),
        score:generationScore(item.stats, item.shape, fingering, anatomy)
      });
    }

    analyzed.sort((a,b) => a.score - b.score);

    return {
      analyzed,
      totalMusicallyValid,
      analyzedCount:preliminaryPool.length
    };
  }

  function transposeDegreeSet(degrees, rootPc){
    return degrees.map(degree => mod12(rootPc + degree));
  }

  function pitchClassSetForShape(shape){
    return new Set(
      shape
        .map((fret, stringIndex) =>
          fret === null ? null : notePc(stringIndex, fret)
        )
        .filter(pc => pc !== null)
    );
  }

  function bassPcForShape(shape){
    const sounding = shape
      .map((fret, stringIndex) => {
        if(fret === null) return null;
        return {
          pc:notePc(stringIndex, fret),
          pitch:openMidi(stringIndex) + fret
        };
      })
      .filter(Boolean)
      .sort((a,b) => a.pitch - b.pitch);

    return sounding.length ? sounding[0].pc : null;
  }

  function chordTemplateMatches(shape, rootPc, spec){
    const pcs = pitchClassSetForShape(shape);
    const required = transposeDegreeSet(spec.required || [], rootPc);
    const optional = transposeDegreeSet(spec.optional || [], rootPc);
    const forbidden = transposeDegreeSet(spec.forbidden || [], rootPc);
    const allowed = new Set([...required, ...optional]);

    for(const pc of required){
      if(!pcs.has(pc)) return false;
    }

    for(const pc of forbidden){
      if(pcs.has(pc)) return false;
    }

    for(const pc of pcs){
      if(!allowed.has(pc)) return false;
    }

    return true;
  }

  function identifyChordNames(shape){
    const matches = [];
    const bassPc = bassPcForShape(shape);

    for(let rootPc = 0; rootPc < 12; rootPc++){
      Object.entries(CHORDS).forEach(([templateName, spec]) => {
        if(!chordTemplateMatches(shape, rootPc, spec)) return;

        const suffix = CHORD_TEMPLATE_SUFFIX[templateName];
        const baseName = `${ROOT_NOTE_NAMES[rootPc]}${suffix}`;
        const displayName =
          bassPc !== null && bassPc !== rootPc
            ? `${baseName}/${ROOT_NOTE_NAMES[bassPc]}`
            : baseName;

        matches.push({
          chordName:displayName,
          rootPc,
          templateName,
          suffix,
          pitchClasses:[...pitchClassSetForShape(shape)].sort((a,b) => a-b)
        });
      });
    }

    const seen = new Set();
    return matches.filter(match => {
      if(seen.has(match.chordName)) return false;
      seen.add(match.chordName);
      return true;
    });
  }

  function movementData(sourceShape, candidateShape){
    const retained = [];
    const removed = [];
    const added = [];
    const moved = [];

    for(let stringIndex = 0; stringIndex < 6; stringIndex++){
      const from = sourceShape[stringIndex];
      const to = candidateShape[stringIndex];

      if(from === to){
        if(from !== null){
          retained.push({stringIndex, fret:from});
        }
        continue;
      }

      if(from !== null && to === null){
        removed.push({stringIndex, fret:from});
      }else if(from === null && to !== null){
        added.push({stringIndex, fret:to});
      }else{
        moved.push({
          stringIndex,
          fromFret:from,
          toFret:to,
          distance:Math.abs(to - from)
        });
      }
    }

    return {
      sourceShape:[...sourceShape],
      candidateShape:[...candidateShape],
      retained,
      removed,
      added,
      moved
    };
  }

  function compareVoicingShapes(sourceShape, candidateShape){
    let sharedPositions = 0;
    let movedOnSameString = 0;
    let addedStrings = 0;
    let removedStrings = 0;
    let totalFretMovement = 0;
    let largestMovement = 0;
    let unchangedSoundingStrings = 0;

    for(let stringIndex = 0; stringIndex < 6; stringIndex++){
      const sourceFret = sourceShape[stringIndex];
      const candidateFret = candidateShape[stringIndex];

      const sourceSounds = sourceFret !== null;
      const candidateSounds = candidateFret !== null;

      if(sourceSounds && candidateSounds){
        unchangedSoundingStrings++;

        if(sourceFret === candidateFret){
          sharedPositions++;
        }else{
          const movement = Math.abs(candidateFret - sourceFret);
          movedOnSameString++;
          totalFretMovement += movement;
          largestMovement = Math.max(largestMovement, movement);
        }
      }else if(!sourceSounds && candidateSounds){
        addedStrings++;
      }else if(sourceSounds && !candidateSounds){
        removedStrings++;
      }
    }

    const fingersMoved =
      movedOnSameString + addedStrings + removedStrings;

    const score =
      totalFretMovement * 8 +
      largestMovement * 6 +
      fingersMoved * 12 +
      (addedStrings + removedStrings) * 10 -
      sharedPositions * 28 -
      unchangedSoundingStrings * 4;

    return {
      score,
      sharedPositions,
      movedOnSameString,
      addedStrings,
      removedStrings,
      fingersMoved,
      totalFretMovement,
      largestMovement,
      unchangedSoundingStrings
    };
  }

  function nearbyMutationValues(shape, stringIndex){
    const current = shape[stringIndex];
    const values = new Set();

    if(current === null){
      // Add a note near the current hand position.
      const fretted = shape.filter(fret => fret !== null && fret > 0);
      const center = fretted.length
        ? Math.round(fretted.reduce((sum, fret) => sum + fret, 0) / fretted.length)
        : 1;

      for(let fret = Math.max(1, center - 2); fret <= Math.min(15, center + 2); fret++){
        values.add(fret);
      }

      values.add(0);
    }else{
      values.add(null);

      for(let movement = -2; movement <= 2; movement++){
        if(movement === 0) continue;
        const fret = current + movement;

        if(fret >= 1 && fret <= 15){
          values.add(fret);
        }

        if(fret === 0){
          values.add(0);
        }
      }
    }

    return [...values];
  }

  function generateOneMoveNeighbors(sourceItem){
    const candidates = [];
    const seen = new Set();

    for(let stringIndex = 0; stringIndex < 6; stringIndex++){
      for(const newValue of nearbyMutationValues(sourceItem.shape, stringIndex)){
        const shape = [...sourceItem.shape];
        shape[stringIndex] = newValue;

        const key = shape.map(fret => fret === null ? "x" : String(fret)).join(",");
        if(seen.has(key)) continue;
        seen.add(key);

        const chordMatches = identifyChordNames(shape);
        if(!chordMatches.length) continue;

        const stats = shapeStats(shape);
        if(stats.span > engineState.maxSpan) continue;

        const fingering = findBestFingerAssignment(stats);
        if(!fingering.credible) continue;

        const anatomy = analyzeHandPosture(stats, fingering);
        if(anatomy.tier === "Reject") continue;

        const comparison = compareVoicingShapes(
          sourceItem.shape,
          shape
        );

        chordMatches.forEach(match => {
          const movement = movementData(
            sourceItem.shape,
            shape
          );

          candidates.push({
            chordName:match.chordName,
            chordMatch:match,
            sourceShape:movement.sourceShape,
            candidateShape:movement.candidateShape,
            retainedPositions:movement.retained,
            removedPositions:movement.removed,
            addedPositions:movement.added,
            movedPositions:movement.moved,
            shape,
            comparison,
            anatomy,
            fingering
          });
        });
      }
    }

    return candidates;
  }

  function findNearbyVoicings(sourceItem, maximumResults = 8){
    return generateOneMoveNeighbors(sourceItem)
      .filter(result => {
        const sourceMatches = identifyChordNames(sourceItem.shape)
          .map(match => match.chordName);
        return !sourceMatches.includes(result.chordName);
      })
      .sort((a,b) => {
        if(a.comparison.score !== b.comparison.score){
          return a.comparison.score - b.comparison.score;
        }

        if(a.comparison.sharedPositions !== b.comparison.sharedPositions){
          return b.comparison.sharedPositions - a.comparison.sharedPositions;
        }

        return a.chordName.localeCompare(b.chordName);
      })
      .slice(0, maximumResults);
  }

  function physicalFamilyForVoicing(item){
    const {shape, stats} = item;

    if(shape.some(fret => fret === 0)){
      return "open";
    }

    const hasRoot = stats.sounding.some(note =>
      mod12(note.pc - getRootPitchClass()) === 0
    );

    if(!hasRoot){
      return "rootless";
    }

    const lowestPlayedString = shape.findIndex(fret => fret !== null);

    if(lowestPlayedString === 0) return "string-6";
    if(lowestPlayedString === 1) return "string-5";
    if(lowestPlayedString === 2) return "string-4";

    return "other";
  }

  function voicingRankingClass(item){
    const tags = item.voicingTags || [];

    const isThreeNoteStructure =
      item.stats.soundingCount <= 3 ||
      tags.includes("shell") ||
      tags.includes("guide-tones") ||
      tags.includes("triad");

    if(isThreeNoteStructure){
      return 1;
    }

    // Four-or-more-note complete voicings rank first.
    return 0;
  }

  function constructionPriorityForVoicing(item){
    const tags = item.voicingTags || [];

    for(let i = 0; i < CONSTRUCTION_SORT_PRIORITY.length; i++){
      if(tags.includes(CONSTRUCTION_SORT_PRIORITY[i])) return i;
    }

    return CONSTRUCTION_SORT_PRIORITY.length;
  }

  function groupVoicings(items){
    const groups = new Map(
      PHYSICAL_FAMILY_ORDER.map(key => [key, []])
    );

    items.forEach(item => {
      const family = physicalFamilyForVoicing(item);
      groups.get(family).push(item);
    });

    groups.forEach(itemsInGroup => {
      itemsInGroup.sort((a,b) => {
        const classDifference =
          voicingRankingClass(a) -
          voicingRankingClass(b);

        if(classDifference !== 0){
          return classDifference;
        }

        const scoreDifference = a.score - b.score;

        if(scoreDifference !== 0){
          return scoreDifference;
        }

        return (
          constructionPriorityForVoicing(a) -
          constructionPriorityForVoicing(b)
        );
      });
    });

    return groups;
  }

  function generateVoicings(options={}){
    const chordName = options.chordName || "D9";
    const tuning = options.tuning || STANDARD_TUNING_MIDI;
    setRootPitchClass(options.rootPc ?? 2);
    setTuning(tuning);
    engineState.neckRange = options.neckRange ? [...options.neckRange] : [1,15];
    engineState.maxSpan = Number(options.maxSpan ?? 5);
    engineState.openStringsMode = options.openStringsMode || "optional";
    return generateShapes(
      chordName,
      engineState.neckRange[0],
      engineState.neckRange[1],
      engineState.maxSpan,
      Number(options.bassDegree ?? 0),
      Number(options.maxResults ?? 60),
      options.voicingType || "all",
      engineState.openStringsMode
    );
  }

  global.VoicingEngine = {
    version:"1.2", STANDARD_TUNING_MIDI, CHORDS, VOICING_TYPE_LABELS,
    setTuning, getTuning, openMidi, openPitchClass, openNoteName, openOctave,
    setRootPitchClass, getRootPitchClass, setDegreeLabelOverrides,
    generateVoicings, generateShapes, findNearbyVoicings, identifyChordNames,
    compareVoicingShapes, movementData, shapeStats, classifyVoicing,
    physicalFamilyForVoicing, groupVoicings
  };
})(window);

  -> chord information -> information mode -> master render/events.

const ROOT_PC={"C":0,"C♯":1,"D♭":1,"D":2,"D♯":3,"E♭":3,"E":4,"F":5,"F♯":6,"G♭":6,"G":7,"G♯":8,"A♭":8,"A":9,"A♯":10,"B♭":10,"B":11};

const LETTER_PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const ACCIDENTAL_OFFSET={"":0,"♯":1,"♭":-1};
const SHARP_NOTE_NAMES=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const FLAT_NOTE_NAMES=["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];

function keyPcFromParts(letter,accidental){
  return mod12(LETTER_PC[letter]+ACCIDENTAL_OFFSET[accidental]);
}
function keyDisplayName(){
  return `${state.keyLetter}${state.keyAccidental}${state.keyQuality==="Minor"?"m":""}`;
}
function keyUsesFlats(){
  if(state.keyAccidental==="♭") return true;
  if(state.keyAccidental==="♯") return false;

  // Conventional natural-key defaults.
  const flatNaturalMajors=new Set(["F"]);
  const flatNaturalMinors=new Set(["D","G","C","F"]);
  return state.keyQuality==="Minor"
    ? flatNaturalMinors.has(state.keyLetter)
    : flatNaturalMajors.has(state.keyLetter);
}
function noteNameForCurrentKey(pc){
  return (keyUsesFlats()?FLAT_NOTE_NAMES:SHARP_NOTE_NAMES)[mod12(pc)];
}

const CONVENTIONAL_MAJOR_NAMES=[
  "C","D♭","D","E♭","E","F","F♯","G","A♭","A","B♭","B"
];

function conventionalMajorNameForPc(pc){
  return CONVENTIONAL_MAJOR_NAMES[mod12(pc)];
}

function setParentMajorSpellingFromPc(){
  const name=conventionalMajorNameForPc(state.keyPc);
  state.keyLetter=name[0];
  state.keyAccidental=name.slice(1);
  state.keyQuality="Major";
  state.keyTonicPc=state.keyPc;
}

const TONE_PC={"1":0,"♭2":1,"♭9":1,"2":2,"9":2,"#9":3,"♭3":3,"3":4,"4":5,"11":5,"#11":6,"♭5":6,"5":7,"#5":8,"♭13":8,"6":9,"13":9,"𝄫7":9,"♭7":10,"7":11};
const TONE_ORDER=["1","♭2","2","♭3","3","4","♭5","5","#5","6","𝄫7","♭7","7","♭9","9","#9","11","#11","♭13","13"];
const EDITABLE_TONES=["♭5","5","#5","6","𝄫7","♭7","7","♭9","9","#9","11","#11","♭13","13"];

const MODE_OPTIONS=[
  {number:1,name:"Ionian",degreeOffset:0},

  {number:3,name:"Phrygian",degreeOffset:4},

];

/* ================================================================
   6. Small music helpers
   ================================================================ */
function mod12(n){return ((Number(n)%12)+12)%12}
function tuningNoteName(midi){
  // Tuning names are independent of harmonic function; use the current
  // key's preferred accidental direction for a visually consistent label.
  return noteNameForCurrentKey(mod12(midi));
}
function tuningIsOpenable(){
  // "Empty fretboard" means no selected chord/root and no pentatonic overlay.
  return !state.root && state.pentMode==="off";
}
function canLowerDraftString(i){
  if(!draftTuning) return false;
  const next=draftTuning[i]-1;
  if(next<0) return false;
  return i===0 || next>=draftTuning[i-1];
}
function canRaiseDraftString(i){
  if(!draftTuning) return false;
  const next=draftTuning[i]+1;
  if(next>127) return false;
  return i===draftTuning.length-1 || next<=draftTuning[i+1];
}

function orderedUnique(items){
  return [...new Set(items)].sort((a,b)=>{
    const ai=TONE_ORDER.indexOf(a), bi=TONE_ORDER.indexOf(b);
    return (ai<0?99:ai)-(bi<0?99:bi);
  });
}
function has(t){return state.tones.includes(t)}

/* ================================================================
   3. CHORD NAMING & HARMONIC ANALYSIS
   ================================================================ */
function chordSuffix(){
  if(!state.identity) return "";
  const label=state.identity.label;

  // Omission labels are derived from the tones actually present, not from
  // how the chord was constructed (Triad vs Root).
  const hasThird=has("3") || has("♭3");
  const hasFifth=has("5") || has("♭5") || has("#5");
  const omit3=!hasThird ? "(no3)" : "";
  const omit5=!hasFifth ? "(no5)" : "";
  const omissions=omit3+omit5;

  const alteredOrder=["♭5","#5","♭9","#9","#11","♭13"];
  const altered=(exclude=new Set())=>alteredOrder.filter(t=>has(t)&&!exclude.has(t)).join("");
  let suffix=state.identity.suffix;

  if(label==="Major"){
    const used=new Set();
    if(has("♭7")){
      used.add("♭7");
      if(has("13")){suffix="13";used.add("13");if(has("9"))used.add("9");if(has("11"))used.add("11")}
      else if(has("11")){suffix="11";used.add("11");if(has("9"))used.add("9")}
      else if(has("9")){suffix="9";used.add("9")}
      else suffix="7";
    } else if(has("6")&&has("9")){suffix="6/9";used.add("6");used.add("9")}
    else if(has("6")){suffix="6";used.add("6")}
    else if(has("13")){suffix="maj13";used.add("7");used.add("9");used.add("13")}
    else if(has("7")&&has("9")&&has("#11")){suffix="maj9#11";used.add("7");used.add("9");used.add("#11")}
    else if(has("7")&&has("9")){suffix="maj9";used.add("7");used.add("9")}
    else if(has("7")){suffix="maj7";used.add("7")}
    else if(has("9")){suffix="add9";used.add("9")}
    else if(has("#11")){suffix="add#11";used.add("#11")}
    else suffix="";
    if(has("11")&&!used.has("11")) suffix+="add11";
    if(has("13")&&!used.has("13")) suffix+="add13";
    return suffix+altered(used)+omissions;
  }
  if(label==="Major 7"){
    const used=new Set(["7"]);
    if(has("13")&&has("#11")){suffix="maj13#11";used.add("13");used.add("#11");used.add("9")}
    else if(has("13")){suffix="maj13";used.add("13");used.add("9")}
    else if(has("9")&&has("#11")){suffix="maj9#11";used.add("9");used.add("#11")}
    else if(has("9")){suffix="maj9";used.add("9")}
    else if(has("#11")){suffix="maj7#11";used.add("#11")}
    else suffix="maj7";
    if(has("11")) suffix+="add11";
    return suffix+altered(used)+omissions;
  }
  if(label==="Minor" || label==="Minor 7"){
    const used=new Set(label==="Minor 7"?["♭7"]:[]);
    if(has("7")){suffix="m(maj7)";used.add("7")}
    else if(has("13")){suffix="m13";used.add("♭7");used.add("9");used.add("11");used.add("13")}
    else if(has("11")){suffix="m11";used.add("♭7");used.add("9");used.add("11")}
    else if(has("9")){suffix=has("♭7")?"m9":"madd9";used.add("9");if(has("♭7"))used.add("♭7")}
    else if(has("♭7")){suffix="m7";used.add("♭7")}
    else if(has("6")){suffix="m6";used.add("6")}
    else suffix="m";
    if(has("11")&&!used.has("11"))suffix+="add11";
    if(has("13")&&!used.has("13"))suffix+="add13";
    return suffix+altered(used)+omissions;
  }
  if(label==="Dominant"){
    const used=new Set(["♭7"]);
    if(has("13")){suffix="13";used.add("13");if(has("9"))used.add("9");if(has("11"))used.add("11")}
    else if(has("11")){suffix="11";used.add("11");if(has("9"))used.add("9")}
    else if(has("9")){suffix="9";used.add("9")}
    else suffix="7";
    return suffix+altered(used)+omissions;
  }
  if(label==="Half diminished"){
    // Build the displayed name from the tones that are actually active.
    // A half-diminished identity normally contains ♭7, but EXT/ALT can
    // remove it; when it is absent the title must not retain an implied 7.
    const used=new Set(["♭5"]);
    if(has("♭7")){
      used.add("♭7");
      if(has("11")){
        suffix="m11♭5";
        used.add("11");
        if(has("9")) used.add("9");
      }else if(has("9")){
        suffix="m9♭5";
        used.add("9");
      }else{
        suffix="m7♭5";
      }
    }else{
      suffix="m♭5";
      if(has("9")){
        suffix+="add9";
        used.add("9");
      }
      if(has("11")){
        suffix+="add11";
        used.add("11");
      }
    }
    return suffix+altered(used)+omit3;
  }
  if(label==="Diminished") return (has("𝄫7")?"°7":"°")+omissions;
  if(label==="Augmented"){
    const used=new Set(["#5"]);
    if(has("♭7")&&has("9")){suffix="9#5";used.add("♭7");used.add("9")}
    else if(has("♭7")){suffix="7#5";used.add("♭7")}
    else if(has("7")&&has("9")){suffix="+maj9";used.add("7");used.add("9")}
    else if(has("7")){suffix="+maj7";used.add("7")}
    else suffix="+";
    return suffix+altered(used)+omissions;
  }
  if(label==="Sus2") return (has("♭7")?(has("9")?"9sus2":"7sus2"):"sus2")+altered()+omit5;
  if(label==="Sus4") return (has("13")?"13sus4":has("9")?"9sus4":has("♭7")?"7sus4":"sus4")+altered()+omit5;
  return suffix+altered();
}

function chordName(){return state.root ? state.root+(state.identity?chordSuffix():"") : ""}

function currentTargetChord(){
  if(!state.root) return null;

  const rootPc=ROOT_PC[state.root];
  const activeTones=orderedUnique([...state.tones]);
  const pitchClasses=activeTones.map(tone=>mod12(rootPc+TONE_PC[tone]));

  return {
    root:state.root,
    rootPc,
    name:chordName(),
    identity:state.identity ? state.identity.label : null,
    family:state.identity ? state.identity.family : null,
    tones:activeTones,
    pitchClasses,
    mode:{
      index:state.modeIndex,
      number:currentMode().number,
      name:currentMode().name,
      tonicPc:modalTonicPc(),
      tonicName:functionalModalNameForPc(modalTonicPc())
    },
    key:{
      parentMajorPc:state.keyPc,
      parentMajorName:conventionalMajorNameForPc(state.keyPc),
      selectedTonicPc:state.keyTonicPc,
      selectedName:keyDisplayName(),
      quality:state.keyQuality
    }
  };
}

function targetChordSignature(target=currentTargetChord()){
  if(!target) return "";
  return [
    target.rootPc,
    target.identity || "",
    target.tones.join(","),
    target.mode.index,
    target.key.parentMajorPc
  ].join("|");
}

function chordTonesForFormula(rootPc,formula){
  return formula.map(interval=>mod12(rootPc+interval));
}

function makeLeadingCandidate({
  rootPc,
  suffix,
  formula,
  family,
  relation,
  description,
  target,
  baseScore=0
}){
  const tones=chordTonesForFormula(rootPc,formula);
  const inModeCount=tones.filter(pc=>modalCollection().includes(pc)).length;

  return {
    rootPc,
    rootName:functionalModalNameForPc(rootPc),
    suffix,
    name:`${functionalModalNameForPc(rootPc)}${suffix}`,
    formula:[...formula],
    tones,
    family,
    relation,
    description,
    targetSignature:targetChordSignature(target),
    inModeCount,
    outOfModeCount:formula.length-inModeCount,
    baseScore
  };
}

function generateLeadingChordCandidates(target=currentTargetChord()){
  if(!target) return [];

  const candidates=[];
  const targetRoot=target.rootPc;

  // 1) Dominant approach: V7 -> target.
  const dominantRoot=mod12(targetRoot+7);
  candidates.push(makeLeadingCandidate({
    rootPc:dominantRoot,
    suffix:"7",
    formula:[0,4,7,10],
    family:"dominant",
    relation:"V7",
    description:"Dominant approach to the target",
    target,
    baseScore:100
  }));

  // 2) Leading-tone diminished: vii° / vii°7 -> target.
  const leadingToneRoot=mod12(targetRoot-1);
  candidates.push(makeLeadingCandidate({
    rootPc:leadingToneRoot,
    suffix:"°",
    formula:[0,3,6],
    family:"diminished",
    relation:"vii°",
    description:"Leading-tone diminished approach",
    target,
    baseScore:92
  }));
  candidates.push(makeLeadingCandidate({
    rootPc:leadingToneRoot,
    suffix:"°7",
    formula:[0,3,6,9],
    family:"diminished",
    relation:"vii°7",
    description:"Fully diminished leading-tone approach",
    target,
    baseScore:96
  }));

  // 3) Tritone substitute for the dominant: root a semitone above target.
  const tritoneSubRoot=mod12(targetRoot+1);
  candidates.push(makeLeadingCandidate({
    rootPc:tritoneSubRoot,
    suffix:"7",
    formula:[0,4,7,10],
    family:"tritone-sub",
    relation:"subV7",
    description:"Tritone-substitute dominant approach",
    target,
    baseScore:82
  }));

  // 4) Diatonic/modal predecessor roots: adjacent scale-step motion.
  const collection=modalCollection();
  const targetDegree=collection.indexOf(targetRoot);
  if(targetDegree>=0){
    const prevDegree=(targetDegree+6)%7;
    const nextDegree=(targetDegree+1)%7;

    [prevDegree,nextDegree].forEach((degreeIndex,idx)=>{
      const rootPc=collection[degreeIndex];
      const triad=diatonicTriadForPc(rootPc);
      if(!triad) return;

      candidates.push(makeLeadingCandidate({
        rootPc,
        suffix:triad.suffix,
        formula:triad.intervals,
        family:"modal-step",
        relation:idx===0 ? "previous scale degree" : "next scale degree",
        description:idx===0
          ? "Diatonic/modal step into the target from below in scale order"
          : "Diatonic/modal step into the target from above in scale order",
        target,
        baseScore:66
      }));
    });
  }

  // 5) ii -> V-type predominant when the target itself is dominant-ish.
  // If the target contains a major 3 and flat 7, treat it as a dominant target.
  const targetIsDominant=target.tones.includes("3") && target.tones.includes("♭7");
  if(targetIsDominant){
    const iiRoot=mod12(targetRoot-5); // a whole functional step above the dominant's tonic target
    candidates.push(makeLeadingCandidate({
      rootPc:iiRoot,
      suffix:"m7",
      formula:[0,3,7,10],
      family:"predominant",
      relation:"ii7 → V7",
      description:"Predominant ii7 leading into a dominant target",
      target,
      baseScore:90
    }));
  }

  // Remove exact duplicates while preserving the strongest version.
  const byName=new Map();
  for(const candidate of candidates){
    const key=`${candidate.rootPc}|${candidate.suffix}|${candidate.relation}`;
    const existing=byName.get(key);
    if(!existing || candidate.baseScore>existing.baseScore){
      byName.set(key,candidate);
    }
  }

  return [...byName.values()];
}


function voiceLeadingDistance(candidate,target){
  if(!candidate || !target) return 999;

  const targetPcs=[...new Set(target.pitchClasses)];
  const sourcePcs=[...new Set(candidate.tones)];

  // Sum the nearest pitch-class distance from each source tone to any target tone.
  // This is deliberately octave-agnostic for now; actual voicing comes later.
  return sourcePcs.reduce((sum,pc)=>{
    const nearest=Math.min(...targetPcs.map(tpc=>{
      const d=mod12(tpc-pc);
      return Math.min(d,12-d);
    }));
    return sum+nearest;
  },0);
}

function targetContainsAlteration(target){
  if(!target) return false;
  return target.tones.some(t=>["♭5","#5","♭9","#9","#11","♭13","13","11","9"].includes(t));
}

function scoreLeadingCandidate(candidate,target=currentTargetChord()){
  if(!candidate || !target) return -999;

  let score=candidate.baseScore || 0;

  // Prefer candidates whose own tones fit the current modal collection.
  score += candidate.inModeCount * 5;
  score -= candidate.outOfModeCount * 3;

  // Reward smooth pitch-class voice leading.
  const distance=voiceLeadingDistance(candidate,target);
  score += Math.max(0,18-(distance*3));

  // Context-specific family weighting.
  switch(candidate.family){
    case "dominant":
      score += 12;
      break;
    case "diminished":
      score += 8;
      break;
    case "predominant":
      score += 10;
      break;
    case "tritone-sub":
      score += 2;
      break;
    case "modal-step":
      score += 4;
      break;
  }

  // If the target is itself dominant, ii7 -> V7 is especially useful.
  const targetIsDominant=target.tones.includes("3") && target.tones.includes("♭7");
  if(targetIsDominant && candidate.family==="predominant"){
    score += 16;
  }

  // Altered targets benefit more from chromatic dominant/diminished approaches.
  if(targetContainsAlteration(target)){
    if(candidate.family==="diminished") score += 7;
    if(candidate.family==="tritone-sub") score += 6;
    if(candidate.family==="dominant") score += 4;
  }

  // Avoid overwhelming the list with two versions of the same diminished root.
  if(candidate.suffix==="°") score -= 3;

  return Math.round(score*10)/10;
}

function rankLeadingChordCandidates(target=currentTargetChord()){
  if(!target) return [];

  const scored=generateLeadingChordCandidates(target).map(candidate=>({
    ...candidate,
    score:scoreLeadingCandidate(candidate,target),
    voiceLeadingDistance:voiceLeadingDistance(candidate,target)
  }));

  // Keep the strongest representative from each root/family combination.
  const bestByBucket=new Map();
  for(const candidate of scored){
    const bucket=`${candidate.rootPc}|${candidate.family}`;
    const existing=bestByBucket.get(bucket);
    if(!existing || candidate.score>existing.score){
      bestByBucket.set(bucket,candidate);
    }
  }

  return [...bestByBucket.values()].sort((a,b)=>
    (b.score-a.score) ||
    (a.voiceLeadingDistance-b.voiceLeadingDistance) ||
    (a.rootPc-b.rootPc)
  );
}

function bestLeadingChordCandidates(limit=5,target=currentTargetChord()){
  if(!target) return [];
  const ranked=rankLeadingChordCandidates(target);

  // Curate diversity: at most two from any one family and normally no more
  // than one candidate per root. This keeps the future popup readable.
  const result=[];
  const familyCounts=new Map();
  const usedRoots=new Set();

  for(const candidate of ranked){
    if(result.length>=limit) break;

    const familyCount=familyCounts.get(candidate.family) || 0;
    if(familyCount>=2) continue;
    if(usedRoots.has(candidate.rootPc)) continue;

    result.push(candidate);
    familyCounts.set(candidate.family,familyCount+1);
    usedRoots.add(candidate.rootPc);
  }

  return result;
}


function leadingCandidateDisplay(candidate,target){
  return `${candidate.name} → ${target.name}`;
}

function leadingCandidateExplanation(candidate){
  switch(candidate.family){
    case "dominant":
      return "Dominant approach";
    case "predominant":
      return "Predominant ii-type approach";
    case "diminished":
      return candidate.suffix==="°7"
        ? "Fully diminished leading-tone approach"
        : "Leading-tone diminished approach";
    case "tritone-sub":
      return "Tritone-substitute dominant approach";
    case "modal-step":
      return candidate.description || "Diatonic/modal stepwise approach";
    default:
      return candidate.description || "Leading-chord possibility";
  }
}


function positionLeadingPopupBelowNut(){
  const popup=document.getElementById("leadingPopup");
  const overlay=document.getElementById("leadingOverlay");
  const nut=document.querySelector(".gm-exact-nut");
  const boardWrap=document.querySelector(".gm-exact-wrap");
  if(!popup || !overlay || !nut || !boardWrap) return;

  const overlayRect=overlay.getBoundingClientRect();
  const nutRect=nut.getBoundingClientRect();
  const boardRect=boardWrap.getBoundingClientRect();

  // Place the information box just beneath the rendered nut.
  const gap=6;
  const top=Math.max(0,nutRect.bottom-overlayRect.top+gap);
  popup.style.top=`${top}px`;

  // Never let a long information box extend below the fretboard.
  const bottomGap=8;
  const available=Math.max(
    120,
    boardRect.bottom-(overlayRect.top+top)-bottomGap
  );
  popup.style.maxHeight=`${available}px`;
}

function showLeadingChordPopup(){
  const target=currentTargetChord();
  if(!target) return;

  hideGuidance();

  const overlay=document.getElementById("leadingOverlay");
  const popup=document.getElementById("leadingPopup");

  const rootData=rootGuidanceForPc(target.rootPc);
  const modalName=functionalModalNameForPc(modalTonicPc());
  const parentKeyName=conventionalMajorNameForPc(state.keyPc);
  const context=`In ${modalName} ${currentMode().name} (Key of ${parentKeyName})`;

  const aboutItems=(rootData?.items || []).slice(0,3);
  const hasDefinedChord=!!state.identity;
  const candidates=hasDefinedChord ? bestLeadingChordCandidates(5,target) : [];

  popup.innerHTML=`
    <div class="leading-title">${hasDefinedChord ? target.name : target.root}</div>
    <div class="leading-context">${context}</div>

    <div class="leading-section-title">About this ${hasDefinedChord ? "chord" : "root"}</div>
    <div class="leading-list leading-about-list">
      ${aboutItems.length
        ? aboutItems.map(([chord,desc])=>`
          <div class="leading-item leading-info-item">
            <span class="leading-item-main">${chord}</span>
            <span class="leading-item-desc">${desc}</span>

function wireLeadingPopupTapToClose(){
  const overlay=document.getElementById("leadingOverlay");
  const popup=document.getElementById("leadingPopup");
  if(!overlay || !popup || overlay.dataset.tapCloseWired==="1") return;

  overlay.dataset.tapCloseWired="1";

  // Tap anywhere on the popup closes it.
  popup.addEventListener("click",event=>{
    event.preventDefault();
    event.stopPropagation();
    hideLeadingChordPopup();
  });

  // Tap the surrounding overlay/backdrop closes it too.
  overlay.addEventListener("click",event=>{
    if(event.target===overlay){
      event.preventDefault();
      event.stopPropagation();
      hideLeadingChordPopup();
    }
  });
}

function hideLeadingChordPopup(){
  const overlay=document.getElementById("leadingOverlay");
  const popup=document.getElementById("leadingPopup");
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
  if(popup){
    popup.style.top="";
    popup.style.maxHeight="";
  }
}

function functionalNameForRelativePc(relPc){
  const pc=mod12(state.keyPc+relPc);

  // Prefer flat spellings for modal/borrowed degrees expressed with flats.
  const flatFunctionRels=new Set([1,3,8,10]);
  if(flatFunctionRels.has(mod12(relPc))){
