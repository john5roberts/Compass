    if(triad && rn){

      items.push([`${rootName}${triad.suffix} · ${rn}`,desc]);
    }

  // rather than listing every mathematically possible V/X or subV/X.
  switch(rel){

      items.push([`${rootName}° · ♯iv° → ${vChord}`,"Chromatic leading-tone approach to v"]);

      items.push([`${rootName}7 · V7 → ${tonicChord}`,"Strong dominant motion back to the modal tonic"]);

    case 1: { // ♭II chromatic
      items.push([`${rootName} · ♭II`,"Chromatic flat-2 color; outside Mixolydian"]);
      break;
    }
    case 2: { // ii
      const v=modalChordNameForTriadPc(mod12(tonic+7));
      items.push([`${rootName}7 · V/v → ${v}`,"Useful secondary dominant to the diatonic minor v"]);
      break;
    }
    case 3: { // ♭III chromatic
      items.push([`${rootName} · ♭III`,"Chromatic flat-3 color; outside Mixolydian"]);
      break;
    }
    case 4: { // iii°
      const vi=modalChordNameForTriadPc(mod12(tonic+9));
      items.push([`${rootName}7 · V/vi → ${vi}`,"Useful secondary dominant to vi"]);
      break;
    }
    case 5: { // IV
      const flatVII=modalChordNameForTriadPc(mod12(tonic+10));
      items.push([`${rootName}7 · V/♭VII → ${flatVII}`,"Useful secondary dominant to the characteristic ♭VII"]);
      break;
    }
    case 6: { // ♯IV/♭5 chromatic
      items.push([`${rootName} · ♯IV`,"Chromatic tritone root; outside Mixolydian"]);
      break;
    }
    case 7: { // v
      const tonicChord=modalChordNameForTriadPc(tonic);
      items.push([`${rootName}7 · V7 → ${tonicChord}`,"Major-dominant alteration; strong pull back to the modal tonic"]);
      break;
    }
    case 8: { // ♭VI chromatic
      items.push([`${rootName} · ♭VI`,"Chromatic flat-6 color; outside Mixolydian"]);
      break;
    }
    case 9: { // vi
      const ii=modalChordNameForTriadPc(mod12(tonic+2));
      items.push([`${rootName}7 · V/ii → ${ii}`,"Useful secondary dominant to ii"]);
      break;
    }
    case 10: { // ♭VII characteristic
      items.push([`${rootName} · ♭VII`,"Characteristic Mixolydian subtonic; one of the mode's defining harmonies"]);
      break;
    }
    case 11: { // natural VII chromatic
      items.push([`${rootName} · VII`,"Chromatic leading-tone root; outside Mixolydian and strongly points toward the tonic"]);
      break;
    }
  }

  const seen=new Set();
  return {
    title:rootName,
    items:items.filter(([heading])=>{
      if(seen.has(heading)) return false;
      seen.add(heading);
      return true;
    })
  };
}


function aeolianRootGuidanceForPc(rootPc){
  const tonic=modalTonicPc();
  const rel=mod12(rootPc-tonic);
  const degreeIndex=modalDegreeIndexForPc(rootPc);
  const items=[];
  const rootName=functionalModalNameForPc(rootPc);

  if(degreeIndex>=0){
    const triad=diatonicTriadForPc(rootPc);
    const rn=diatonicRomanNumeralForPc(rootPc);
    if(triad && rn){
      const desc=(MODAL_DEGREE_DESCRIPTIONS[5] || [])[degreeIndex] || "Diatonic Aeolian triad";
      items.push([`${rootName}${triad.suffix} · ${rn}`,desc]);
    }
  }

  switch(rel){
    case 0:{
      const iv=modalChordNameForTriadPc(mod12(tonic+5));
      items.push([`${rootName}7 · V/iv → ${iv}`,"Secondary dominant to iv"]);
      items.push([`${rootName}`,"Parallel-major tonic color"]);
      break;
    }
    case 1:
      items.push([`${rootName} · ♭II`,"Phrygian color; outside Aeolian"]);
      break;
    case 2:
      break;
    case 3:{
      const VI=modalChordNameForTriadPc(mod12(tonic+8));
      items.push([`${rootName}7 · V/VI → ${VI}`,"Secondary dominant to VI"]);
      break;
    }
    case 4:
      items.push([`${rootName} · III`,"Chromatic major-3 color; replaces Aeolian's ♭3 and weakens the minor identity"]);
      break;
    case 5:{
      const VII=modalChordNameForTriadPc(mod12(tonic+10));
      items.push([`${rootName}7 · V/VII → ${VII}`,"Secondary dominant to VII"]);
      break;
    }
    case 6:
      items.push([`${rootName} · ♯IV`,"Chromatic tritone root; outside Aeolian"]);
      break;
    case 7:{
      const tonicChord=modalChordNameForTriadPc(tonic);
      items.push([`${rootName}7 · V7 → ${tonicChord}`,"Harmonic-minor dominant: raises scale degree 7 for a strong return to the tonic"]);
      break;
    }
    case 8:
      break;
    case 9:{
      const VI=modalChordNameForTriadPc(mod12(tonic+8));
      items.push([`${rootName}7 · subV/VI → ${VI}`,"Chromatic tritone-substitute approach to VI"]);
      break;
    }
    case 10:{
      const III=modalChordNameForTriadPc(mod12(tonic+3));
      items.push([`${rootName}7 · V/III → ${III}`,"Secondary dominant to III"]);
      break;
    }
    case 11:{
      const tonicChord=modalChordNameForTriadPc(tonic);
      const Vroot=functionalModalNameForPc(mod12(tonic+7));
      items.push([`${rootName}° · vii°/i → ${tonicChord}`,"Raised-7 leading-tone diminished chord from harmonic minor"]);
      items.push([`${rootName}°7 · vii°7/i → ${tonicChord}`,"Fully diminished leading-tone seventh chord; strong harmonic-minor resolution to the tonic"]);
      items.push([`${Vroot}7 → ${tonicChord}`,"The same raised 7 appears inside the harmonic-minor dominant V7"]);
      break;
    }
  }

  if(degreeIndex<0 && items.length===0){
    items.push([`${rootName} · ${CHROMATIC_DEGREE_LABELS[rel]}`,"Chromatic root outside Aeolian"]);
  }

  const seen=new Set();
  return {
    title:rootName,
    items:items.filter(([heading])=>{
      if(seen.has(heading)) return false;
      seen.add(heading);
      return true;
    })
  };
}


function locrianRootGuidanceForPc(rootPc){
  const tonic = modalTonicPc();
  const rel = mod12(rootPc-tonic);
  const degreeIndex = modalDegreeIndexForPc(rootPc);
  const items = [];
  const rootName = functionalModalNameForPc(rootPc);

  // Native Locrian triad first.
  if(degreeIndex >= 0){
    const triad = diatonicTriadForPc(rootPc);
    const locrianRN = ["i°","♭II","♭iii","iv","♭V","♭VI","♭vii"][degreeIndex];
    const nativeDescriptions = [
      "Locrian diminished tonic; the ♭5 is one of the mode's defining tones",
      "Characteristic ♭II; semitone above the tonic and a strong Locrian color",
      "Diatonic minor ♭III",
      "Diatonic minor iv",
      "Characteristic ♭V; defines the diminished quality of the Locrian tonic",
      "Diatonic ♭VI",
      "Diatonic minor ♭VII"
    ];
    if(triad){
      items.push([
        `${rootName}${triad.suffix} · ${locrianRN}`,
        nativeDescriptions[degreeIndex]
      ]);
    }
  }

  // Chromatic roots: explain the modal alteration first.
  switch(rel){
    case 1: // ♭II native
    case 3: // ♭III native
    case 5: // iv native
    case 6: // ♭V native
    case 8: // ♭VI native
    case 10: // ♭VII native
      break;

    case 0: // i° native
      break;

    case 2: // natural II
      items.push([
        `${rootName} · II`,
        "Chromatic natural-2 color; replaces Locrian's characteristic ♭2"
      ]);
      break;

    case 4: // natural III
      items.push([
        `${rootName} · III`,
        "Chromatic major-3 color; outside Locrian and strongly changes the mode's minor character"
      ]);
      break;

    case 7: // natural V
      items.push([
        `${rootName} · V`,
        "Chromatic perfect-5 root; replaces Locrian's defining ♭5 and weakens the mode's identity"
      ]);
      break;

    case 9: // natural VI
      items.push([
        `${rootName} · VI`,
        "Chromatic natural-6 color; outside Locrian"
      ]);
      break;

    case 11: // natural VII
      items.push([
        `${rootName} · VII`,
        "Chromatic leading-tone root; outside Locrian and creates a strong pull toward the tonic"
      ]);
      break;
  }

  if(degreeIndex < 0 && items.length === 0){
    items.push([
      `${rootName} · ${CHROMATIC_DEGREE_LABELS[rel]}`,
      "Chromatic root outside Locrian"
    ]);
  }

  const seen = new Set();
  return {
    title: rootName,
    items: items.filter(([heading]) => {
      if(seen.has(heading)) return false;
      seen.add(heading);
      return true;
    })
  };
}

function rootGuidanceForPc(rootPc){
  // Curated modal policies: teach modal identity first, then only stronger
  // functional alternatives. Avoid filling chromatic roots with low-value
  // tritone-substitute explanations merely because one can be calculated.
  if(state.modeIndex===0) return ionianRootGuidanceForPc(rootPc);
  if(state.modeIndex===1) return dorianRootGuidanceForPc(rootPc);
  if(state.modeIndex===2) return phrygianRootGuidanceForPc(rootPc);
  if(state.modeIndex===3) return lydianRootGuidanceForPc(rootPc);
  if(state.modeIndex===4) return mixolydianRootGuidanceForPc(rootPc);
  if(state.modeIndex===5) return aeolianRootGuidanceForPc(rootPc);
  if(state.modeIndex===6) return locrianRootGuidanceForPc(rootPc);

  throw new Error(`Unsupported modeIndex: ${state.modeIndex}`);
}


function hideGuidance(){

    });
  }
}


const DIATONIC_TRIAD_PATTERNS=[
  {intervals:[0,4,7],suffix:"",identity:"Major"},
  {intervals:[0,3,7],suffix:"m",identity:"Minor"},
  {intervals:[0,3,6],suffix:"°",identity:"Diminished"}
];

const ROMAN_DEGREES=["I","II","III","IV","V","VI","VII"];
const CHROMATIC_ROMAN_LABELS=[
  "I","♭II","II","♭III","III","IV","♯IV","V","♭VI","VI","♭VII","VII"
];

function chromaticRomanNumeralForPc(pc){
  const rel=mod12(pc-modalTonicPc());
  return CHROMATIC_ROMAN_LABELS[rel];
}

function isRestEmphasisPc(pc){
  if(state.root) return false;
  const degreeIndex=modalDegreeIndexForPc(pc);
  return degreeIndex===0 || degreeIndex===5; // modal scale degrees 1 and 6
}


function diatonicRomanNumeralForPc(rootPc){
  const degreeIndex=modalDegreeIndexForPc(rootPc);
  if(degreeIndex<0) return "";

  const triad=diatonicTriadForPc(rootPc);
  if(!triad) return "";

  const base=ROMAN_DEGREES[degreeIndex];
  if(triad.identity==="Major") return base;
  if(triad.identity==="Minor") return base.toLowerCase();
  if(triad.identity==="Diminished") return base.toLowerCase()+"°";
  return base;
}

function diatonicTriadForPc(rootPc){
  const collection=modalCollection();
  const degreeIndex=collection.indexOf(mod12(rootPc));
  if(degreeIndex<0) return null;

  const third=collection[(degreeIndex+2)%7];
  const fifth=collection[(degreeIndex+4)%7];
  const rel=[0,mod12(third-rootPc),mod12(fifth-rootPc)];

  return DIATONIC_TRIAD_PATTERNS.find(p=>
    p.intervals.every((v,i)=>v===rel[i])
  ) || null;
}

function identityByLabel(label){
  return IDENTITIES.find(id=>id.label===label) || null;
}

/*
  TRIAD view:
  Native scale roots use the actual diatonic triad.
  Chromatic roots use one musically useful default triad so that every
  root button is live rather than frozen.

  Ionian is explicitly curated to the choices established for C major:
    ♭II/#I -> diminished
    ♭III    -> major
    #IV     -> diminished
    ♭VI     -> major
    ♭VII    -> major

  Other modes use a conservative relevance score: maximize common tones
  with the current modal collection, while mildly favoring familiar
  borrowed-major colors (♭III/♭VI/♭VII) and #IV diminished.
*/
function preferredTriadForPc(rootPc){
  const native=diatonicTriadForPc(rootPc);
  if(native) return {...native,native:true};

  const rel=mod12(rootPc-modalTonicPc());

  if(currentMode().number===1){
    const ionianMap={
      1:"Diminished",
      3:"Major",
      6:"Diminished",
      8:"Major",
      10:"Major"
    };
    const preferred=ionianMap[rel];
    if(preferred){
      const pattern=DIATONIC_TRIAD_PATTERNS.find(p=>p.identity===preferred);
      if(pattern) return {...pattern,native:false};
    }
  }

  const collection=new Set(modalCollection().map(mod12));
  const styleBonus=(identity)=>{
    if(identity==="Major" && [3,8,10].includes(rel)) return 1.15;
    if(identity==="Diminished" && rel===6) return .85;
    return 0;
  };
  const tiePriority={Major:3,Diminished:2,Minor:1};

  const ranked=DIATONIC_TRIAD_PATTERNS.map(pattern=>{
    const common=pattern.intervals.slice(1).reduce((n,interval)=>
      n+(collection.has(mod12(rootPc+interval))?1:0),0);
    return {
      ...pattern,
      native:false,
      score:common+styleBonus(pattern.identity),
      tie:tiePriority[pattern.identity] || 0
    };
  }).sort((a,b)=>(b.score-a.score)||(b.tie-a.tie));

  return ranked[0] || null;
}

function triadRomanNumeralForPc(rootPc,triad){
  if(!triad) return chromaticRomanNumeralForPc(rootPc);
  if(triad.native) return diatonicRomanNumeralForPc(rootPc);

  const base=chromaticRomanNumeralForPc(rootPc);
  if(triad.identity==="Minor") return base.toLowerCase();
  if(triad.identity==="Diminished") return base.toLowerCase()+"°";
  return base;
}


function toggleBuilderMode(){
  hideGuidance();

  const toTriad=state.builderMode==="manual";
  state.builderMode=toTriad ? "diatonic" : "manual";
  state.panel="root";

  if(state.root){
    if(toTriad){
      const triad=preferredTriadForPc(ROOT_PC[state.root]);
      const identity=triad ? identityByLabel(triad.identity) : null;
      state.identity=identity;
      state.tones=identity ? [...identity.base] : ["1"];
      state.locked=identity ? [...identity.locked] : ["1"];
    }else{
      // In an active progression edit, retain the stored harmony so Save
      // remains valid from the Root stage. Outside edit mode, Root starts bare.
      if(state.progressionEditIndex<0){
        state.identity=null;
        state.tones=["1"];
        state.locked=["1"];
      }
    }
  }

  if(state.pentMode==="chord") state.pentMode="key";
  render();
}

function renderBuilderStartToggle(){
  const toggle=document.getElementById("builderStartToggle");
  if(!toggle) return;

  const rootMode=state.builderMode==="manual";
  toggle.classList.toggle("root-mode",rootMode);
  toggle.setAttribute("aria-pressed",rootMode ? "true" : "false");

  document.querySelectorAll("[data-start-label]").forEach(label=>{
    label.classList.toggle(
      "active",
      label.dataset.startLabel===(rootMode ? "root" : "triad")
    );
  });
}
function identityGuideClass(identity){
  if(!state.root) return "";
  const rootPc=ROOT_PC[state.root];
  const allInKey=identity.base.every(tone=>isInReferenceKey(mod12(rootPc+TONE_PC[tone])));
  return allInKey ? "guide-in-key" : "guide-out-key";
}
function harmonyGuideDots(identity){
  if(!state.root) return "";
  const rootPc=ROOT_PC[state.root];
  const dots=identity.base.map(tone=>{
    const pc=mod12(rootPc+TONE_PC[tone]);
    const cls=isInReferenceKey(pc) ? "in-key" : "out-key";
    return `<span class="harmony-guide-dot ${cls}" aria-hidden="true"></span>`;
  }).join("");
  return `<span class="harmony-dot-row">${dots}</span>`;
}
function toneGuideClass(tone){
  if(!state.root) return "";
  return guideClassForPc(mod12(ROOT_PC[state.root]+TONE_PC[tone]));
}

function markerLabel(stringIndex,fret,tone){
  const pc=notePc(stringIndex,fret);
  const mode=state.fretboardDisplayMode;
  if(mode==="note") return noteNameForCurrentKey(pc);
  if(mode==="key") return keyIntervalLabel(pc);
  return tone;
}
function setFretboardDisplay(mode){
  if(!["chord","note","key"].includes(mode)) return;
  state.fretboardDisplayMode=mode;
  renderFretboard();
  renderFretboardDisplaySwitch();
}
function cycleFretboardDisplay(){
  const current=state.fretboardDisplayMode || "chord";
  const next=current==="chord" ? "note" : current==="note" ? "key" : "chord";
  setFretboardDisplay(next);
}
function renderFretboardDisplaySwitch(){
  document.querySelectorAll("[data-display-mode]").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.displayMode===state.fretboardDisplayMode);
  });
}

/* ================================================================
   7. Static fretboard renderer
   This renderer always draws all six strings and all 15 frets. It does not
   know about voicings; it simply marks every location whose pitch class is
   present in state.tones.
   ================================================================ */
const BOARD_W=183, BOARD_H=586, TOTAL_FRETS=15, EDGE=7;
const STRING_WIDTHS=[6,5,4,3,2,1];
const STRING_X=Array.from({length:6},(_,i)=>EDGE+(BOARD_W-EDGE*2)*(i/5));
function stringX(i){return STRING_X[Math.max(0,Math.min(5,i))]}
function fretBoundary(f){return BOARD_H/TOTAL_FRETS*f}
function fretCenter(f){return (fretBoundary(f-1)+fretBoundary(f))/2}
function notePc(stringIndex,fret){return mod12(state.tuning[stringIndex]+fret)}

// 1.36: In Progression View, an assigned voicing narrows the permanent
// fretboard from every occurrence of each chord tone to the six-string
// fingering stored on the selected progression entry. Outside View, the
// normal Chord Notes renderer remains unchanged.
function activeProgressionVoicingFrets(){
  if(Array.isArray(temporaryVoicingPreviewFrets) && temporaryVoicingPreviewFrets.length===6){
    return temporaryVoicingPreviewFrets.map(f=>f===null || f===undefined ? null : Number(f));
  }
  if(!state.progressionView || state.progressionViewShowAllTones) return null;
  const entry=selectedProgressionEntry();
  const frets=entry?.voicing?.frets;
  if(!Array.isArray(frets) || frets.length!==6) return null;
  return frets.map(f=>f===null || f===undefined ? null : Number(f));
}

/* ================================================================
   4. FRETBOARD RENDERING
   ================================================================ */
function renderFretboard(){
  const assignedVoicingFrets=activeProgressionVoicingFrets();
  const fretLines=Array.from({length:TOTAL_FRETS},(_,i)=>`<div class="gm-exact-fret" style="top:${fretBoundary(i+1)-1.5}px"></div>`).join("");
  const strings=Array.from({length:6},(_,i)=>`<div class="gm-exact-string" style="left:${stringX(i)}px;width:${STRING_WIDTHS[i]}px"></div>`).join("");
  const inlays=[3,5,7,9,15].map(f=>`<div class="gm-exact-inlay" style="left:${BOARD_W/2}px;top:${fretCenter(f)}px"></div>`).join("")+
    [0.3,0.7].map(p=>`<div class="gm-exact-inlay" style="left:${BOARD_W*p}px;top:${fretCenter(12)}px"></div>`).join("");
  const fretNumbers="";
  const stringNumbers="";

  const pentSet=state.pentMode==="key" ? keyPentatonicSet() : state.pentMode==="chord" ? chordPentatonicSet() : null;
  const pentClass=state.pentMode==="key" ? "key-pent" : "chord-pent";
  const pentOpenDots=pentSet ? Array.from({length:6},(_,i)=>{
    const pc=notePc(i,0);
    const outline=isInReferenceKey(pc) ? "var(--green)" : "var(--red)";
    return pentSet.has(pc)?`<div class="pent-open-dot ${pentClass}" style="left:${stringX(i)}px;--pent-outline:${outline}"></div>`:"";
  }).join("") : "";

    const openMarks=Array.from({length:6},(_,i)=>{
    const pc=notePc(i,0);
    const tone=toneForPc(pc);
    const voicingUsesOpen=!assignedVoicingFrets || assignedVoicingFrets[i]===0;
    if(!tone || !voicingUsesOpen){
      return `<div class="gm-exact-open" style="left:${stringX(i)}px">${tuningNoteName(state.tuning[i])}</div>`;
    }
    const inKey=isInReferenceKey(pc);
    const fill=inKey ? "var(--green)" : "var(--red)";
    const ink=inKey ? "#07101a" : "#fff";
    return `<div class="gm-exact-open active" data-marker="1" data-string="${i}" data-fret="0" style="left:${stringX(i)}px;--marker-fill:${fill};--marker-ink:${ink}">${markerLabel(i,0,tone)}</div>`;
  }).join("");

  let pentMarks="";
  if(pentSet){
    for(let stringIndex=0;stringIndex<6;stringIndex++){
      for(let fret=1;fret<=TOTAL_FRETS;fret++){
        const pc=notePc(stringIndex,fret);
        if(pentSet.has(pc)){
          const outline=isInReferenceKey(pc) ? "var(--green)" : "var(--red)";
          pentMarks+=`<div class="pent-dot ${pentClass}" style="left:${stringX(stringIndex)}px;top:${fretCenter(fret)}px;--pent-outline:${outline}"></div>`;
        }
      }
    }
  }

  let chordMarks="";
  if(state.root){
    for(let stringIndex=0;stringIndex<6;stringIndex++){
      for(let fret=1;fret<=TOTAL_FRETS;fret++){
        if(assignedVoicingFrets && assignedVoicingFrets[stringIndex]!==fret) continue;
        const pc=notePc(stringIndex,fret);
        const tone=toneForPc(pc);
        if(!tone) continue;
        const inKey=isInReferenceKey(pc);
        const fill=inKey ? "var(--green)" : "var(--red)";
        const ink=inKey ? "#07101a" : "#fff";
        chordMarks+=`<div class="gm-exact-mark" data-marker="1" data-string="${stringIndex}" data-fret="${fret}" style="left:${stringX(stringIndex)}px;top:${fretCenter(fret)}px;--marker-fill:${fill};--marker-ink:${ink}">${markerLabel(stringIndex,fret,tone)}</div>`;
      }
    }
  }

  const fretboard=document.getElementById("fretboard");
  fretboard.innerHTML=`
    <div class="gm-exact-shell">
      <div class="gm-exact-openrow">${pentOpenDots}${openMarks}</div>
      <div class="gm-exact-nut"></div>
      <div class="gm-exact-board">${inlays}${fretLines}${strings}${pentMarks}${chordMarks}${fretNumbers}${stringNumbers}</div>
      ${state.fretboardMessage ? `<div class="fretboard-message">${state.fretboardMessage}</div>` : ""}
    </div>`;
  fretboard.querySelectorAll("[data-marker]").forEach(marker=>{
    marker.addEventListener("click",e=>{
      e.stopPropagation();
      hideGuidance();
      cycleFretboardDisplay();
    });
  });

  // An empty fretboard acts as the tuning entry point.
  fretboard.onclick=e=>{
    if(e.target.closest("[data-marker]")) return;
    if(tuningIsOpenable()) openTuningPopup();
  };
}

/* ================================================================
   8. State-driven control rendering
   Every click changes state once, then calls render(). No observers/timers.
   ================================================================ */

function renderTuningPopup(){
  if(!draftTuning) return;

  const exactPreset=TUNING_PRESETS.findIndex(
    preset=>preset.midi.every((midi,i)=>midi===draftTuning[i])
  );
  const presetList=document.getElementById("tuningPresetList");
  presetList.innerHTML=TUNING_PRESETS.map((preset,index)=>{
    const m=preset.label.match(/^(.+?)\s*(\([^)]*\))$/);
    const main=m ? m[1].trim() : preset.label;
    const detail=m ? m[2] : "";
    return `
      <button type="button"
        class="tuning-preset-item ${index===exactPreset?"active":""}"
        data-tuning-preset="${index}"
        role="option"
        aria-selected="${index===exactPreset}">
        <span class="tuning-preset-main">${main}</span>
        ${detail ? `<span class="tuning-preset-detail">${detail}</span>` : ""}
      </button>`;
  }).join("");

  presetList.querySelectorAll("[data-tuning-preset]").forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const preset=TUNING_PRESETS[Number(btn.dataset.tuningPreset)];
      if(!preset) return;
      draftTuning=[...preset.midi];
      renderTuningPopup();
    };
  });

  const columns=document.getElementById("tunerColumns");
  columns.innerHTML=draftTuning.map((midi,i)=>{
    return `
      <div class="tuner-column">
        <button type="button" data-tune-down="${i}" ${canLowerDraftString(i)?"":"disabled"} aria-label="Lower string ${i+1}">−</button>
        <div class="tuner-note">${tuningNoteName(midi)}</div>
        <button type="button" data-tune-up="${i}" ${canRaiseDraftString(i)?"":"disabled"} aria-label="Raise string ${i+1}">+</button>
      </div>`;
  }).join("");

  columns.querySelectorAll("[data-tune-up]").forEach(btn=>{
    btn.onclick=()=>{
      const i=Number(btn.dataset.tuneUp);
      if(canRaiseDraftString(i)){
        draftTuning[i]+=1;
        renderTuningPopup();
      }
    };
  });
  columns.querySelectorAll("[data-tune-down]").forEach(btn=>{
    btn.onclick=()=>{
      const i=Number(btn.dataset.tuneDown);
      if(canLowerDraftString(i)){
        draftTuning[i]-=1;
        renderTuningPopup();
      }
    };
  });
}

function openTuningPopup(){
  if(!tuningIsOpenable()) return;
  hideGuidance();
  draftTuning=[...state.tuning];
  renderTuningPopup();

  const overlay=document.getElementById("tuningOverlay");

function saveTuning(){
  if(!draftTuning) return;

  renderFretboard();

function resetApp(){
  state.root=null;
  state.identity=null;
  state.tones=[];
  state.locked=[];
  state.panel="root";
  state.builderMode="manual";
  state.progressionView=false;
  state.progressionEditIndex=-1;
  state.progressionEditOriginal=null;
  state.infoMode=false;
  state.guidanceRootPc=null;
  state.tuning=[...STANDARD_TUNING];
  state.keyPc=0;
  state.keyTonicPc=0;
  state.keyLetter="C";
  state.keyAccidental="";
  state.keyQuality="Major";
  state.modeIndex=0;
  state.pentMode="off";
  state.fretboardDisplayMode="chord";
  closeKeyPopup();
  closeTuningPopup();
  hideLeadingChordPopup();
  render();
}

function selectRoot(root){
  hideGuidance();
  const rootPc=ROOT_PC[root];
  const sameRoot=state.root===root;

  if(state.builderMode==="diatonic"){
    const triad=preferredTriadForPc(rootPc);
    const identity=triad ? identityByLabel(triad.identity) : null;
    if(!identity) return;

    if(sameRoot && state.panel==="root"){
      // Second tap confirms the preview and moves to HARMONY.
      // The triad-selected quality arrives already highlighted there.
      state.panel="identity";
      render();
      return;
    }

    // First tap previews/selects the suggested triad and remains here.
    state.root=root;
    state.identity=identity;
    state.tones=[...identity.base];
    state.locked=[...identity.locked];
    state.panel="root";
    /* preserve user-selected fretboardDisplayMode */;
    if(state.pentMode==="chord") state.pentMode="key";
    render();
    return;
  }

  // Root starting point uses the same first-tap / second-tap grammar.
  if(sameRoot && state.panel==="root"){
    // During progression editing, the existing harmony is deliberately
    // retained and therefore arrives highlighted in HARMONY.
    state.panel="identity";
    render();
    return;
  }

  // First tap selects/previews the root and stays on ROOT.
  state.root=root;

  if(state.progressionEditIndex<0){
    state.identity=null;
    state.tones=["1"];
    state.locked=["1"];
  }else if(!state.identity){
    state.tones=["1"];
    state.locked=["1"];
  }

  state.panel="root";
  /* preserve user-selected fretboardDisplayMode */;
  if(state.pentMode==="chord") state.pentMode="key";
  render();
}
function selectIdentity(identity){
  if(state.identity===identity && state.panel==="identity"){
    // Second tap, or first deliberate tap on a harmony inherited from Triad,
    // confirms the highlighted choice and advances to EXT / ALT.
    state.panel="tones";
    render();
    return;
  }

  // First tap selects/previews the harmony and remains in HARMONY.
  state.identity=identity;
  state.tones=[...identity.base];
  state.locked=[...identity.locked];
  state.panel="identity";

  if(state.pentMode==="chord" && !["Major","Minor"].includes(identity.label)){
    state.pentMode="key";
  }
  render();
}
let fretboardMessageTimer=null;
function showTemporaryFretboardMessage(message){
  state.fretboardMessage=message;
  renderFretboard();
  if(fretboardMessageTimer) clearTimeout(fretboardMessageTimer);
  fretboardMessageTimer=setTimeout(()=>{
    state.fretboardMessage=null;
    renderFretboard();
  },3000);
}
function cyclePentMode(){
  if(state.pentMode==="off"){
    state.pentMode="key";
    render();
    return;
  }
  if(state.pentMode==="key"){
    if(!chordPentatonicSet()){
      state.pentMode="off";
      render();
      showTemporaryFretboardMessage("No major or minor chord has been defined");
      return;
    }
    state.pentMode="chord";
    render();
    return;
  }
  state.pentMode="off";
  render();
}
function showPanel(panel){
  state.panel=panel;
  render();
}
function toggleTone(tone){
  // EXT/ALT is true multi-select: each button toggles independently.
  if(!state.identity) return;
  if(state.tones.includes(tone)){
    state.tones=state.tones.filter(t=>t!==tone);
  }else{
    state.tones.push(tone);
  }
  state.tones=orderedUnique(state.tones);
  render();
}


const KEY_LETTERS=["C","D","E","F","G","A","B"];
const KEY_ACCIDENTALS=[
  {label:"♯",value:"♯"},
  {label:"♭",value:"♭"}
];
const KEY_QUALITIES=["Major","Minor"];

function ionianAeolianLabel(){
  const ionianPc=state.keyPc;
  const aeolianPc=mod12(state.keyPc+9);
  const ionianName=noteNameForCurrentKey(ionianPc);
  const aeolianName=noteNameForCurrentKey(aeolianPc);
  return `${ionianName} / ${aeolianName}m`;
}

function renderKeyPopup(){
  document.getElementById("keyPopupTitle").textContent=ionianAeolianLabel();

  document.getElementById("keyLetterGrid").innerHTML=KEY_LETTERS.map(letter=>
    `<button type="button" data-key-letter="${letter}" class="${state.keyLetter===letter?"choice-active":""}">${letter}</button>`
  ).join("");

  document.getElementById("keyAccidentalGrid").innerHTML=KEY_ACCIDENTALS.map(acc=>
    `<button type="button" data-key-acc="${acc.value}" class="${state.keyAccidental===acc.value?"choice-active":""}">${acc.label}</button>`
  ).join("");

  document.getElementById("keyQualityGrid").innerHTML=KEY_QUALITIES.map(q=>
    `<button type="button" data-key-quality="${q}" class="${state.keyQuality===q?"choice-active":""}">${q}</button>`
  ).join("");

  document.querySelectorAll("[data-key-letter]").forEach(btn=>{
    btn.onclick=()=>{state.keyLetter=btn.dataset.keyLetter;applyKeyPopupChoice();};
  });
  document.querySelectorAll("[data-key-acc]").forEach(btn=>{
    btn.onclick=()=>{
      const chosen=btn.dataset.keyAcc;
      state.keyAccidental=state.keyAccidental===chosen ? "" : chosen;
      applyKeyPopupChoice();
    };
  });
  document.querySelectorAll("[data-key-quality]").forEach(btn=>{
    btn.onclick=()=>{state.keyQuality=btn.dataset.keyQuality;applyKeyPopupChoice();};
  });
}

function applyKeyPopupChoice(){
  // Changing key starts a new harmonic context. Preserve the prior
  // progression position only as an insertion anchor, not as an active chord.
  if(state.progressionSelected>=0 && state.progressionSelected<state.progression.length){
    state.progressionInsertionAnchor=state.progressionSelected;
  }
  state.progressionSelected=-1;

  state.keyTonicPc=keyPcFromParts(state.keyLetter,state.keyAccidental);

  // Major uses its own major collection. Minor uses its relative-major collection.
  if(state.keyQuality==="Minor"){
    state.modeIndex=5; // 6 - Aeolian
    state.keyPc=mod12(state.keyTonicPc+3);
  }else{
    state.keyPc=state.keyTonicPc;
    if(state.modeIndex===5) state.modeIndex=0;
  }

  respellSelectedRoot();
  render();
  renderChordContextKey();
  if(state.progressionView) renderProgressionView();
  renderKeyPopup();
}

function openKeyPopup(){
  const overlay=document.getElementById("keyPopupOverlay");
  renderKeyPopup();
  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden","false");
}
function closeKeyPopup(){
  const overlay=document.getElementById("keyPopupOverlay");
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
}

   5. CHORD BUILDER CONTROLS
   ================================================================ */
function renderControls(){
  document.querySelector(".controls")?.classList.toggle(
    "progression-edit-active",
    state.progressionEditIndex>=0 && !state.progressionView
  );
  const keyButton=document.getElementById("keyButton");
  keyButton.textContent=keyDisplayName();
  keyButton.setAttribute(
    "aria-label",
    `Key: ${state.keyLetter}${state.keyAccidental} ${state.keyQuality}`
  );
  keyButton.onclick=openKeyPopup;

  const modeSelect=document.getElementById("modeSelect");
  modeSelect.innerHTML=MODE_OPTIONS.map((mode,index)=>`<option value="${index}" ${state.modeIndex===index?"selected":""}>${mode.number} - ${mode.name}</option>`).join("");
  document.getElementById("modeNumberDisplay").textContent=String(currentMode().number);
  modeSelect.setAttribute("aria-label",`Mode: ${currentMode().number} - ${currentMode().name}`);
  modeSelect.onchange=()=>{
    const oldModeIndex=state.modeIndex;
    const tonic=modeTonicPc(state.keyPc,oldModeIndex);
    const nextModeIndex=Number(modeSelect.value);
    const nextMode=MODE_OPTIONS[nextModeIndex] || MODE_OPTIONS[0];

    // Preserve the modal tonic, but move the displayed parent-major key.
    // Example: C Ionian -> C Aeolian requires E♭ major, so the Key button becomes E♭.
    state.modeIndex=nextModeIndex;
    state.keyPc=mod12(tonic-nextMode.degreeOffset);

    // Mode changes continue the established behavior: Key displays the
    // parent major, using conventional key spelling (e.g. B♭ rather than A♯).
    setParentMajorSpellingFromPc();
    respellSelectedRoot();

    document.getElementById("modeNumberDisplay").textContent=String(currentMode().number);
    modeSelect.setAttribute("aria-label",`Mode: ${currentMode().number} - ${currentMode().name}`);

    render();
  };

  const pentButton=document.getElementById("pentButton");
  pentButton.classList.remove("key-on","chord-on");
  if(state.pentMode==="off"){
    pentButton.textContent="Off";
    pentButton.setAttribute("aria-label","Pentatonic: Off");
  }else if(state.pentMode==="key"){
    const keyLabel=noteNameForPc(state.keyTonicPc);
    pentButton.textContent=keyLabel;
    pentButton.setAttribute("aria-label",`Pentatonic: ${keyLabel} major key`);
    pentButton.classList.add("key-on");
  }else{
    const chordLabel=chordPentatonicLabel() || "Chord";
    pentButton.textContent=chordLabel;
    pentButton.setAttribute("aria-label",`Pentatonic: ${chordLabel} chord`);
    pentButton.classList.add("chord-on");
  }
  pentButton.onclick=cyclePentMode;

  const tonicPc=modalTonicPc();
  const rootButtonOrder=Array.from({length:12},(_,i)=>mod12(tonicPc+i));

  document.getElementById("rootGrid").innerHTML=rootButtonOrder.map(pc=>{
    const root=noteNameForCurrentKey(pc);
    const guide=guideClassForPc(pc);
    const selected=(state.root && ROOT_PC[state.root]===pc);
    const guidanceActive=(state.guidanceRootPc===pc);
    const active=selected ? "active " : "";
    const popupActive=guidanceActive ? "guidance-active " : "";
    const rest=isRestEmphasisPc(pc) ? "rest-emphasis " : "";

    let chordLabel=root;
    let rn=chromaticRomanNumeralForPc(pc);

    if(state.builderMode==="diatonic"){
      const triad=preferredTriadForPc(pc);
      if(triad){
        chordLabel=root+triad.suffix;
        rn=triadRomanNumeralForPc(pc,triad);
      }
    }

    const label=`<span class="root-button-label"><span class="root-button-name">${chordLabel}</span><span class="root-button-rn">${rn}</span></span>`;
    return `<button type="button" data-root="${root}" class="${active}${popupActive}${rest}${guide}">${label}</button>`;
  }).join("");

  document.getElementById("identityGrid").innerHTML=IDENTITIES.map((id,index)=>{
    const guide=identityGuideClass(id);
    const active=state.identity===id?"active ":"";
    const dots=harmonyGuideDots(id);
    return `<button type="button" data-identity="${index}" class="${active}${guide}" ${state.root?"":"disabled"}><span>${id.label}</span>${dots}</button>`;
  }).join("");

  const available=orderedUnique([...(state.identity?state.identity.locked:[]),...EDITABLE_TONES]);
  document.getElementById("toneGrid").innerHTML=available.map(tone=>{
    const selected=state.tones.includes(tone);
    const guide=toneGuideClass(tone);
    return `<button type="button" data-tone="${tone}" class="${selected?"active ":""}${guide}" ${state.identity?"":"disabled"}>${tone}</button>`;
  }).join("");

  renderBuilderStartToggle();

  const voicingWorkspace=!!state.voicingWorkspace;
  document.getElementById("rootPanel").classList.toggle("active-panel",!voicingWorkspace && !state.progressionView && state.panel==="root");
  document.getElementById("identityPanel").classList.toggle("active-panel",!voicingWorkspace && !state.progressionView && state.panel==="identity");
  document.getElementById("tonePanel").classList.toggle("active-panel",!voicingWorkspace && !state.progressionView && state.panel==="tones");
  document.getElementById("progressionViewPanel").classList.toggle("active-panel",!voicingWorkspace && state.progressionView);
  document.getElementById("voicingWorkspacePanel").classList.toggle("active-panel",voicingWorkspace);
  document.querySelector(".controls")?.classList.toggle("voicing-workspace-active",voicingWorkspace);
  document.body.classList.toggle("voicing-workspace-active",voicingWorkspace);
  renderProgressionView();

  document.querySelectorAll("[data-root]").forEach(btn=>{
    btn.onclick=()=>selectRoot(btn.dataset.root);
    btn.oncontextmenu=e=>e.preventDefault();
  });

  document.querySelectorAll("[data-identity]").forEach(btn=>{
    btn.onclick=()=>selectIdentity(IDENTITIES[Number(btn.dataset.identity)]);
  });

  document.querySelectorAll("[data-tone]").forEach(btn=>{
    btn.onclick=()=>toggleTone(btn.dataset.tone);
    btn.oncontextmenu=e=>e.preventDefault();
  });

  document.getElementById("backToRoot").onclick=()=>{
    showPanel("root");
  };

  document.getElementById("backToIdentity").onclick=()=>{
    if(state.progressionEditIndex>=0){
      showPanel("identity");
    }else{
      showPanel(state.builderMode==="diatonic" ? "root" : "identity");
    }
  };
  const builderStartToggle=document.getElementById("builderStartToggle");
  if(builderStartToggle) builderStartToggle.onclick=toggleBuilderMode;

  const editRootBack=document.getElementById("backFromProgressionEditRoot");
  if(editRootBack){
    editRootBack.onclick=()=>{
      if(state.progressionEditIndex>=0) cancelProgressionChordEdit();
    };
  }
  document.getElementById("backFromProgressionView").onclick=()=>{
    const index=state.progressionSelected;
    if(index>=0 && index<state.progression.length){
      beginProgressionChordEdit(index);
    }
  };

  document.querySelectorAll("[data-display-mode]").forEach(btn=>{
    btn.onclick=()=>setFretboardDisplay(btn.dataset.displayMode);
  });
  renderFretboardDisplaySwitch();
}

  {group:"Major · Modal Mixture",mode:"major",rn:["I","vi","♭VI","V"],comment:"Chromatic descent from vi to borrowed ♭VI before the dominant; highly effective in ballads."},
  {group:"Major · Modal Mixture",mode:"major",rn:["I","♭III","IV","I"],comment:"Borrowed ♭III adds a blues/rock color while IV keeps the return to I clear."},
  {group:"Major · Modal Mixture",mode:"major",rn:["I","♭VII","♭VI","♭VII"],comment:"A modal loop built from borrowed major chords; strong without relying on a conventional dominant."},

  {group:"Minor",mode:"minor",rn:["i","VI","III","VII"],comment:"The minor-key counterpart of the familiar four-chord pop loop, centered explicitly on i."},
  {group:"Minor",mode:"minor",rn:["i","VII","VI","VII"],comment:"A dark modal loop with repeated VII motion framing the minor tonic."},
  {group:"Minor",mode:"minor",rn:["i","iv","V","i"],comment:"The essential minor cadence; major V introduces the harmonic-minor leading tone before i."},
  {group:"Minor",mode:"minor",rn:["i","VI","iv","V"],comment:"A broad minor progression that moves from relative-major color through iv to a strong dominant."},
  {group:"Minor",mode:"minor",rn:["i","III","VII","iv"],comment:"Minor tonic opens into its relative-major region, then circles back through VII and iv."}
];

const TEMPLATE_MAJOR_DEGREES=[0,2,4,5,7,9,11];
const TEMPLATE_MINOR_DEGREES=[0,2,3,5,7,8,10];
const TEMPLATE_ROMAN_INDEX={I:0,II:1,III:2,IV:3,V:4,VI:5,VII:6};

function templateTonicPc(mode,ctx=currentChordKeyContext()){
  // Major templates use the active parent-major key.
  // Minor templates use the active minor tonic when the selected key is
  // minor, otherwise the relative minor of the active major key.
  if(mode==="minor"){
    return ctx.keyQuality==="Minor"
      ? ctx.keyTonicPc
      : mod12(ctx.keyPc+9);
  }
  return ctx.keyPc;
}

function templateDegreePc(token,mode,ctx=currentChordKeyContext()){
  let raw=String(token).trim();

  // Secondary dominant: V/x.
  if(raw.includes("/")){
    const [,targetToken]=raw.split("/");
    const targetPc=templateDegreePc(targetToken,mode,ctx);
    return mod12(targetPc+7);
  }

  let accidental=0;
  while(raw.startsWith("♭") || raw.startsWith("b") || raw.startsWith("#") || raw.startsWith("♯")){
    const ch=raw[0];
    accidental += (ch==="♭" || ch==="b") ? -1 : 1;
    raw=raw.slice(1);
  }

  raw=raw.replace("°","");
  const roman=(raw.match(/[ivIV]+/) || ["I"])[0].toUpperCase();
  const degreeIndex=TEMPLATE_ROMAN_INDEX[roman] ?? 0;
  const offsets=mode==="minor" ? TEMPLATE_MINOR_DEGREES : TEMPLATE_MAJOR_DEGREES;
  return mod12(templateTonicPc(mode,ctx)+offsets[degreeIndex]+accidental);
}

function templateChordQuality(token){
  const raw=String(token).trim();

  if(raw.includes("ø7")) return "HalfDiminished7";
  if(raw.includes("°7")) return "Diminished7";
  if(/\(maj7\)/i.test(raw)){
    const roman=(raw.match(/[ivIV]+/) || ["I"])[0];
    return roman===roman.toLowerCase() ? "MinorMajor7" : "Major7";
  }
  if(/maj7/i.test(raw)) return "Major7";

  if(/6\/9/.test(raw)){
    const roman=(raw.match(/[ivIV]+/) || ["I"])[0];
    return roman===roman.toLowerCase() ? "Minor69" : "Major69";
  }

  if(/13/.test(raw)) return "Dominant13";
  if(/11/.test(raw)) return "Dominant11";
  if(/9/.test(raw) && !/[♭b#♯]9/.test(raw)) return "Dominant9";

  if(/6/.test(raw) && !/\/6/.test(raw)){
    const roman=(raw.match(/[ivIV]+/) || ["I"])[0];
    return roman===roman.toLowerCase() ? "Minor6" : "Major6";
  }

  if(/7/.test(raw)){
    if(raw.includes("/")) return "Dominant7";
    const roman=(raw.match(/[ivIV]+/) || ["I"])[0];
    return roman===roman.toUpperCase() ? "Dominant7" : "Minor7";
  }

  if(raw.includes("/")) return "Major";
  if(raw.includes("°")) return "Diminished";

  const roman=(raw.match(/[ivIV]+/) || ["I"])[0];
  return roman===roman.toLowerCase() ? "Minor" : "Major";
}

function templateChordAlterations(token){
  const raw=String(token).trim();
  const inside=(raw.match(/\(([^)]*)\)/) || [,""])[1]
    .replaceAll("b","♭")
    .replaceAll("#","♯")
    .replace(/\s+/g,"")
    .replaceAll(",","");

  const found=[];
  const ordered=[
    ["♭9","♭9"],
    ["♯9","#9"],
    ["#9","#9"],
    ["♯11","#11"],
    ["#11","#11"],
    ["♭13","♭13"]
  ];

  for(const [needle,label] of ordered){
    if(inside.includes(needle) && !found.includes(label)) found.push(label);
  }
  return found;
}

function templateChordTones(quality,token){
  if(quality==="Major7"){
    return {tones:["1","3","5","7"],locked:["1","3","7"]};
  }
  if(quality==="MinorMajor7"){
    return {tones:["1","♭3","5","7"],locked:["1","♭3","7"]};
  }
  if(quality==="Major6"){
    return {tones:["1","3","5","6"],locked:["1","3","6"]};
  }
  if(quality==="Minor6"){
    return {tones:["1","♭3","5","6"],locked:["1","♭3","6"]};
  }
  if(quality==="Major69"){
    return {tones:["1","3","5","6","9"],locked:["1","3","6","9"]};
  }
  if(quality==="Minor69"){
    return {tones:["1","♭3","5","6","9"],locked:["1","♭3","6","9"]};
  }
  if(quality==="Dominant9"){
    return {tones:["1","3","5","♭7","9"],locked:["1","3","♭7","9"]};
  }
  if(quality==="Dominant11"){
    return {tones:["1","3","5","♭7","9","11"],locked:["1","3","♭7","11"]};
  }
  if(quality==="Dominant13"){
    return {tones:["1","3","5","♭7","9","13"],locked:["1","3","♭7","13"]};
  }
  if(quality==="Dominant7"){
    const alterations=templateChordAlterations(token);
    const tones=["1","3","5","♭7",...alterations];
    const locked=["1","3","♭7",...alterations];
    return {tones,locked};
  }
  if(quality==="Minor7"){
    return {tones:["1","♭3","5","♭7"],locked:["1","♭3","♭7"]};
  }
  if(quality==="HalfDiminished7"){
    return {tones:["1","♭3","♭5","♭7"],locked:["1","♭3","♭5","♭7"]};
  }
  if(quality==="Diminished7"){
    return {tones:["1","♭3","♭5","6"],locked:["1","♭3","♭5","6"]};
  }
  if(quality==="Minor"){
    return {tones:["1","♭3","5"],locked:["1","♭3"]};
  }
  if(quality==="Diminished"){
    return {tones:["1","♭3","♭5"],locked:["1","♭3","♭5"]};
  }
  return {tones:["1","3","5"],locked:["1","3"]};
}

function templateDisplaySuffix(token,quality){
  const raw=String(token).trim();

  if(quality==="Major7") return "maj7";
  if(quality==="MinorMajor7") return "m(maj7)";
  if(quality==="Major6") return "6";
  if(quality==="Minor6") return "m6";
  if(quality==="Major69") return "6/9";
  if(quality==="Minor69") return "m6/9";
  if(quality==="Dominant9") return "9";
  if(quality==="Dominant11") return "11";
  if(quality==="Dominant13") return "13";
  if(quality==="Dominant7"){
    const alterations=templateChordAlterations(raw);
    if(alterations.length){
      return `7(${alterations.join(",")})`;
    }
    return "7";
  }
  if(quality==="Minor7") return "m7";
  if(quality==="HalfDiminished7") return "m7♭5";
  if(quality==="Diminished7") return "°7";
  if(quality==="Minor") return "m";
  if(quality==="Diminished") return "°";
  return "";
}

function templateEntryFromRoman(token,mode,ctx=currentChordKeyContext()){
  const rootPc=templateDegreePc(token,mode,ctx);
  const root=noteNameForCurrentKey(rootPc);
  const quality=templateChordQuality(token);

  const identityLabel=
    ["Major7","Major6","Major69","Dominant7","Dominant9","Dominant11","Dominant13"].includes(quality) ? "Major" :
    ["Minor7","MinorMajor7","Minor6","Minor69","HalfDiminished7"].includes(quality) ? "Minor" :
    quality==="Diminished7" ? "Diminished" :
    quality;

  const identity=IDENTITIES.find(item=>item.label===identityLabel) || IDENTITIES[0];
  const chordTones=templateChordTones(quality,token);
  const name=root+templateDisplaySuffix(token,quality);

  return {
    name,
    root,
    identityLabel:identity.label,
    tones:[...chordTones.tones],
    locked:[...chordTones.locked],
    beats:4,
    tuning:[...state.tuning],
    builderMode:"manual",
    keyPc:ctx.keyPc,
    keyTonicPc:ctx.keyTonicPc,
    keyLetter:ctx.keyLetter,
    keyAccidental:ctx.keyAccidental,
    keyQuality:ctx.keyQuality,
    modeIndex:ctx.modeIndex,
    keyContext:{...ctx},
    fretboardDisplayMode:state.fretboardDisplayMode
  };
}


function progressionTemplateDisplayChordName(token,template){
  const ctx=currentChordKeyContext();
  const rootPc=templateDegreePc(token,template.mode,ctx);
  const root=noteNameForCurrentKey(rootPc);
  const quality=templateChordQuality(token);
  return root+templateDisplaySuffix(token,quality);
}

function progressionTemplateDisplaySequence(template){
  if(progressionTemplateDisplayMode==="letters"){
    return template.rn
      .map(token=>progressionTemplateDisplayChordName(token,template))
      .join(" – ");
  }
  return progressionTemplateDisplayRoman(template);
}

function updateProgressionTemplateDisplayToggle(){
  const toggle=document.getElementById("progressionTemplateDisplayToggle");
  const romanLabel=document.getElementById("progressionTemplateRomanLabel");
  const letterLabel=document.getElementById("progressionTemplateLetterLabel");
  if(!toggle || !romanLabel || !letterLabel) return;

  const ctx=currentChordKeyContext();
  const tonicPc=ctx.keyQuality==="Minor" ? ctx.keyTonicPc : ctx.keyPc;
  let tonicName=noteNameForCurrentKey(tonicPc);
  if(ctx.keyQuality==="Minor") tonicName += "m";

  romanLabel.textContent=ctx.keyQuality==="Minor" ? "i" : "I";
  letterLabel.textContent=tonicName;

  const isLetters=progressionTemplateDisplayMode==="letters";
  toggle.classList.toggle("letter-mode",isLetters);
  toggle.setAttribute("aria-pressed",isLetters?"true":"false");
  romanLabel.classList.toggle("active",!isLetters);
  letterLabel.classList.toggle("active",isLetters);
}

function progressionTemplateDisplayRoman(template){
  return template.rn.join(" – ");
}

function renderProgressionTemplateList(){
  const list=document.getElementById("progressionTemplateList");
  if(!list) return;


  let lastGroup="";
  let html="";
  PROGRESSION_TEMPLATES.forEach((template,index)=>{
    if(template.group!==lastGroup){
      lastGroup=template.group;
      html+=`<div class="progression-template-group">${progressionEscapeHtml(lastGroup)}</div>`;
    }
    html+=`
      <button type="button" class="progression-template-item" data-template-index="${index}">
        <span class="progression-template-rn">${progressionEscapeHtml(progressionTemplateDisplaySequence(template))}</span>
        <span class="progression-template-comment">${progressionEscapeHtml(template.comment)}</span>
      </button>`;
  });
  list.innerHTML=html;
  updateProgressionTemplateDisplayToggle();

  list.querySelectorAll("[data-template-index]").forEach(button=>{
    button.onclick=()=>{
      const index=Number(button.dataset.templateIndex);
      const template=PROGRESSION_TEMPLATES[index];
      if(!template) return;
      applyProgressionTemplate(template);
    };
  });
}

function openProgressionTemplateOverlay(){
  if(!state.progressionView || state.voicingWorkspace) return;
  renderProgressionTemplateList();
  const overlay=document.getElementById("progressionTemplateOverlay");
  overlay?.classList.add("show");
  overlay?.setAttribute("aria-hidden","false");
}

function closeProgressionTemplateOverlay(){
  const overlay=document.getElementById("progressionTemplateOverlay");
  overlay?.classList.remove("show");
  overlay?.setAttribute("aria-hidden","true");
}

function applyProgressionTemplate(template){
  const templateContext=currentChordKeyContext();
  const incoming=template.rn.map(
    token=>templateEntryFromRoman(token,template.mode,templateContext)
  );
  if(!incoming.length) return;

  // Insert BELOW the selected chord. After a key change there is no
  // selected chord, so use the preserved insertion anchor instead.
  const selectedIsValid=
    state.progressionSelected>=0 &&
    state.progressionSelected<state.progression.length;
  const anchorIsValid=
    state.progressionInsertionAnchor>=0 &&
    state.progressionInsertionAnchor<state.progression.length;

  const insertionBase=selectedIsValid
    ? state.progressionSelected
    : anchorIsValid
      ? state.progressionInsertionAnchor
      : -1;

  const insertAt=insertionBase>=0
    ? Math.min(state.progression.length,insertionBase+1)
    : state.progression.length;

  state.progression.splice(insertAt,0,...incoming);
  state.progressionSelected=insertAt;
  state.progressionInsertionAnchor=-1;

  refreshInternalProgressionClipboard();
  persistProgressionClipboard();
  closeProgressionTemplateOverlay();
  renderProgressionButton();

  // Show the result immediately in the consolidated Progression workspace.
  enterProgressionView(insertAt);
}


/* ================================================================
   6. PROGRESSION DATA & EDITING
   ================================================================ */
function snapshotCurrentChord(){
  if(!state.root || !state.identity) return null;

  return {
    name:chordName(),
    root:state.root,
    identityLabel:state.identity.label,
    tones:[...state.tones],
    locked:[...state.locked],
    beats:4,
    tuning:[...state.tuning],
    builderMode:state.builderMode,
    keyPc:state.keyPc,
    keyTonicPc:state.keyTonicPc,
    keyLetter:state.keyLetter,
    keyAccidental:state.keyAccidental,
    keyQuality:state.keyQuality,
    modeIndex:state.modeIndex,
    keyContext:currentChordKeyContext(),
    fretboardDisplayMode:state.fretboardDisplayMode
  };
}

function cloneProgressionEntry(entry){
  if(!entry) return null;
  return {
    ...entry,
    tones:[...(entry.tones || [])],
    locked:[...(entry.locked || [])],
    tuning:[...(entry.tuning || STANDARD_TUNING)],
    voicing:entry.voicing ? {
      ...entry.voicing,
      frets:[...(entry.voicing.frets || [])]
    } : null,
    keyContext:entry.keyContext ? {...entry.keyContext} : null
  };
}

function beginProgressionChordEdit(index){
  if(state.progressionPlaying) return;
  if(index<0 || index>=state.progression.length) return;

  state.progressionSelected=index;
  state.progressionInsertionAnchor=-1;
  state.progressionEditIndex=index;
  state.progressionEditOriginal=cloneProgressionEntry(state.progression[index]);
  state.progressionView=false;

  // Load the stored chord as a working copy, then begin at ROOT in
  // Guided Manual or TRIAD in Fully Diatonic.
  restoreProgressionChord(state.progression[index],{preservePanel:true,restoreKeyContext:true});
  state.panel="root";
  render();
}

function cancelProgressionChordEdit(){
  if(state.progressionEditIndex<0) return;

  const index=state.progressionEditIndex;
  const original=state.progressionEditOriginal;

  state.progressionEditIndex=-1;
  state.progressionEditOriginal=null;
  state.progressionSelected=index;
  state.progressionView=true;

  if(original){
    restoreProgressionChord(original,{preservePanel:true});
  }else{
    render();
  }
}

function commitProgressionChordEdit(){
  if(state.progressionEditIndex<0) return;

  const index=state.progressionEditIndex;
  const original=state.progressionEditOriginal;
  const edited=snapshotCurrentChord();
  if(!edited) return;

  // Preserve progression timing while replacing the chord construction.
  edited.beats=original?.beats || state.progression[index]?.beats || 4;
  state.progression[index]=edited;

  state.progressionEditIndex=-1;
  state.progressionEditOriginal=null;
  state.progressionSelected=index;
  state.progressionView=false;

  flashSaveConfirmation();
  window.setTimeout(returnToOpeningBuilderScreen,360);
}

function restoreProgressionChord(entry,{preservePanel=false,restoreKeyContext=false}={}){
  if(!entry) return;
  if(restoreKeyContext && entry.keyContext){
    state.keyPc=entry.keyContext.keyPc;
    state.keyTonicPc=entry.keyContext.keyTonicPc;
    state.keyLetter=entry.keyContext.keyLetter;
    state.keyAccidental=entry.keyContext.keyAccidental;
    state.keyQuality=entry.keyContext.keyQuality;
    state.modeIndex=entry.keyContext.modeIndex;
  }

  state.root=entry.root;
  state.identity=identityByLabel(entry.identityLabel);
  state.tones=orderedUnique([...(entry.tones || [])]);
  state.locked=[...(entry.locked || [])];
  state.tuning=[...(entry.tuning || STANDARD_TUNING)];
  state.builderMode=entry.builderMode || "manual";

  state.keyPc=Number.isFinite(entry.keyPc) ? entry.keyPc : state.keyPc;
  state.keyTonicPc=Number.isFinite(entry.keyTonicPc) ? entry.keyTonicPc : state.keyTonicPc;
  state.keyLetter=entry.keyLetter || state.keyLetter;
  state.keyAccidental=entry.keyAccidental ?? state.keyAccidental;
  state.keyQuality=entry.keyQuality || state.keyQuality;
  state.modeIndex=Number.isFinite(entry.modeIndex) ? entry.modeIndex : state.modeIndex;
  // Chord / Letter / Ionian is a global user preference; do not restore it from a chord.

  state.guidanceRootPc=null;
  state.pentMode="off";
  if(!preservePanel) state.panel="tones";
  progressionChordSavedSignature=currentChordSignature();
  progressionChordDirty=false;
  render();
}

function progressionEntryDisplay(entry){
  const extra=Math.max(0,(entry.beats || 1)-1);
  return `${entry.name}${extra ? " " + Array(extra).fill("/").join(" ") : ""}`;
}

function progressionVoicingDisplay(entry){
  if(!entry?.voicing || !Array.isArray(entry.voicing.frets) || entry.voicing.frets.length!==6) return "";
  return entry.voicing.frets.map(fret=>fret===null || fret===undefined ? "×" : String(fret)).join(" ");
}

function progressionPopupEntryHtml(entry){
  const main=progressionEscapeHtml(progressionEntryDisplay(entry));
  const voicing=progressionVoicingDisplay(entry);
  return `<span class="progression-entry-main">${main}</span>${voicing ? `<span class="progression-entry-voicing">${progressionEscapeHtml(voicing)}</span>` : ""}`;
}

function progressionEscapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function progressionButtonDisplay(){
  return "Progression";
}


function ensureProgressionKeyContexts(){
  state.progression.forEach(entry=>{
    if(entry.keyContext) return;
    entry.keyContext={
      keyPc:entry.keyPc ?? state.keyPc,
      keyTonicPc:entry.keyTonicPc ?? state.keyTonicPc,
      keyLetter:entry.keyLetter ?? state.keyLetter,
      keyAccidental:entry.keyAccidental ?? state.keyAccidental,
      keyQuality:entry.keyQuality ?? "Major",
      modeIndex:entry.modeIndex ?? 0,
      parentMajorPc:entry.keyPc ?? state.keyPc,
      localTonicPc:entry.keyTonicPc ?? state.keyTonicPc
    };
  });
}

function selectedProgressionEntry(){
  if(state.progressionSelected<0 || state.progressionSelected>=state.progression.length) return null;
  return state.progression[state.progressionSelected];
}

function renderProgressionButton(){
  const btn=document.getElementById("progressionButton");
  const newBtn=document.getElementById("progressionNewCurrent");
  const save=document.getElementById("progressionSaveCurrent");
  if(!btn) return;

  const hasProgression=state.progression.length>0;
  const hasCurrent=!!(state.root && state.identity);
  const canWork=!state.progressionView && !state.voicingWorkspace && !state.progressionPlaying;

  btn.textContent="Progression";
  const hideProgressionButton=(state.panel!=="root");
  btn.style.display=hideProgressionButton ? "none" : "";
  btn.disabled=false; // Empty Progression is still a valid workspace.
  btn.classList.toggle("has-progression",hasProgression);
  btn.classList.toggle("has-content",hasProgression);
  btn.classList.toggle("next-relevant",hasProgression && !progressionChordDirty && canWork);
  btn.classList.toggle("is-open",state.progressionView);

  if(newBtn){
    newBtn.disabled=!canWork;
    newBtn.classList.toggle("next-relevant",hasCurrent && !progressionChordDirty && canWork);
  }
  if(save){
    const needsSave=hasCurrent && progressionChordDirty && canWork;
    save.disabled=!needsSave;
    save.textContent="Save";
    save.classList.toggle("next-relevant",needsSave);
    save.classList.toggle("saved-state",hasCurrent && !progressionChordDirty && canWork);
  }
}

function updateProgressionPopupFades(){
  const popup=document.getElementById("progressionPopup");
  const list=document.getElementById("progressionList");
  if(!popup || !list) return;

  if(!popup.classList.contains("scrollable-list")){
    popup.classList.remove("has-more-above","has-more-below");
    return;
  }

  const tolerance=2;
  popup.classList.toggle("has-more-above",list.scrollTop>tolerance);
  popup.classList.toggle(
    "has-more-below",
    (list.scrollHeight-list.clientHeight-list.scrollTop)>tolerance
  );
}

function renderProgressionPopup(){
  const list=document.getElementById("progressionList");
  const popup=document.getElementById("progressionPopup");
  if(!list || !popup) return;

  popup.classList.toggle("scrollable-list",state.progression.length>6);

  if(!state.progression.length){
    list.innerHTML=`<div class="progression-empty">No chords yet</div>`;
  }else if(state.progressionToggle){
    list.innerHTML=`
      <div class="progression-text-sequence">
        ${state.progression.map(entry=>`${progressionEscapeHtml(entry.name)} |`).join(" ")}
      </div>
    `;
  }else{
    list.innerHTML=state.progression.map((entry,index)=>`
      <button type="button"
              class="progression-entry ${index===state.progressionSelected?"selected":""}"
              data-progression-index="${index}">
        ${progressionPopupEntryHtml(entry)}
      </button>
    `).join("");

    list.querySelectorAll("[data-progression-index]").forEach(btn=>{
      let pressTimer=null;
      let longPressFired=false;
      let startX=0;
      let startY=0;

      const cancelPress=()=>{
        if(pressTimer){
          clearTimeout(pressTimer);
          pressTimer=null;
        }
      };

      btn.onpointerdown=e=>{
        if(state.progressionPlaying || e.isPrimary===false) return;
        longPressFired=false;
        startX=e.clientX;
        startY=e.clientY;
        cancelPress();
        pressTimer=setTimeout(()=>{
          pressTimer=null;
          longPressFired=true;
          const index=Number(btn.dataset.progressionIndex);
          state.progressionSelected=index;
          state.progressionDeleteConfirm=false;
          renderProgressionPopup();

          // Long press now goes directly to Voicing. The old Edit/Voicing
          // action overlay was retired; Edit is handled by the Progression
          // back-arrow workflow.
          progressionActionSource="popup";
          openVoicingSelectorForProgression(index);
        },500);
      };

      btn.onpointermove=e=>{
        if(Math.hypot(e.clientX-startX,e.clientY-startY)>10) cancelPress();
      };

      btn.onpointerup=e=>{
        const wasLong=longPressFired;
        cancelPress();
        if(wasLong){
          e.preventDefault();
          e.stopImmediatePropagation();
          longPressFired=false;
          return;
        }
        if(state.progressionPlaying) return;
        const index=Number(btn.dataset.progressionIndex);
        state.progressionSelected=index;
        state.progressionInsertionAnchor=-1;
        state.progressionDeleteConfirm=false;
        renderProgressionPopup();
      };

      btn.onpointercancel=()=>{
        cancelPress();
        longPressFired=false;
      };

      btn.onclick=e=>e.preventDefault();
      btn.oncontextmenu=e=>e.preventDefault();
    });
  }

  list.onscroll=updateProgressionPopupFades;

  requestAnimationFrame(()=>{
    if(state.progression.length>6 && state.progressionSelected>=0){
      const selectedNode=list.querySelector(`[data-progression-index="${state.progressionSelected}"]`);
      if(selectedNode) selectedNode.scrollIntoView({block:"nearest"});
    }
    updateProgressionPopupFades();
  });

  const selected=!!selectedProgressionEntry();
  const hasCurrent=!!(state.root && state.identity);
  const hasProgression=state.progression.length>0;

  document.getElementById("progressionAdd").disabled=!hasCurrent;
  document.getElementById("progressionPlay").disabled=!hasProgression;
  document.getElementById("progressionView").disabled=!selected;
  document.getElementById("progressionBeatMinus").disabled=!selected;
  document.getElementById("progressionBeatPlus").disabled=!selected;
  document.getElementById("progressionReplace").disabled=!(selected && hasCurrent);
  document.getElementById("progressionInsert").disabled=!(selected && hasCurrent);
  document.getElementById("progressionDelete").disabled=!selected;

  document.getElementById("progressionPlay").textContent=!state.progressionPlaying
    ? "Play"
    : state.progressionPlaybackMode==="play" ? "Hold" : "Stop";
  document.getElementById("progressionPlay").classList.toggle("active",state.progressionPlaying);

  const deleteBtn=document.getElementById("progressionDelete");
  deleteBtn.textContent=state.progressionDeleteConfirm ? "Confirm?" : "Delete";
  deleteBtn.classList.toggle("progression-delete-confirm",state.progressionDeleteConfirm);

  const toggle=document.getElementById("progressionToggle");
  toggle.classList.toggle("active",state.progressionToggle);
  toggle.setAttribute("aria-pressed",state.progressionToggle?"true":"false");
}


function positionProgressionPopupOverFretboard(){
  const popup=document.getElementById("progressionPopup");
  const board=document.querySelector(".gm-exact-wrap");
  if(!popup || !board) return;

  const boardRect=board.getBoundingClientRect();
  const popupWidth=popup.getBoundingClientRect().width || 240;

  // Center the popup on the actual rendered fretboard rather than the viewport.
  let left=boardRect.left+(boardRect.width/2)-(popupWidth/2);

  // Keep a small safety margin if the host webview is unusually narrow.
  const margin=8;
  left=Math.max(margin,Math.min(window.innerWidth-popupWidth-margin,left));

  popup.style.left=`${left}px`;
  popup.style.transform="none";
}

function openProgressionPopup(){
  const overlay=document.getElementById("progressionOverlay");
  if(!overlay) return;
  renderProgressionPopup();
  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden","false");
  document.getElementById("progressionButton").setAttribute("aria-expanded","true");
  renderProgressionButton();
  requestAnimationFrame(positionProgressionPopupOverFretboard);
}

function closeProgressionPopup(){
  const overlay=document.getElementById("progressionOverlay");
  const popup=document.getElementById("progressionPopup");
  if(!overlay) return;

  state.progressionDeleteConfirm=false;

  // Closing the progression editor returns the builder to its top-level
  // orientation without clearing the currently displayed chord/fretboard.
  if(!state.progressionView){
    state.panel="root";
  }

  if(popup) popup.classList.remove("has-more-above","has-more-below");
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
  document.getElementById("progressionButton").setAttribute("aria-expanded","false");

  render();
}

  state.locked=[];

function beginNewProgressionChord(){
  if(state.progressionPlaying) return;

  // Preserve progressionSelected as the insertion point for the eventual Save.
  state.progressionEditIndex=-1;
  state.progressionEditOriginal=null;
  state.progressionView=false;
  state.progressionViewShowAllTones=false;

  state.root=null;
  state.identity=null;
  state.tones=[];
  state.locked=[];
  state.panel="root";

  temporaryVoicingPreviewFrets=null;
  state.pentMode=state.pentMode==="chord" ? "key" : state.pentMode;

async function saveCurrentChordFromBuilder(){
  const current=snapshotCurrentChord();
  if(!current) return;

  // During an active edit, Save means commit the edited chord in place.
  if(state.progressionEditIndex>=0){
    commitProgressionChordEdit();
    return;
  }

  // A selected row in Progression represents the previous chord.
  // New material is inserted BELOW it. With no valid selection, append.
  const selectedIsValid=
    state.progressionSelected>=0 &&
    state.progressionSelected<state.progression.length;
  const anchorIsValid=
    state.progressionInsertionAnchor>=0 &&
    state.progressionInsertionAnchor<state.progression.length;

  const insertionBase=selectedIsValid
    ? state.progressionSelected
    : anchorIsValid
      ? state.progressionInsertionAnchor
      : -1;

  const index=insertionBase>=0
    ? Math.min(state.progression.length,insertionBase+1)
    : state.progression.length;

  state.progression.splice(index,0,current);
  state.progressionSelected=index;
  state.progressionInsertionAnchor=-1;
  state.progressionDeleteConfirm=false;

  refreshInternalProgressionClipboard();
  persistProgressionClipboard();
  progressionChordSavedSignature=currentChordSignature();
  progressionChordDirty=false;

  // Confirm the save, then return to the app's opening chord-builder screen.
  flashSaveConfirmation();
  window.setTimeout(returnToOpeningBuilderScreen,360);
}

async function addCurrentChordToProgression(){

  state.progression.push(entry);

}

  current.beats=beats;
  state.progression[state.progressionSelected]=current;

async function insertCurrentChordAboveSelected(){

  state.progression.splice(index,0,current);

function deleteSelectedProgressionChord(){
  if(!selectedProgressionEntry()) return;

  if(!state.progressionDeleteConfirm){
    state.progressionDeleteConfirm=true;
    renderProgressionView();
    return;
  }

  state.progression.splice(state.progressionSelected,1);
  state.progressionDeleteConfirm=false;

  if(!state.progression.length){
    state.progressionSelected=-1;
    stopProgressionPlayback();
  }else{
    state.progressionSelected=Math.min(state.progressionSelected,state.progression.length-1);
  }

  renderProgressionButton();
  renderProgressionView();
  persistProgressionClipboard();
  if(state.progressionView){
    if(state.progressionSelected>=0) restoreProgressionChord(selectedProgressionEntry(),{preservePanel:true});
    else renderProgressionView();
  }
}

function changeSelectedProgressionBeats(delta){
