<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chord Compass 1.45</title>
<style>
  /* ================================================================
     1. Page shell — intentionally small and independent of Comp-Map
     ================================================================ */
  :root{
    --bg:#070c13;
    --panel:#111a26;
    --panel2:#172232;
    --border:#344152;
    --text:#e9eef7;
    --muted:#aeb9c8;
    --green:#4FA36A;
    --red:#C95C5C;
    --root:var(--green);
    --tone:var(--green);
    --ink:#09111e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0%,#182235 0%,#0b0f17 42%,#05070b 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{padding:12px}
  .app{width:min(100%,760px);margin:0 auto;padding:18px;border:1px solid rgba(180,205,240,.16);border-radius:28px;background:linear-gradient(180deg,rgba(24,32,46,.96),rgba(10,14,22,.98));box-shadow:0 24px 70px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.07)}
  .title{text-align:center;font-size:13px;font-weight:900;letter-spacing:2.2px;color:rgba(235,242,255,.78);margin:0 0 14px}
  .workspace{display:grid;grid-template-columns:minmax(310px,1fr) 223px;gap:20px;align-items:start}

  /* ================================================================
     2. Live chord readout
     ================================================================ */
  .readout{border:1px solid rgba(132,150,174,.30);border-radius:16px;background:rgba(255,255,255,.025);padding:12px;margin-bottom:12px;text-align:center}
  .chord-name{font-size:32px;font-weight:950;line-height:1.05;min-height:34px}
  .family{font-size:12px;font-weight:800;color:var(--muted);min-height:16px;margin-top:3px}
  .tones{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;min-height:28px;margin-top:8px}
  .tone-pill{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:25px;padding:0 7px;border:1px solid rgba(180,198,222,.35);border-radius:999px;font-size:13px;font-weight:900}
  .hint{font-size:11px;line-height:1.25;color:var(--muted);margin-top:7px}


  /* Persistent top control strip: one live key selector + two reserved slots. */
  .top-control-strip{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:5px;
    margin-bottom:12px;
  }
  .top-control-slot{
    min-width:0;
    height:38px;
    position:relative;
  }
  .key-slot,.mode-slot,.pent-slot{padding-top:14px;height:52px}
  .key-label,.mode-label,.pent-label{
    position:absolute;
    top:0;
    left:0;
    right:0;
    text-align:center;
    font-size:10px;
    line-height:1;
    font-weight:900;
    color:var(--muted);
  }
  .key-slot::after{
    content:attr(data-major);
    pointer-events:none;
  }
  .key-select,.mode-select{
    width:100%;
    height:38px;
    appearance:none;
    border:1px solid rgba(132,150,174,.42);
    border-radius:10px;
    background:linear-gradient(180deg,#182436,#090f18);
    color:var(--text);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.32);
    font:850 10px/1 inherit;
    padding:0 16px 0 5px;
    text-align:center;
  }
  .key-select option,.mode-select option{background:#111a26;color:var(--text)}
  .key-major-display,.mode-number-display{
    position:absolute;
    left:1px;
    right:1px;
    top:15px;
    height:36px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    background:linear-gradient(180deg,#182436,#090f18);
    color:var(--text);
    font-size:11px;
    font-weight:900;
  }
  .key-slot:focus-within .key-major-display,
  .mode-slot:focus-within .mode-number-display{display:none}
  .reserved-control{
    width:100%;
    height:38px;
    border:1px solid rgba(132,150,174,.18);
    border-radius:10px;
    background:rgba(255,255,255,.025);
  }

  .pent-button{
    width:100%;height:38px;appearance:none;
    border:1px solid rgba(132,150,174,.42);border-radius:10px;
    background:linear-gradient(180deg,#182436,#090f18);color:var(--text);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.32);
    font:850 11px/1 inherit;padding:0 4px;
  }
  .pent-button.key-on,.pent-button.chord-on{
    background:linear-gradient(180deg,#dfe6f0,#9daaba);
    color:#07101a;
  }
  /* Pentatonic overlay: compact ring INSIDE the 31px finger-position dot.
     Outer diameter is 27px. With a 3px black band, the inner opening is 21px:
     large enough to surround labels such as ♭13, while leaving the outside edge
     of the underlying finger-position dot visible. */
  .pent-dot,.pent-open-dot{
    position:absolute;
    width:27px;
    height:27px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:35;
    pointer-events:none;
    background:transparent !important;
    border:3px solid #050505;
    box-shadow:
      inset 0 0 0 1px var(--pent-outline,var(--green)),
      0 0 0 1px var(--pent-outline,var(--green));
    box-sizing:border-box;
  }
  .pent-open-dot{top:36.5px}
  .key-pent,.chord-pent{background:transparent !important}
  .fretboard-message{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:120;width:78%;padding:10px 12px;border-radius:12px;
    background:rgba(8,16,25,.93);border:1px solid rgba(160,180,205,.45);
    color:#fff;text-align:center;font-size:13px;font-weight:900;line-height:1.2;
    box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none;
  }

  .panel-stack{margin-top:2px}

  /* ================================================================
     3. Manual chord controls — one sequential panel at a time
     ================================================================ */
  .section{margin-top:12px}
  .section-title{font-size:11px;font-weight:900;letter-spacing:.3px;color:var(--muted);margin:0 0 6px}
  .root-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .identity-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .tone-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  button{appearance:none;border:1px solid rgba(132,150,174,.42);border-radius:11px;background:linear-gradient(180deg,#182436,#090f18);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.32);font:850 13px/1.05 inherit;padding:8px 5px;min-height:38px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button.active{background:linear-gradient(180deg,#dfe6f0,#9daaba);color:#07101a;border-color:#e9eef7;text-shadow:none}
  button.locked{box-shadow:inset 0 0 0 2px var(--root),0 3px 8px rgba(0,0,0,.32)}
  button:disabled{opacity:.32;cursor:default}

  /* ================================================================
     4. Static fretboard geometry retained from Comp-Map's exact board
     ================================================================ */
  .fretboard-column{display:flex;justify-content:center}
  .gm-exact-wrap{position:relative;width:223px;height:682px;flex:0 0 223px}
  .gm-exact-shell{position:absolute;left:20px;top:0;width:183px;height:642px;padding-top:56px}
  .gm-exact-openrow{position:absolute;left:0;top:0;width:183px;height:56px}
  .gm-exact-nut{position:absolute;left:0;top:52px;width:183px;height:14px;border-radius:4px;background:linear-gradient(90deg,#d9dee6,#f8fbff,#cbd2dc);box-shadow:0 2px 4px rgba(0,0,0,.5);z-index:15}
  .gm-exact-board{position:relative;width:183px;height:586px;background:linear-gradient(90deg,#3a2418 0%,#5b3824 50%,#3a2418 100%);border-radius:0 0 8px 8px;box-shadow:inset 0 0 22px rgba(0,0,0,.42),0 7px 18px rgba(0,0,0,.40);overflow:visible;isolation:isolate}
  .gm-exact-fret{position:absolute;left:0;width:183px;height:3px;background:linear-gradient(180deg,#f0f3f7,#8e959e);z-index:8;box-shadow:0 1px 1px rgba(0,0,0,.55)}
  .gm-exact-string{position:absolute;top:0;height:586px;transform:translateX(-50%);border-radius:999px;background:linear-gradient(90deg,#6f747b,#edf0f4 42%,#838991 70%);z-index:12;box-shadow:1px 0 2px rgba(0,0,0,.45)}
  .gm-exact-inlay{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(230,236,244,.42);z-index:5}
  .gm-exact-string-label{position:absolute;top:594px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;transform:translateX(-50%);color:var(--muted);font-size:12px;font-weight:700;z-index:40}
  .gm-exact-open{position:absolute;top:21px;width:31px;height:31px;display:flex;align-items:center;justify-content:center;transform:translateX(-50%);border-radius:50%;color:var(--muted);font-size:11px;font-weight:900;z-index:18}
  .fret-number{position:absolute;right:-18px;width:17px;transform:translateY(-50%);text-align:left;color:var(--muted);font-size:10px;font-weight:700;z-index:30}

  @media(max-width:650px){
    body{padding:6px}
    .app{padding:12px 10px;border-radius:22px}
    .workspace{grid-template-columns:minmax(0,1fr);gap:12px}
    .controls{order:2}
    .fretboard-column{order:1;min-height:682px}
    .root-grid{grid-template-columns:repeat(6,1fr);gap:5px}
    .identity-grid{grid-template-columns:repeat(2,1fr);gap:5px}
    .tone-grid{grid-template-columns:repeat(4,1fr);gap:5px}
    button{font-size:12px;padding:7px 3px;min-height:36px}
    .chord-name{font-size:28px}
  }


  /* ================================================================
     4a. Version 0.2 — iPhone portrait workspace
     Left third = controls, right two-thirds = persistent fretboard.
     ================================================================ */
  html,body{width:100%;min-height:100%;overflow-x:hidden}
  body{padding:0;display:flex;justify-content:center;align-items:flex-start}
  .app{
    width:min(100vw,430px);
    min-height:100dvh;
    margin:0 auto;
    padding:calc(10px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));
    border-radius:0;
    border-left:1px solid rgba(180,205,240,.12);
    border-right:1px solid rgba(180,205,240,.12);
  }
  .title{height:24px;margin:0 0 6px;font-size:11px;letter-spacing:1.7px;display:flex;align-items:center;justify-content:center}
  .workspace{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,2fr);
    gap:6px;
    width:100%;
    height:calc(100dvh - 48px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    min-height:700px;
    align-items:stretch;
  }
  .controls{min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
  .compact-readout{flex:0 0 auto;margin:0 0 6px;padding:7px 4px;border-radius:12px}
  .chord-name{font-size:22px;min-height:23px;overflow-wrap:anywhere}
  .family{font-size:9px;min-height:12px;margin-top:2px}
  .tones{gap:3px;min-height:20px;margin-top:5px}
  .tone-pill{min-width:21px;height:20px;padding:0 4px;font-size:10px}
  .panel-stack{position:relative;flex:1 1 auto;min-height:0}
  .control-panel{display:none;height:100%;overflow-y:auto;overflow-x:hidden;padding:1px 1px 8px;scrollbar-width:none}
  .control-panel::-webkit-scrollbar{display:none}
  .control-panel.active-panel{display:block}
  .panel-head{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:28px 1fr 28px;align-items:center;min-height:34px;margin-bottom:5px;background:linear-gradient(180deg,rgba(18,27,40,.98),rgba(12,19,29,.94));border-radius:10px}
  .panel-title{grid-column:2;text-align:center;color:var(--muted);font-size:10px;font-weight:950;letter-spacing:.55px}
  .back-btn{grid-column:1;width:28px;min-width:28px;height:28px;min-height:28px;padding:0;border-radius:9px;font-size:28px;line-height:22px;box-shadow:none}
  .root-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .identity-grid{grid-template-columns:1fr;gap:5px}
  .tone-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  button{font-size:11px;padding:7px 2px;min-height:36px;border-radius:10px;white-space:normal}
  .identity-grid button{font-size:10px;min-height:35px}

  .fretboard-column{min-width:0;height:100%;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;padding-top:0}
  .fretboard-scaler{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
  .gm-exact-wrap{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%) scale(var(--board-scale,1));
    transform-origin:top center;
  }

  @media(max-width:650px){
    body{padding:0}
    .app{padding-left:8px;padding-right:8px;border-radius:0}
    .workspace{grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:6px}
    .controls{order:1}
    .fretboard-column{order:2;min-height:0}
    .root-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
    .identity-grid{grid-template-columns:1fr;gap:5px}
    .tone-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
    button{font-size:11px;padding:7px 2px;min-height:36px}
    .chord-name{font-size:22px}
  }



  /* Pentatonic ring stays black; ONLY its fine outline changes green/red. */
  .pent-dot.pent-in-key,
  .pent-open-dot.pent-in-key{
    --pent-outline:var(--green);
  }
  .pent-dot.pent-out-of-key,
  .pent-open-dot.pent-out-of-key{
    --pent-outline:var(--red);
  }




  /* 0.18: one and only one fretboard color mechanism.
     Renderer supplies --marker-fill / --marker-ink / --pent-outline inline.
     Root has no visual class or color rule. */
  .gm-exact-open.active{
    cursor:pointer;
    user-select:none;
    background:var(--marker-fill) !important;
    color:var(--marker-ink) !important;
    border-color:var(--marker-fill) !important;
    box-shadow:0 3px 10px rgba(0,0,0,.45) !important;
  }
  .gm-exact-mark{
    position:absolute;
    cursor:pointer;
    user-select:none;
    width:31px;
    height:31px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:translate(-50%,-50%);
    background:var(--marker-fill) !important;
    color:var(--marker-ink) !important;
    border-color:var(--marker-fill) !important;
    font-size:12px;
    font-weight:950;
    z-index:25;
    box-shadow:0 3px 10px rgba(0,0,0,.45) !important;
  }
  .pent-dot,.pent-open-dot{
    background:transparent !important;
    border:3px solid #050505 !important;
    box-shadow:
      inset 0 0 0 1px var(--pent-outline),
      0 0 0 1px var(--pent-outline) !important;
  }


  /* 0.19: chord-readout tone circles use the same key-membership rule.
     In key = green, outside key = red. Root gets no special treatment. */
  .tone-pill.in-key{
    border-color:var(--green) !important;
    color:var(--green) !important;
  }
  .tone-pill.out-of-key{
    border-color:var(--red) !important;
    color:var(--red) !important;
  }


  /* 0.20 guide outlines for builder buttons.
     Green means the choice is diatonic to the current key; red means it is not.
     Fill/selected-state behavior is unchanged. */
  .guide-in-key{border-color:var(--green) !important;box-shadow:0 0 0 1px var(--green) !important}
  .guide-out-key{border-color:var(--red) !important;box-shadow:0 0 0 1px var(--red) !important}


  /* 0.24: plain-text fretboard label legend */
  .fretboard-column{position:relative}
  .fretboard-display-switch{
    position:absolute;
    top:4px;
    left:50%;
    transform:translateX(-50%);
    z-index:150;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    white-space:nowrap;
    color:var(--muted);
    font-size:10px;
    font-weight:750;
    line-height:1;
  }
  .fretboard-display-prefix{
    color:var(--muted);
    font-weight:800;
    margin-right:1px;
  }
  .fretboard-display-divider{
    color:rgba(174,185,200,.58);
    font-weight:700;
  }
  .fretboard-display-switch button{
    appearance:none;
    position:relative;
    min-width:0;
    min-height:0;
    height:auto;
    padding:2px 1px 5px;
    margin:0;
    border:0 !important;
    border-radius:0 !important;
    background:transparent !important;
    box-shadow:none !important;
    color:var(--muted);
    font-size:10px;
    font-weight:750;
    line-height:1;
  }
  .fretboard-display-switch button.active{
    color:var(--text) !important;
    font-weight:950;
    background:transparent !important;
    border:0 !important;
    box-shadow:none !important;
  }
  .fretboard-display-switch button.active::after{
    content:"";
    position:absolute;
    left:2px;
    right:2px;
    bottom:1px;
    height:1.5px;
    border-radius:999px;
    background:var(--text);
  }
  .fretboard-scaler{padding-top:0}


  /* 0.22: remove fret/string number labels and use the freed bottom space
     to lower the fretboard while leaving the Chord/Note/Key selector fixed. */
  .gm-exact-wrap{
    top:0 !important;
  }
  .gm-exact-string-label,
  .fret-number{
    display:none !important;
  }


  /* 0.26 Harmony guide dots: one per base harmony tone, in interval order. */
  .identity-grid button{
    position:relative;
    padding-bottom:15px;
  }
  .harmony-dot-row{
    position:absolute;
    left:50%;
    bottom:5px;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    pointer-events:none;
  }
  .harmony-guide-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    flex:0 0 5px;
  }
  .harmony-guide-dot.in-key{background:var(--green)}
  .harmony-guide-dot.out-key{background:var(--red)}


  /* 0.32: structural alignment of the top controls and label legend.
     Both now occupy the same grid row; no visual offset tuning is needed. */
  .workspace{
    grid-template-columns:minmax(0,1fr) minmax(0,2fr) !important;
    grid-template-rows:auto minmax(0,1fr) !important;
    align-items:stretch !important;
  }
  .workspace-top-left{
    grid-column:1;
    grid-row:1;
    min-width:0;
  }
  .workspace-top-right{
    grid-column:2;
    grid-row:1;
    min-width:0;
    position:relative;
    height:64px;
    overflow:visible;
  }
  .workspace-top-left .top-control-strip{
    margin-bottom:12px;
  }
  .controls{
    grid-column:1;
    grid-row:2;
    min-height:0;
  }
  .fretboard-column{
    grid-column:2;
    grid-row:2;
    min-height:0;
    position:relative;
  }
  .fretboard-display-switch{
    position:absolute !important;
    top:0 !important;
    left:50% !important;
    transform:translateX(-50%) !important;
  }


  /* 0.34: direct fixes for the two remaining layout mechanisms.

     1. The Labels legend is a normal flex row. All of its text shares one
        baseline; buttons no longer add their own vertical padding.
     2. The shared top row is only as tall as the left persistent controls.
        The fretboard column starts immediately on row 2 and the board itself
        is translated upward independently of the left column. */

  .workspace-top-right{
    height:52px !important;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    overflow:visible;
  }

  .fretboard-display-switch{
    position:static !important;
    transform:none !important;
    display:flex !important;
    align-items:baseline !important;
    justify-content:center !important;
    height:auto !important;
    padding:0 !important;
    margin:0 !important;
    line-height:1 !important;
  }

  .fretboard-display-prefix,
  .fretboard-display-divider,
  .fretboard-display-switch button{
    display:inline-block !important;
    vertical-align:baseline !important;
    line-height:1 !important;
    margin:0 !important;
  }

  .fretboard-display-switch button{
    padding:0 1px 5px !important;
  }

  .fretboard-display-switch button.active::after{
    bottom:0 !important;
  }

  /* Pull only the fretboard presentation upward. The controls/readout at left
     remain in their existing row and position. */
  .fretboard-column{
    overflow:visible !important;
  }
  .fretboard-scaler{
    padding-top:0 !important;
    transform:translateY(-76px);
    transform-origin:top center;
  }


  /* 0.37: preserve the raised fretboard while preventing bottom clipping. */
  .fretboard-column,
  .fretboard-scaler{
    overflow:visible !important;
  }
  .fretboard-column{
    min-height:682px !important;
  }
  .fretboard-scaler{
    height:calc(100% + 90px) !important;
  }


  /* 0.38 Key popup */
  .key-popup-button{
    width:100%;
    height:38px;
    appearance:none;
    border:1px solid rgba(132,150,174,.42);
    border-radius:10px;
    background:linear-gradient(180deg,#182436,#090f18);
    color:var(--text);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.32);
    font:850 10px/1 inherit;
    padding:0 4px;
  }
  .key-popup-overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.48);
    padding:18px;
  }
  .key-popup-overlay.show{display:flex}
  .key-popup{
    width:min(92vw,360px);
    border:1px solid rgba(155,176,205,.35);
    border-radius:18px;

      <div class="panel-stack">
        <section id="rootPanel" class="control-panel active-panel" aria-label="Root or triad selection">

    },

    },
    "Dm7♭5": {

    },

    },

    },
    "D11": {

    },

    {intervals:[0,3,7], label:"minor triad"},
    {intervals:[0,3,6], label:"diminished triad"},
    {intervals:[0,4,8], label:"augmented triad"},
    {intervals:[0,2,7], label:"sus2 triad"},
    {intervals:[0,5,7], label:"sus4 triad"}
  ];
